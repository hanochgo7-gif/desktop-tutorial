<title>Sayeret Nahal Alumni</title>

<style>
/* Concept: "the trek". The page reads as one journey: a Negev ridgeline opens it, a dotted trail threads the chapters, and the front ridge dissolves into the dark band where the story turns serious. Ivory for calm, olive for the moments that ask something of you. */
:root{
  --ivory:#f6f4ec; --paper:#fffdf6; --olive:#3d4c29; --olive-deep:#253217; --night:#1c2612;
  --sage:#a3b08d; --sage-mid:#c9d0b5; --sage-soft:#e4e8d8;
  --ink:#1d2218; --muted:#555c4a; --line:#d6d9c6; --edge:#7d8370;
  --gold:#75682f; --gold-on-dark:#e9dca4; --on-dark:#e7ecdb; --on-dark-muted:#bcc5a8;
  --display:"Frank Ruhl Libre","Times New Roman",Georgia,serif;
  --body:"Assistant","Segoe UI",Arial,sans-serif;
  --r:16px; --max:1120px; --header:68px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--ivory);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:var(--max);margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);line-height:1.12;text-wrap:balance;margin:0;color:var(--olive-deep)}
h2{font-size:clamp(30px,4.4vw,48px);font-weight:700}
h3{font-size:23px;font-weight:700}
p{margin:0}
a{color:var(--olive)}
img{max-width:100%}
[id]{scroll-margin-top:calc(var(--header) + 12px)}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}
.dark :focus-visible{outline-color:var(--gold-on-dark)}
.label{font-weight:800;font-size:14px;color:var(--gold)}
[lang="en"] .label{letter-spacing:.1em;text-transform:uppercase;font-size:13px}
.dark .label{color:var(--gold-on-dark)}
.lead{font-size:clamp(18px,2vw,21px);color:var(--muted);max-width:60ch}
.dark .lead{color:var(--on-dark-muted)}
section{padding-block:clamp(64px,9vw,112px)}
.head{display:grid;gap:14px;max-width:760px}
.skip{position:absolute;inset-inline-start:12px;top:-60px;background:var(--olive);color:#fff;padding:10px 16px;border-radius:10px;z-index:60;font-weight:700}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + 10px)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;border-radius:999px;padding:12px 26px;font:800 17px var(--body);text-decoration:none;cursor:pointer;border:2px solid var(--olive);transition:background .18s,color .18s,transform .18s;text-align:center}
.btn-primary{background:var(--olive);color:#fff}
.btn-primary:hover{background:var(--olive-deep);border-color:var(--olive-deep)}
.btn-ghost{background:transparent;color:var(--olive)}
.btn-ghost:hover{background:var(--sage-soft)}
.btn-light{background:var(--gold-on-dark);border-color:var(--gold-on-dark);color:var(--night)}
.btn-light:hover{background:#fff;border-color:#fff}
.btn:active{transform:translateY(1px)}
.btn .arr{display:inline-block;transition:transform .18s}
.btn:hover .arr{transform:translateX(3px)}
[dir="rtl"] .btn .arr{transform:scaleX(-1)}
[dir="rtl"] .btn:hover .arr{transform:scaleX(-1) translateX(3px)}

/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:var(--paper)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:var(--header)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--olive-deep);font-family:var(--display);font-weight:700;font-size:18px;line-height:1.1;min-width:0}
.brand img{width:50px;height:auto;flex:none}
.top nav{margin-inline-start:auto;display:flex;align-items:center;gap:10px}
.lang{display:inline-flex;border:1px solid var(--edge);border-radius:999px;overflow:hidden;background:var(--paper)}
.lang button{border:0;background:none;font:700 15px var(--body);min-width:48px;min-height:44px;padding:0 12px;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--olive);color:#fff}
.top .btn{min-height:44px;padding:8px 20px;font-size:16px}
.progress{position:absolute;inset-inline:0;bottom:-1px;height:2px;background:repeating-linear-gradient(90deg,var(--olive) 0 6px,transparent 6px 12px);transform-origin:left;transform:scaleX(0)}
[dir="rtl"] .progress{transform-origin:right}
@supports (animation-timeline: scroll()){
  .progress{animation:grow linear both;animation-timeline:scroll(root)}
  @keyframes grow{to{transform:scaleX(1)}}
}
@media (max-width:600px){.brand span{display:none}}

/* hero */
.hero{position:relative;padding-block:clamp(28px,4.5vw,56px) 0;overflow:hidden}
.hero .grid{display:grid;grid-template-columns:1.35fr .8fr;gap:clamp(24px,5vw,56px);align-items:center;position:relative;z-index:2}
.hero h1{font-size:clamp(40px,5.4vw,70px);font-weight:900;letter-spacing:-.015em}
.hero h1 .l2{display:block;color:var(--gold);font-weight:700}
.hero .lead{margin-top:22px}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.chips{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:22px;font-size:15px;color:var(--muted);padding:0;list-style:none}
.chips li{display:flex;align-items:center;gap:8px}
.chips li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sage);flex:none}
.medal{justify-self:center;margin:0}
.medal img{width:min(340px,100%);filter:drop-shadow(0 20px 34px rgba(37,50,23,.2))}
@media (max-width:820px){.hero .grid{grid-template-columns:1fr}.medal{display:none}}

/* urgency band */
.dark{background:var(--olive-deep);color:var(--on-dark)}
.dark h2,.dark h3{color:#fff}
.now{padding-top:clamp(24px,4vw,40px);margin-top:-2px}
.now .grid{display:grid;grid-template-columns:1.2fr 1fr;gap:clamp(28px,5vw,72px);align-items:end}
.big41{font-family:var(--display);font-weight:900;font-size:clamp(120px,22vw,260px);line-height:.82;color:#fff;letter-spacing:-.03em;font-variant-numeric:lining-nums}
.now .caption{margin-top:18px;font-size:clamp(19px,2.2vw,23px);color:var(--on-dark);max-width:34ch}
.now dl{margin:0;display:grid;gap:0}
.now dl div{padding-block:20px;border-top:1px solid rgba(231,236,219,.22)}
.now dl div:last-child{border-bottom:1px solid rgba(231,236,219,.22)}
.now dt{font-family:var(--display);font-weight:700;font-size:clamp(34px,4vw,46px);color:var(--gold-on-dark);line-height:1}
.now dd{margin:6px 0 0;color:var(--on-dark-muted);font-size:17px}
.now .src{margin-top:28px;font-size:14px;color:var(--on-dark-muted)}
@media (max-width:820px){.now .grid{grid-template-columns:1fr}}

/* uniform split */
.split-story{padding-block:0}
.uniform{display:grid;grid-template-columns:1fr 1fr}
.uniform > div{padding:clamp(48px,8vw,104px) clamp(20px,5vw,72px);display:grid;gap:16px;align-content:center;min-height:min(70vh,560px)}
.uniform .in{background:var(--night);color:var(--on-dark)}
.uniform .out{background:var(--paper)}
.uniform .in h2{color:#fff}
.uniform .in p{color:var(--on-dark-muted)}
.uniform .out p{color:var(--muted)}
.uniform h2{font-size:clamp(36px,5vw,60px);font-weight:900}
@media (max-width:760px){.uniform{grid-template-columns:1fr}.uniform>div{min-height:0}}

/* who */
.who .grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,6vw,80px);align-items:start;margin-top:36px}
.who .body{display:grid;gap:16px;color:var(--muted)}
.who .facts{margin:0;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.who .facts div{border-top:2px solid var(--olive);padding-top:12px;min-width:0}
.who .facts dt{font-family:var(--display);font-weight:900;font-size:clamp(34px,4vw,46px);color:var(--olive-deep);line-height:1}
.who .facts dd{margin:8px 0 0;font-size:15px;color:var(--muted)}
figure.quote{margin:28px 0 0;padding:24px 28px;background:var(--sage-soft);border-radius:var(--r)}
figure.quote blockquote{margin:0;font-family:var(--display);font-size:clamp(21px,2.4vw,26px);line-height:1.4;color:var(--olive-deep)}
figure.quote figcaption{margin-top:12px;font-size:15px;color:var(--muted)}
@media (max-width:820px){.who .grid{grid-template-columns:1fr}}
@media (max-width:420px){.who .facts{grid-template-columns:1fr 1fr}}

/* pillars on a trail */
.pillars{background:var(--paper);border-block:1px solid var(--line)}
.trail{list-style:none;margin:44px 0 0;padding:0;position:relative;display:grid;gap:20px}
.trail::before{content:"";position:absolute;inset-block:18px 18px;inset-inline-start:23px;border-inline-start:2px dashed var(--sage)}
.trail li{position:relative;display:grid;grid-template-columns:48px 1fr;gap:22px}
.trail .pin{width:48px;height:48px;border-radius:50%;background:var(--paper);border:2px solid var(--olive);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:20px;color:var(--olive);position:relative;z-index:1}
.trail .card{background:var(--ivory);border:1px solid var(--line);border-radius:var(--r);padding:clamp(20px,3vw,32px);display:grid;grid-template-columns:1fr auto;gap:8px 28px;align-items:start;min-width:0}
.trail .card .tag{grid-column:1/-1;font-size:14px;font-weight:800;color:var(--gold)}
.trail .card h3{grid-column:1}
.trail .card p{grid-column:1;color:var(--muted)}
.trail .card p.stat{grid-column:2;grid-row:2/4;text-align:end;min-width:120px;align-self:center}
.trail .stat b{display:block;font-family:var(--display);font-weight:900;font-size:clamp(40px,5vw,56px);line-height:1;color:var(--olive-deep);font-variant-numeric:lining-nums}
.trail .stat span{display:block;font-size:14px;color:var(--muted);margin-top:6px;max-width:16ch;margin-inline-start:auto}
@media (max-width:640px){.trail .card{grid-template-columns:1fr}.trail .card p.stat{grid-column:1;grid-row:auto;text-align:start}.trail .stat span{margin-inline-start:0}.trail li{grid-template-columns:36px 1fr;gap:14px}.trail .pin{width:36px;height:36px;font-size:16px}.trail::before{inset-inline-start:17px}}
.note{font-size:14px;color:var(--muted);margin-top:16px}
.dark .note{color:var(--on-dark-muted)}

/* donate */
.donate{background:var(--olive)}
.donate .grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,4vw,48px);margin-top:40px;align-items:start}
@media (max-width:880px){.donate .grid{grid-template-columns:1fr}}
.ladder{list-style:none;margin:0;padding:0;border-top:1px solid rgba(231,236,219,.3)}
.ladder li{display:grid;grid-template-columns:auto 1fr;gap:6px 20px;padding-block:18px;border-bottom:1px solid rgba(231,236,219,.3);align-items:baseline}
.ladder .amt{font-family:var(--display);font-weight:900;font-size:clamp(28px,3.4vw,38px);color:#fff;font-variant-numeric:lining-nums;min-width:4.6ch}
.ladder .what{color:var(--on-dark)}
.ladder a{grid-column:2;justify-self:start;display:inline-flex;align-items:center;min-height:40px;font-weight:700;font-size:15px;color:var(--gold-on-dark);text-underline-offset:4px}
.pay{background:var(--paper);color:var(--ink);border-radius:22px;padding:clamp(22px,3.6vw,36px);display:grid;gap:20px;box-shadow:0 30px 60px rgba(18,26,8,.3)}
.dark .pay h3{font-size:26px;color:var(--olive-deep)}
.pay .curr{display:grid;gap:12px}
.pay .curr .btn{width:100%;min-height:58px;font-size:19px;justify-content:space-between}
.pay .curr .btn small{font-weight:600;font-size:14px;opacity:.85}
@media (max-width:480px){.pay .curr .btn{flex-direction:column;gap:0;justify-content:center;padding-block:10px}}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:s}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:12px;font-size:16px;color:var(--muted);counter-increment:s}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--sage-soft);color:var(--olive-deep);display:grid;place-items:center;font-weight:800;font-size:15px}
.steps b{color:var(--ink)}
.secure{display:flex;flex-wrap:wrap;gap:8px}
.secure span{font-size:14px;font-weight:700;background:var(--ivory);border:1px solid var(--line);border-radius:999px;padding:6px 12px;color:var(--olive-deep)}
.pay .fine{font-size:14px;color:var(--muted)}
.other{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px}
.other > div{background:rgba(255,253,246,.07);border:1px solid rgba(231,236,219,.22);border-radius:var(--r);padding:20px;display:grid;gap:8px;align-content:start;font-size:16px;color:var(--on-dark);min-width:0}
.other h3{font-size:19px}
.other a{color:var(--gold-on-dark)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0;font-variant-numeric:tabular-nums}
.kv dt{color:var(--on-dark-muted)}
.kv dd{margin:0;font-weight:700;min-width:0;overflow-wrap:anywhere}
.copy{font:700 14px var(--body);min-height:40px;border:1px solid currentColor;background:transparent;border-radius:10px;padding:4px 12px;cursor:pointer;color:inherit;margin-inline-start:6px}
@media (max-width:880px){.other{grid-template-columns:1fr}}

/* adopt */
.adopt .box{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center;border:2px solid var(--olive);border-radius:24px;padding:clamp(24px,4vw,44px);background:var(--paper)}
@media (max-width:760px){.adopt .box{grid-template-columns:1fr}}

/* transparency */
.money .grid{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(28px,5vw,64px);margin-top:36px;align-items:start}
@media (max-width:880px){.money .grid{grid-template-columns:1fr}}
.bars{display:grid;gap:14px;margin:0;padding:0;list-style:none}
.bars li{display:grid;gap:6px;font-size:16px}
.bars .row{display:flex;justify-content:space-between;gap:12px}
.bars b{font-variant-numeric:tabular-nums;white-space:nowrap}
.bars b small{font-weight:600;color:var(--muted);font-size:14px}
.bars .track{height:12px;border-radius:6px;background:var(--sage-soft);overflow:hidden}
.bars .fill{display:block;height:100%;border-radius:6px;background:var(--olive)}
.bars .ops .fill{background:var(--sage)}
.ops-note{margin-top:20px;padding:16px 18px;border-radius:12px;background:var(--sage-soft);font-size:16px;color:var(--olive-deep)}
.reg{margin:0;display:grid;border-top:1px solid var(--line)}
.reg div{display:grid;grid-template-columns:minmax(0,14ch) 1fr;gap:12px;padding-block:13px;border-bottom:1px solid var(--line);font-size:16px}
.reg dt{color:var(--muted)}
.reg dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums;min-width:0}
@media (max-width:480px){.reg div{grid-template-columns:1fr;gap:2px}}

/* faq */
.faq{display:grid;gap:10px;margin-top:32px;max-width:820px}
details{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:0 20px}
summary{cursor:pointer;font-weight:800;padding:18px 0;list-style:none;display:flex;justify-content:space-between;gap:12px;min-height:44px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:24px;line-height:1;color:var(--olive);flex:none}
details[open] summary::after{content:"–"}
details p{padding-bottom:18px;color:var(--muted)}

/* closing */
.closing{text-align:center;position:relative;overflow:hidden}
.closing .wrap{display:grid;justify-items:center;gap:20px}
.closing h2{font-size:clamp(38px,6vw,72px);font-weight:900}
.closing .ctas{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.contacts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px;width:100%;max-width:900px;text-align:start}
.contacts > div{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0;font-size:16px}
.contacts b{display:block;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;user-select:all}
.contacts a{font-size:15px;font-weight:700;display:inline-flex;align-items:center;min-height:44px;margin-inline-end:14px}
[dir="rtl"] .contacts b{text-align:right}
.contacts .copy{min-height:44px}
.contacts .copy{color:var(--olive);margin:6px 0 0}
@media (max-width:760px){.contacts{grid-template-columns:1fr}}
footer{border-top:1px solid var(--line);padding-block:28px calc(28px + 76px);font-size:14px;color:var(--muted)}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
@media (min-width:821px){footer{padding-bottom:28px}}

/* sticky mobile donate bar */
.dockbar{position:fixed;inset-inline:0;bottom:0;z-index:45;background:var(--paper);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;gap:12px;align-items:center;box-shadow:0 -10px 30px rgba(18,26,8,.12);transition:transform .25s}
.dockbar p{font-size:14px;color:var(--muted);line-height:1.3;flex:1;min-width:0}
.dockbar .btn{min-height:48px;flex:none}
.dockbar.off{transform:translateY(110%)}
@media (min-width:821px){.dockbar{display:none}}

/* scroll reveal: elements rest fully visible; motion only adds a gentle lift where supported */
@media (prefers-reduced-motion:no-preference){
  @supports (animation-timeline: view()){
    .rv{animation:lift linear both;animation-timeline:view();animation-range:entry 0% entry 55%}
    @keyframes lift{from{transform:translateY(32px)}to{transform:none}}
  }
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}

/* paintings, icons, texture */
.hero{background:#f8f5ea}
.vista{position:relative;z-index:1;margin-top:calc(-1 * clamp(10px,6vw,120px));overflow:hidden}
.vista .paint{display:block;width:100%;height:clamp(240px,38vw,600px);object-fit:cover;object-position:18% 78%}
.vista.mirror .paint,.vista.mirror .front{transform:scaleX(-1)}
.vista .front{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:clamp(40px,6vw,92px);display:block}
.illus{position:absolute;z-index:3;inset-inline-end:max(16px,env(safe-area-inset-right,0px));font:700 12px var(--body);color:var(--muted);background:rgba(255,253,246,.82);padding:3px 10px;border-radius:999px}
.vista .illus{top:max(12px,calc(clamp(10px,6vw,120px) + 8px))}
.now{background:linear-gradient(rgba(37,50,23,.62),rgba(37,50,23,.62)),#2c3a1c url(__A_topo__) center/cover}
.trail::before{inset-inline-start:27px}
.trail li{grid-template-columns:56px 1fr}
.trail .pin{width:56px;height:56px;background:var(--ivory)}
.trail .pin img{width:36px;height:36px}
@media (max-width:640px){.trail li{grid-template-columns:44px 1fr}.trail .pin{width:44px;height:44px}.trail .pin img{width:30px;height:30px}.trail::before{inset-inline-start:21px}}
.closing{padding-top:0;background:var(--ivory)}
.fireband{position:relative;overflow:hidden;background:#2c3a1c}
.fireband .paint{display:block;width:100%;height:clamp(540px,56vw,800px);object-fit:cover;object-position:center 82%}
.fireband::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(to bottom,rgba(37,50,23,.94) 0%,rgba(37,50,23,.72) 34%,rgba(37,50,23,0) 64%)}
.fireband .over{position:absolute;left:0;right:0;top:0;z-index:2;padding-block:clamp(48px,7vw,96px)}
.fireband h2{color:#fff}
.fireband .lead{color:var(--on-dark)}
.fireband .btn-primary{background:var(--gold-on-dark);border-color:var(--gold-on-dark);color:var(--night)}
.fireband .btn-primary:hover{background:#fff;border-color:#fff}
.btn-onfire{background:rgba(28,38,18,.82);border-color:var(--gold-on-dark);color:var(--gold-on-dark)}
.btn-onfire:hover{background:rgba(28,38,18,.95)}
.fireband .lead{text-shadow:0 1px 14px rgba(20,28,10,.9)}
@media (max-width:820px){.fireband::before{background:linear-gradient(to bottom,rgba(37,50,23,.95) 0%,rgba(37,50,23,.88) 50%,rgba(37,50,23,0) 86%)}}
.fireband :focus-visible{outline-color:var(--gold-on-dark)}
.fireband .illus{bottom:12px}
.closing > .wrap{padding-block:clamp(32px,5vw,56px)}
.closing .contacts{margin-top:0}
@media (prefers-reduced-motion:no-preference){
  @supports (animation-timeline: view()){
    .vista .paint{animation:sink linear both;animation-timeline:view();animation-range:exit 0% exit 100%}
    .vista.mirror .paint{animation-name:sinkm}
    @keyframes sink{to{transform:translateY(36px) scale(1.04)}}
    @keyframes sinkm{to{transform:scaleX(-1) translateY(36px) scale(1.04)}}
  }
}

/* companies + abroad */
.nav-adopt{min-height:44px;padding:8px 18px;font-size:16px}
@media (max-width:720px){.nav-adopt{display:none}}
.abroad-hint{margin-top:16px;font-size:15px;color:var(--muted)}
.linkish{background:none;border:0;padding:6px 0;min-height:40px;font:700 15px var(--body);color:var(--olive);text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.adopt2{background:var(--paper);border-block:1px solid var(--line)}
.adopt-grid,.abroad-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(28px,5vw,64px);align-items:center}
.abroad-grid{grid-template-columns:1.1fr .9fr}
.adopt-art,.abroad-art{margin:0;position:relative;border-radius:24px;overflow:hidden;box-shadow:0 30px 60px rgba(37,50,23,.16)}
.adopt-art .paint,.abroad-art .paint{display:block;width:100%;aspect-ratio:4/3;height:auto;object-fit:cover}
.adopt-art .illus{bottom:12px}.abroad-art .illus{top:12px}
.adopt-body,.abroad-body{display:grid;gap:22px;min-width:0}
.figure-card{display:grid;grid-template-columns:auto 1fr;gap:6px 20px;align-items:center;background:var(--olive-deep);color:var(--on-dark);border-radius:18px;padding:20px 24px}
.figure-card b{font-family:var(--display);font-weight:900;font-size:clamp(36px,4.4vw,52px);color:#fff;line-height:1;font-variant-numeric:lining-nums}
.figure-card span{font-size:16px;color:var(--on-dark-muted)}
@media (max-width:480px){.figure-card{grid-template-columns:1fr}}
.howto{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;counter-reset:h}
.howto li{counter-increment:h;border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--ivory);display:grid;gap:4px;font-size:15px;color:var(--muted)}
.howto li b{font-size:17px;color:var(--olive-deep)}
.howto li b::before{content:counter(h) ". ";color:var(--gold)}
@media (max-width:520px){.howto{grid-template-columns:1fr}}
.assure{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.assure li{font-size:14px;font-weight:700;color:var(--olive-deep);background:var(--sage-soft);border-radius:999px;padding:6px 14px}
.adopt-body .ctas{display:flex;flex-wrap:wrap;gap:12px}
.adopt-body .note b{color:var(--ink);font-variant-numeric:tabular-nums}
@media (max-width:880px){.adopt-grid,.abroad-grid{grid-template-columns:1fr}.abroad-art{order:-1}}
.routes{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.routes li{display:grid;grid-template-columns:44px 1fr;gap:16px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.rnum{width:44px;height:44px;border-radius:50%;border:2px solid var(--olive);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:19px;color:var(--olive)}
.routes h3{font-size:21px}
.routes p{color:var(--muted);font-size:16px;margin-top:4px}
.routes a{display:inline-flex;align-items:center;min-height:40px;font-weight:800;font-size:15px;text-underline-offset:4px}
.yearend{font-size:15px;color:var(--olive-deep);background:var(--sage-soft);border-radius:12px;padding:12px 16px}
</style>

__HE__
__EN__
</div>

<script>
(function(){
  var lang="he";
  function views(){return document.querySelectorAll(".v")}
  function cur(){return document.querySelector('.v[data-lang="'+lang+'"]')}
  function section(){
    var best=null,off=0; cur().querySelectorAll("[data-sec]").forEach(function(s){var t=s.getBoundingClientRect().top; if(t<innerHeight*.35){best=s.dataset.sec; off=-t}});
    return best?{id:best,off:off}:null;
  }
  function setLang(l,keep){
    var sec=keep?section():null; lang=l;
    views().forEach(function(v){v.hidden=v.dataset.lang!==l});
    document.documentElement.lang=l; document.documentElement.dir=l==="he"?"rtl":"ltr";
    document.title=l==="he"?"עמותת בוגרי סיירת נח\"ל":"Sayeret Nahal Alumni";
    try{localStorage.setItem("snl-lang",l)}catch(e){}
    if(keep){
      try{history.replaceState(null,"","#"+l)}catch(e){}
      var t=sec&&document.getElementById(sec.id+"-"+l);
      if(t){ var r=t.getBoundingClientRect(); var off=Math.min(sec.off,Math.max(0,r.height-innerHeight*.5)); scrollTo({top:r.top+scrollY+off,behavior:"instant"}); } else scrollTo({top:0,behavior:"instant"});
      var fb=cur().querySelector('.lang button[data-set-lang="'+l+'"]'); if(fb) try{fb.focus({preventScroll:true})}catch(e){fb.focus()}
    }
    watchDock();
  }
  document.addEventListener("click",function(e){
    var b=e.target.closest("button"); if(!b) return;
    if(b.dataset.setLang){
      if(b.dataset.goto){ setLang(b.dataset.setLang,false); var g=document.getElementById(b.dataset.goto+"-"+lang); if(g) g.scrollIntoView({behavior:"instant"}); var f=g&&g.querySelector("h2"); if(f){f.setAttribute("tabindex","-1");try{f.focus({preventScroll:true})}catch(e){}} return; }
      if(b.dataset.setLang!==lang) setLang(b.dataset.setLang,true); return; }
    if(b.dataset.copy){
      var old=b.textContent, txt=b.dataset.copy;
      var ok=function(){b.textContent=lang==="he"?"הועתק":"Copied";setTimeout(function(){b.textContent=old},1600)};
      var fail=function(){var el=b.parentElement.querySelector("b,[data-sel]"); if(!el) return; try{var r=document.createRange();r.selectNodeContents(el);var s=getSelection();s.removeAllRanges();s.addRange(r)}catch(x){} b.textContent=lang==="he"?"סומן, העתיקו ידנית":"Selected, copy manually"; setTimeout(function(){b.textContent=old},2600)};
      try{navigator.clipboard.writeText(txt).then(ok,fail)}catch(x){fail()}
    }
  });

  /* sticky donate bar: visible after the hero, hidden while the donate section is on screen */
  var io=null,io2=null;
  function watchDock(){
    if(!("IntersectionObserver" in window)) return;
    if(io) io.disconnect();
    var v=cur(), bar=v.querySelector(".dockbar"), hero=v.querySelector(".hero"), don=v.querySelector(".donate"), closing=v.querySelector(".closing");
    if(!bar) return;
    var st={hero:true,don:false,close:false};
    function upd(){bar.classList.toggle("off",st.hero||st.don||st.close); bar.setAttribute("aria-hidden",st.hero||st.don||st.close)}
    var cb=function(es){es.forEach(function(e){
      if(e.target===hero) st.hero=e.isIntersecting; else if(e.target===don) st.don=e.isIntersecting; else st.close=e.isIntersecting;
    });upd()};
    io=new IntersectionObserver(cb,{threshold:0,rootMargin:"0px 0px -45% 0px"});
    io.observe(hero);io.observe(don);
    if(io2) io2.disconnect();
    if(closing){io2=new IntersectionObserver(cb,{threshold:0,rootMargin:"0px 0px -78% 0px"});io2.observe(closing)}
    upd();
  }

  /* respect reduced motion for the SVG walkers */


  /* starting language: hash, then saved choice, then browser language */
  var h=(location.hash||"").slice(1), start=null, saved=null;
  try{saved=localStorage.getItem("snl-lang")}catch(e){}
  if(h==="en"||/-en$/.test(h)) start="en"; else if(h==="he"||/-he$/.test(h)) start="he";
  else if(saved==="he"||saved==="en") start=saved;
  else start=/^he\b/i.test(navigator.language||"he")?"he":"en";
  setLang(start,false);
  if(/-(he|en)$/.test(h)){var t=document.getElementById(h); if(t) setTimeout(function(){t.scrollIntoView()},0)}
  addEventListener("hashchange",function(){var x=location.hash.slice(1); if((x==="en"||x==="he")&&x!==lang) setLang(x,false)});
})();
</script>
