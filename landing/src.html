<style>
/* Concept: "the trek". The page reads as one journey: a Negev ridgeline opens it, a dotted trail threads the chapters, and the front ridge dissolves into the dark band where the story turns serious. Ivory for calm, olive for the moments that ask something of you. */
:root{
  --ivory:#f6f4ec; --paper:#fffdf6; --olive:#3d4c29; --olive-deep:#253217; --night:#1c2612;
  --sage:#a3b08d; --sage-mid:#c9d0b5; --sage-soft:#e4e8d8;
  --ink:#1d2218; --muted:#555c4a; --line:#d6d9c6; --edge:#7d8370;
  --gold:#75682f; --gold-on-dark:#e9dca4; --on-dark:#e7ecdb; --on-dark-muted:#bcc5a8;
  --display:"Frank Ruhl Libre","Times New Roman",Georgia,serif;
  --body:"Assistant","Segoe UI",Arial,sans-serif;
  --r:16px; --max:1120px; --header:68px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--ivory);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:var(--max);margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);line-height:1.12;text-wrap:balance;margin:0;color:var(--olive-deep)}
h2{font-size:clamp(30px,4.4vw,48px);font-weight:700}
h3{font-size:23px;font-weight:700}
p{margin:0}
a{color:var(--olive)}
img{max-width:100%}
[id]{scroll-margin-top:calc(var(--header) + 12px)}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}
.dark :focus-visible{outline-color:var(--gold-on-dark)}
.label{font-weight:800;font-size:14px;color:var(--gold)}
[lang="en"] .label{letter-spacing:.1em;text-transform:uppercase;font-size:13px}
.dark .label{color:var(--gold-on-dark)}
.lead{font-size:clamp(18px,2vw,21px);color:var(--muted);max-width:60ch}
.dark .lead{color:var(--on-dark-muted)}
section{padding-block:clamp(64px,9vw,112px)}
.head{display:grid;gap:14px;max-width:760px}
.skip{position:absolute;inset-inline-start:12px;top:-60px;background:var(--olive);color:#fff;padding:10px 16px;border-radius:10px;z-index:60;font-weight:700}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + 10px)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;border-radius:999px;padding:12px 26px;font:800 17px var(--body);text-decoration:none;cursor:pointer;border:2px solid var(--olive);transition:background .18s,color .18s,transform .18s;text-align:center}
.btn-primary{background:var(--olive);color:#fff}
.btn-primary:hover{background:var(--olive-deep);border-color:var(--olive-deep)}
.btn-ghost{background:transparent;color:var(--olive)}
.btn-ghost:hover{background:var(--sage-soft)}
.btn-light{background:var(--gold-on-dark);border-color:var(--gold-on-dark);color:var(--night)}
.btn-light:hover{background:#fff;border-color:#fff}
.btn:active{transform:translateY(1px)}
.btn .arr{display:inline-block;transition:transform .18s}
.btn:hover .arr{transform:translateX(3px)}
[dir="rtl"] .btn .arr{transform:scaleX(-1)}
[dir="rtl"] .btn:hover .arr{transform:scaleX(-1) translateX(3px)}

/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:var(--paper)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:var(--header)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--olive-deep);font-family:var(--display);font-weight:700;font-size:18px;line-height:1.1;min-width:0}
.brand img{width:50px;height:auto;flex:none}
.top nav{margin-inline-start:auto;display:flex;align-items:center;gap:10px}
.lang{display:inline-flex;border:1px solid var(--edge);border-radius:999px;overflow:hidden;background:var(--paper)}
.lang button{border:0;background:none;font:700 15px var(--body);min-width:48px;min-height:44px;padding:0 12px;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--olive);color:#fff}
.top .btn{min-height:44px;padding:8px 20px;font-size:16px}
.progress{position:absolute;inset-inline:0;bottom:-1px;height:2px;background:repeating-linear-gradient(90deg,var(--olive) 0 6px,transparent 6px 12px);transform-origin:left;transform:scaleX(0)}
[dir="rtl"] .progress{transform-origin:right}
@supports (animation-timeline: scroll()){
  .progress{animation:grow linear both;animation-timeline:scroll(root)}
  @keyframes grow{to{transform:scaleX(1)}}
}
@media (max-width:600px){.brand span{display:none}}

/* hero */
.hero{position:relative;padding-block:clamp(28px,4.5vw,56px) 0;overflow:hidden}
.hero .grid{display:grid;grid-template-columns:1.35fr .8fr;gap:clamp(24px,5vw,56px);align-items:center;position:relative;z-index:2}
.hero h1{font-size:clamp(40px,5.4vw,70px);font-weight:900;letter-spacing:-.015em}
.hero h1 .l2{display:block;color:var(--gold);font-weight:700}
.hero .lead{margin-top:22px}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.chips{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:22px;font-size:15px;color:var(--muted);padding:0;list-style:none}
.chips li{display:flex;align-items:center;gap:8px}
.chips li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sage);flex:none}
.medal{justify-self:center;margin:0}
.medal img{width:min(340px,100%);filter:drop-shadow(0 20px 34px rgba(37,50,23,.2))}
@media (max-width:820px){.hero .grid{grid-template-columns:1fr}.medal{display:none}}

/* urgency band */
.dark{background:var(--olive-deep);color:var(--on-dark)}
.dark h2,.dark h3{color:#fff}
.now{padding-top:clamp(24px,4vw,40px);margin-top:-2px}
.now .grid{display:grid;grid-template-columns:1.2fr 1fr;gap:clamp(28px,5vw,72px);align-items:end}
.big41{font-family:var(--display);font-weight:900;font-size:clamp(120px,22vw,260px);line-height:.82;color:#fff;letter-spacing:-.03em;font-variant-numeric:lining-nums}
.now .caption{margin-top:18px;font-size:clamp(19px,2.2vw,23px);color:var(--on-dark);max-width:34ch}
.now dl{margin:0;display:grid;gap:0}
.now dl div{padding-block:20px;border-top:1px solid rgba(231,236,219,.22)}
.now dl div:last-child{border-bottom:1px solid rgba(231,236,219,.22)}
.now dt{font-family:var(--display);font-weight:700;font-size:clamp(34px,4vw,46px);color:var(--gold-on-dark);line-height:1}
.now dd{margin:6px 0 0;color:var(--on-dark-muted);font-size:17px}
.now .src{margin-top:28px;font-size:14px;color:var(--on-dark-muted)}
@media (max-width:820px){.now .grid{grid-template-columns:1fr}}
.now-h{font-size:clamp(40px,5.6vw,72px);font-weight:900;color:#fff;margin-top:10px;max-width:16ch}
.now-h em{font-style:normal;color:var(--gold-on-dark)}
.causes{list-style:none;margin:clamp(28px,4vw,48px) 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.causes li{display:grid;align-content:start;gap:10px;padding:22px 20px;border:1px solid rgba(231,236,219,.22);border-radius:18px;background:rgba(14,20,9,.35)}
.causes b{font-family:var(--display);font-weight:900;font-size:clamp(34px,3.6vw,52px);line-height:1;color:var(--gold-on-dark)}
.causes span{font-size:17px;line-height:1.5;color:var(--on-dark)}
.effect{margin-top:18px;padding:clamp(24px,4vw,44px);border-radius:22px;background:rgba(233,220,164,.1);border:1px solid rgba(233,220,164,.4);display:grid;gap:12px;justify-items:start}
.eff-arrow{font-size:34px;line-height:1;color:var(--gold-on-dark);margin:0}
.eff-num{font-family:var(--display);font-weight:900;font-size:clamp(84px,12vw,150px);line-height:.9;color:#fff;margin:0}
.eff-text{font-size:clamp(19px,2.2vw,24px);line-height:1.5;color:var(--on-dark);max-width:44ch;margin:0}
.eff-text strong{color:#fff}
.eff-next{font-size:18px;color:var(--gold-on-dark);font-weight:700;max-width:52ch;margin:0}
.effect .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
.btn-ghost-light{background:transparent;border:2px solid rgba(233,220,164,.7);color:var(--gold-on-dark)}
.btn-ghost-light:hover{border-color:#fff;color:#fff}
@media (max-width:900px){.causes{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.causes{grid-template-columns:1fr}.causes li{grid-template-columns:auto 1fr;align-items:baseline;gap:14px}.causes b{font-size:34px}}

/* uniform split */
/* ---- story scroll scene: one team as 18 abstract dots. formation -> scattered -> circle ---- */
.scene{position:relative;background:var(--night);color:var(--on-dark);--t1:1;--t2:1;--o1:1;--o2:1;--o3:1}
.scene .stage{position:relative;overflow:hidden;display:grid;grid-template-columns:1fr;align-items:center;gap:clamp(16px,4vw,48px);padding:clamp(56px,8vw,104px) max(16px,calc((100vw - 1160px)/2))}
.scene .sky,.scene .sky i{position:absolute;inset:0}
.scene .sky i{display:block}
/* three watercolor paintings (illustrations, no people) cross-fade under the dots: packs in rows -> one pack alone -> packs around a fire */
.scene .sky .pa{position:absolute;inset:0;background:var(--night) center 60%/cover no-repeat;transform:scale(calc(1.05 - .05 * var(--p,1)));will-change:opacity,transform}
.scene .sky .p2{opacity:var(--t1)}
.scene .sky .p3{opacity:var(--t2)}
.scene .sky::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(14,20,9,.95) 0%,rgba(14,20,9,.8) 28%,rgba(14,20,9,.12) 58%,rgba(14,20,9,.2) 80%,rgba(14,20,9,.5) 100%)}
@media (min-width:761px){
  .scene .sky::after{background:linear-gradient(to top,rgba(14,20,9,.92) 0%,rgba(14,20,9,.6) 24%,rgba(14,20,9,.08) 50%,rgba(14,20,9,.15) 78%,rgba(14,20,9,.5) 100%)}
  .scene .beats{max-width:680px}
}
.scene.near .p1{background-image:url(__A_scene1w__)}
.scene.near .p2{background-image:url(__A_scene2w__)}
.scene.near .p3,.scene:not(.live) .p3{background-image:url(__A_teamcircle__);background-position:50% 80%}
@media (max-aspect-ratio:4/5){
  .scene.near .p1{background-image:url(__A_scene1t__)}
  .scene.near .p2{background-image:url(__A_scene2t__)}
  .scene.near .p3,.scene:not(.live) .p3{background-position:50% 50%}
}
.scene .illus{top:12px;z-index:2}
.scene .il-paint{opacity:calc(1 - var(--t2))}
.scene .il-photo{opacity:var(--t2)}
.scene:not(.live) .il-paint{display:none}
/* last beat is a real photo: text moves up, the circle stays visible below */
.scene .sky::after{opacity:calc(1 - var(--t2))}
.scene .sky .shade3{position:absolute;inset:0;opacity:var(--t2);background:linear-gradient(to bottom,rgba(14,20,9,.55) 0%,rgba(14,20,9,.82) 38%,rgba(14,20,9,.55) 58%,rgba(14,20,9,.05) 76%,rgba(14,20,9,.1) 100%)}
.scene:not(.live) .sky .shade3{display:none}
.scene.live .illus{top:calc(var(--hdr,70px) + 12px)}
.scene:not(.live) .p1,.scene:not(.live) .p2{display:none}
.scene:not(.live) .sky::after{background:rgba(14,20,9,.78)}
.scene .dots{position:relative;z-index:1;width:min(46vw,30svh,300px);aspect-ratio:1;justify-self:center;container-type:size}
.scene .dots::after{content:"";position:absolute;left:50%;top:50%;width:62cqw;height:62cqw;margin:-31cqw;border-radius:50%;border:1px dashed rgba(233,220,164,.35);opacity:var(--t2);transform:scale(calc(.85 + .15 * var(--t2)))}
.scene .dots i{position:absolute;left:50%;top:50%;width:3.4cqw;height:3.4cqw;min-width:10px;min-height:10px;margin:-1.7cqw;border-radius:50%;background:var(--gold-on-dark);
  --x:calc(var(--x0) + (var(--x1) - var(--x0)) * var(--t1) + (var(--x2) - var(--x1)) * var(--t2));
  --y:calc(var(--y0) + (var(--y1) - var(--y0)) * var(--t1) + (var(--y2) - var(--y1)) * var(--t2));
  transform:translate(calc(var(--x) * 1cqw),calc(var(--y) * 1cqw)) scale(calc(1 - .35 * var(--t1) + .35 * var(--t2)));
  opacity:calc(1 - (.62 + .2 * var(--d)) * var(--t1) + (.62 + .2 * var(--d)) * var(--t2));
  box-shadow:0 0 calc(18px * var(--t2)) rgba(240,190,110,calc(.65 * var(--t2)))}
.scene .beats{position:relative;z-index:1;display:grid}
.scene .beat{grid-area:1/1;display:grid;gap:14px;align-content:center}
.scene .beat .label{color:var(--gold-on-dark)}
.scene .beat h2{font-size:clamp(36px,5vw,62px);font-weight:900;color:#fff}
.scene .beat p:not(.label){color:var(--on-dark-muted);max-width:30em}
.scene .b1{opacity:var(--o1);transform:translateY(calc((1 - var(--o1)) * -18px))}
.scene .b2{opacity:var(--o2);transform:translateY(calc((1 - var(--o2)) * 18px))}
.scene .b3{opacity:var(--o3);transform:translateY(calc((1 - var(--o3)) * 18px))}
.scene .scene-hint{display:none}
/* static fallback (no JS or reduced motion): show the three beats in order, dots in their circle */
.scene:not(.live) .beats{gap:40px}
.scene:not(.live) .beat{grid-area:auto}
/* live: pinned stage, scroll drives --t1/--t2 and the beat opacities */
.scene.live{height:250vh}
.scene.live .stage{position:sticky;top:0;height:100vh;height:100svh;padding-block:calc(var(--hdr,70px) + 16px) 40px;grid-template-rows:auto minmax(0,1fr);align-items:stretch}
.scene.live .dots{align-self:start}
.scene.live .beats{align-self:stretch}
.scene.live .b1,.scene.live .b2{align-self:end}
.scene.live .b3{align-self:start;padding-top:8px}
.scene.live .beat{pointer-events:none}
.scene.live .scene-hint{display:block;position:absolute;z-index:1;bottom:22px;left:0;right:0;text-align:center;font-size:13px;letter-spacing:.06em;color:var(--on-dark-muted);opacity:calc(1 - var(--t1))}
.scene.live .scene-hint span{display:inline-block;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(5px)}}
@media (max-width:760px){
  .scene.live .stage{gap:8px;padding-bottom:96px}
  .scene .dots{width:min(54vw,27svh,240px)}
  .scene .beat h2{font-size:clamp(32px,9vw,44px)}
  .scene .beat p:not(.label){font-size:16px}
  .scene.live .scene-hint{bottom:84px}
}
/* ---- motion layer 2 (research picks): ink-sweep headings, embers, staggered steps, button feedback, language wipe ---- */
.embers{position:absolute;z-index:1;left:calc(50% - .05 * max(100%, clamp(540px,56vw,800px) * 1.768));bottom:27%;width:0;height:0;pointer-events:none}
.embers::before{content:"";position:absolute;left:-150px;top:-150px;width:300px;height:300px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,150,60,.42),rgba(255,150,60,0));opacity:.75}
.embers i{position:absolute;left:var(--dx);top:0;width:6px;height:6px;border-radius:50%;background:#fff1c9;box-shadow:0 0 10px 4px rgba(255,130,40,.85);opacity:0}
.btn:active{transform:scale(.97)}
[dir="rtl"] .btn:hover .arr{transform:scaleX(-1) translateX(4px)}
@media (prefers-reduced-motion:no-preference){
  .embers::before{animation:breathe 4.2s ease-in-out infinite}
  .embers i{animation:ember 4.6s linear infinite;animation-delay:calc(var(--k) * -.58s)}
  .fireband:not(.on) .embers::before,.fireband:not(.on) .embers i{animation-play-state:paused}
  @keyframes breathe{50%{opacity:1;transform:scale(1.12)}}
  @keyframes ember{0%{transform:translate(0,0) scale(1);opacity:0}12%{opacity:.95}70%{opacity:.5}100%{transform:translate(var(--sx),calc(var(--h) * -1)) scale(.4);opacity:0}}
  .js-reveal .stagger > *{opacity:0;transform:translateY(12px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.2,1)}
  .js-reveal .stagger.in > *{opacity:1;transform:none}
  .js-reveal .stagger.in > :nth-child(2){transition-delay:.14s}
  .js-reveal .stagger.in > :nth-child(3){transition-delay:.28s}
  .js-reveal .stagger.in > :nth-child(4){transition-delay:.42s}
  @supports (animation-timeline:view()){
    .head h2,.closing h2{-webkit-mask-image:linear-gradient(to left,#000 44%,rgba(0,0,0,.14) 58%);mask-image:linear-gradient(to left,#000 44%,rgba(0,0,0,.14) 58%);-webkit-mask-size:260% 100%;mask-size:260% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;animation:ink-rtl linear both;animation-timeline:view();animation-range:entry 5% cover 36%}
    .v[data-lang="en"] .head h2,.v[data-lang="en"] .closing h2{-webkit-mask-image:linear-gradient(to right,#000 44%,rgba(0,0,0,.14) 58%);mask-image:linear-gradient(to right,#000 44%,rgba(0,0,0,.14) 58%);animation-name:ink-ltr}
    @keyframes ink-rtl{from{-webkit-mask-position:0 0;mask-position:0 0}to{-webkit-mask-position:100% 0;mask-position:100% 0}}
    @keyframes ink-ltr{from{-webkit-mask-position:100% 0;mask-position:100% 0}to{-webkit-mask-position:0 0;mask-position:0 0}}
  }
  ::view-transition-old(root){animation:none}
  ::view-transition-new(root){animation:.55s cubic-bezier(.3,.7,.2,1) both wipe-rtl}
  html[data-vt="en"]::view-transition-new(root){animation-name:wipe-ltr}
  @keyframes wipe-rtl{from{clip-path:inset(0 0 0 100%)}to{clip-path:inset(0)}}
  @keyframes wipe-ltr{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0)}}
}
/* reveal of the real photos */
.reveal{transition:clip-path 1.1s cubic-bezier(.2,.7,.2,1),transform 1.4s cubic-bezier(.2,.7,.2,1)}
.js-reveal .reveal:not(.in){clip-path:inset(9% 9% 9% 9% round 28px);transform:scale(1.04)}
.js-reveal .reveal.in{clip-path:inset(0 0 0 0 round 0)}

/* who */
.who .grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,6vw,80px);align-items:start;margin-top:36px}
.who .body{display:grid;gap:16px;color:var(--muted)}
.who .body .reach{font-family:var(--display);font-size:clamp(22px,2.6vw,28px);font-weight:700;line-height:1.35;color:var(--olive-deep);border-inline-start:3px solid var(--gold);padding-inline-start:16px;margin-block:4px}
.adopt2 .scarce{margin:0;padding:12px 16px;border-inline-start:3px solid var(--gold);background:var(--ivory);border-radius:0 12px 12px 0;font-size:16px;color:var(--ink)}
[dir="rtl"] .adopt2 .scarce{border-radius:12px 0 0 12px}
.figure-card .per{display:block;margin-top:4px;color:var(--gold-on-dark);font-weight:800}
.taxback{margin:14px 0 0;padding:14px 18px;border:1px solid rgba(233,220,164,.45);border-radius:14px;background:rgba(233,220,164,.08);color:var(--on-dark);font-size:17px;max-width:46em}
.taxback b{color:var(--gold-on-dark)}
.taxback span{display:block;margin-top:4px;font-size:14px;color:#d6dcc6}
.adopt2 .tagline{font-family:var(--display);font-size:clamp(20px,2.2vw,24px);font-weight:700;color:var(--olive-deep);margin:4px 0 0}
