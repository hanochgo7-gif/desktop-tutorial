<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>מעבירים אתכם… | ש. גוטובסקי</title>
  <meta name="robots" content="noindex, follow">

  <!-- כתובות מהאתר הישן מופנות לקטע המתאים באתר החדש -->
  <script>
    (function () {
      var p = decodeURIComponent(location.pathname + location.search).toLowerCase();
      var map = [
        [/גלרי|gallery|תמונ|photo/, '/#gallery'],
        [/אודות|עלינו|about|החברה|company/, '/#about'],
        [/שירות|תחומ|service|הקמ|שיפוץ|גז|צנרת|עפר/, '/#fields'],
        [/פרויקט|project|עבודות|portfolio/, '/#projects'],
        [/צור|קשר|contact|טלפון|הצעת/, '/#contact'],
        [/מאמר|בלוג|blog|article|כתב/, '/#articles'],
        [/שאל|faq/, '/#faq'],
        [/נגישות|accessib/, '/accessibility.html'],
        [/פרטיות|privacy/, '/privacy.html']
      ];
      var to = '/';
      for (var i = 0; i < map.length; i++) { if (map[i][0].test(p)) { to = map[i][1]; break; } }
      location.replace(to);
    })();
  </script>
  <meta http-equiv="refresh" content="1; url=https://gotovski.co.il/">
