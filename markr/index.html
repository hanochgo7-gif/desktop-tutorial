<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מרקר – המחברת שמסמנת לך מה חשוב</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF0E8; --surface:#FFFFFF; --surface2:#F3F7F1; --ink:#1B2620; --muted:#58665D; --line:#D2DCD0;
  --primary:#1E5B45; --primary-ink:#FFFFFF; --sun:#F2C230; --sun-soft:#FCF1C8; --sun-ink:#4A3A00;
  --danger:#A8321F; --focus:#2C6BD1; --logo-bg:#1E5B45;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111713; --surface:#1A221D; --surface2:#212B25; --ink:#E4ECE6; --muted:#9DAEA3; --line:#2F3B34;
    --primary:#7CCBA6; --primary-ink:#0E1A14; --sun:#F2C230; --sun-soft:#3A3115; --sun-ink:#FCE7A0;
    --danger:#F08A78; --focus:#8DB4FF; --logo-bg:#245F49; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111713; --surface:#1A221D; --surface2:#212B25; --ink:#E4ECE6; --muted:#9DAEA3; --line:#2F3B34;
  --primary:#7CCBA6; --primary-ink:#0E1A14; --sun:#F2C230; --sun-soft:#3A3115; --sun-ink:#FCE7A0;
  --danger:#F08A78; --focus:#8DB4FF; --logo-bg:#245F49; color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
html[data-size="l"]{font-size:112%}
html[data-size="xl"]{font-size:126%}
html[data-easy="1"] body{line-height:1.9;letter-spacing:.012em;word-spacing:.14em}
html[data-easy="1"] .rich,html[data-easy="1"] .r-body{line-height:2.05}
html[data-easy="1"] .r-body p,html[data-easy="1"] .rich p{margin-bottom:1rem}
html[data-easy="1"] i,html[data-easy="1"] em{font-style:normal;font-weight:500}
html[data-easy="1"] .r-body,html[data-easy="1"] #f-rich{max-width:64ch}
/* tablet & desktop */
@media (min-width:701px){.field .rtb{flex-wrap:wrap;overflow:visible}.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}}
@media (min-width:1100px){main,.top-in,nav#nav{max-width:1000px}.cgrid{grid-template-columns:1fr 1fr 1fr}.home-cols{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;align-items:start}.home-cols>section.block:first-child{margin-top:28px}}
@media (hover:hover){.item:hover,.ghost:hover,.slot:hover{border-color:var(--primary)}.primary:hover{filter:brightness(1.08)}}
/* drawing */
#draw{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#draw[hidden]{display:none}
.dtb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.dtb button{min-width:44px;height:44px;border-radius:12px;border:1.5px solid transparent;background:var(--surface2);font-size:1rem;padding:0 10px;color:var(--ink)}
.dtb button[aria-pressed="true"]{border-color:var(--primary);background:var(--surface);color:var(--primary)}
.dtb .sw2{width:32px;min-width:32px;height:32px;border-radius:50%;padding:0;background:var(--c)}
.dtb .sw2[aria-pressed="true"]{outline:3px solid var(--primary);outline-offset:2px}
.dtb button.sw2,.dtb button.sw2[aria-pressed="true"]{background:var(--c);border-color:transparent}
.dtb .sep{width:1px;height:28px;background:var(--line)}
.dtb .save{background:var(--primary);color:var(--primary-ink);font-weight:700}
.dtb .grow{flex:1}
.dwrap{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:14px}
.dpage{position:relative;width:100%;max-width:1000px;margin:0 auto;background:#FFFFFF;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.dpage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.dpage.pan canvas{touch-action:pan-y}
.dmore{display:block;margin:12px auto 30px}
/* listen */
.pl-card{background:var(--surface);border-radius:22px;padding:20px;border-top:8px solid var(--c);margin-top:14px;text-align:center}
.pl-title{font-family:"Secular One","Heebo",sans-serif;font-size:1.35rem;margin:6px 0}
.pl-now{font-size:1.35rem;line-height:1.6;min-height:5.5em;margin:14px 0;color:var(--ink)}
.pl-btns{display:grid;grid-template-columns:1fr 1fr 1.6fr 1fr;gap:10px;align-items:center;margin-top:10px}
.pl-btns button{height:72px;border-radius:20px;border:0;background:var(--surface2);font-size:1.6rem;color:var(--ink)}
.pl-btns .play{background:var(--primary);color:var(--primary-ink);font-size:2.2rem;height:88px}
.pl-opt{display:flex;flex-direction:column;gap:8px}
.pl-opt button{text-align:start;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:1.02rem}
.pl-opt button[aria-pressed="true"]{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 10%,var(--surface))}
.pl-opt small{display:block;color:var(--muted);font-size:.85rem}
.safety{background:var(--sun-soft);color:var(--sun-ink);border-radius:12px;padding:10px 14px;font-size:.92rem;margin-top:12px}
/* streak */
.streak{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:12px 16px;margin-top:12px}
.streak .fire{font-size:1.8rem;line-height:1}
.streak .wk{display:flex;gap:4px;margin-top:4px}
.streak .wk i{width:22px;height:22px;border-radius:7px;background:var(--surface2);display:grid;place-items:center;font-style:normal;font-size:.7rem;color:var(--muted)}
.streak .wk i.on{background:var(--sun);color:#3A2E00;font-weight:700}
.streak .wk i.today{outline:2px solid var(--primary)}
/* mind map */
.mm-center{background:var(--primary);color:var(--primary-ink);border-radius:18px;padding:14px;text-align:center;font-family:"Secular One","Heebo",sans-serif;font-size:1.3rem;margin-bottom:12px}
.mm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.mm-br{background:var(--surface);border-radius:14px;padding:12px;border-top:6px solid var(--c)}
.mm-br h3{font-size:1.05rem;margin-bottom:6px}
.mm-br .chips{margin:0}
.mm-br .chips span{background:var(--surface2);border-radius:999px;padding:4px 10px;font-size:.9rem}
.mm-links li{margin-bottom:6px}
/* exam */
.ex-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ex-time{font-variant-numeric:tabular-nums;font-weight:700;background:var(--surface);border-radius:999px;padding:4px 12px;direction:ltr}
.ex-time.low{background:var(--danger);color:#fff}
.ex-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.ex-grid button{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:700}
.ex-grid button.done{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.ex-grid button.cur{outline:3px solid var(--sun)}
.mc-opt[aria-pressed="true"]{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,var(--surface))}
.wk-row{background:var(--surface);border-radius:14px;padding:10px 14px}
.wk-row .bar{margin:6px 0 4px}
.wk-row .bar i.bad{background:var(--danger)}
.wk-row .bar i.mid{background:var(--sun)}
/* live */
.live-list{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.live-item{background:var(--surface);border-radius:12px;padding:8px 12px;display:flex;gap:10px;align-items:baseline}
.live-item .tm{color:var(--muted);font-size:.8rem;direction:ltr;flex:none}
.live-item.star{background:var(--sun-soft);color:var(--sun-ink);font-weight:700}
.live-item.q{border:2px dashed var(--danger)}
.live-bar{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);background:var(--bg);padding:8px 0}
@media (max-width:700px){.live-bar{bottom:calc(env(safe-area-inset-bottom,0px) + 76px)}}
.live-bar textarea{font-size:1.1rem}
.live-btns{display:grid;grid-template-columns:2fr 1fr 1fr;gap:6px;margin-top:6px}
/* fey */
.fey-score{font-family:"Secular One","Heebo",sans-serif;font-size:2.6rem;text-align:center;color:var(--primary)}
.fey ul{margin:.3rem 0 .8rem;padding-inline-start:1.3rem}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:1.0625rem;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3,.wordmark{font-family:"Secular One","Heebo",system-ui,sans-serif;font-weight:400;line-height:1.25;margin:0}
h1{font-size:1.9rem}
h2{font-size:1.25rem;margin-bottom:.5rem}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.t{unicode-bidi:isolate;direction:ltr;display:inline-block}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:9px;background:none;border:0;padding:0}
.brand svg{width:34px;height:34px;flex:none}
.wordmark{font-size:1.45rem;color:var(--ink)}
.status{margin-inline-start:auto;font-size:.82rem;color:var(--muted)}
.status.err{color:var(--danger);font-weight:700}
.icon-btn{background:var(--surface2);border:0;border-radius:12px;width:40px;height:40px;font-size:1.1rem;display:grid;place-items:center;color:var(--ink)}
nav#nav{display:flex;gap:4px;max-width:780px;margin:0 auto;padding:0 12px 8px}
nav#nav button{flex:1;background:none;border:0;border-radius:12px;padding:9px 6px;font-weight:500;color:var(--muted);font-size:1rem}
nav#nav button[aria-current="page"]{background:var(--primary);color:var(--primary-ink)}
@media (max-width:700px){
  nav#nav{position:fixed;bottom:0;left:0;right:0;max-width:none;background:var(--surface);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:6}
  nav#nav button{padding:12px 4px;font-size:1.02rem}
  main{padding-bottom:104px !important}
}

main{max-width:780px;margin:0 auto;padding:20px 16px 48px}
.loading{color:var(--muted);text-align:center;margin-top:20vh}
.sub{color:var(--muted);margin:.2rem 0 0}
.hint{color:var(--muted);font-size:.92rem;margin:0 0 .5rem}
section.block{margin-top:28px}
.crumb{margin-bottom:10px}
.link{background:none;border:0;padding:6px 0;color:var(--primary);font-weight:500;text-decoration:underline;text-underline-offset:3px}
.note{background:var(--surface2);border:1px dashed var(--line);border-radius:12px;padding:10px 14px;font-size:.92rem;color:var(--muted);margin-top:16px}
.row-between{display:flex;align-items:baseline;justify-content:space-between;gap:10px}

/* buttons */
.primary{background:var(--primary);color:var(--primary-ink);border:0;border-radius:14px;padding:12px 18px;font-weight:700}
.primary.big{font-size:1.1rem;padding:15px 20px;width:100%}
.ghost{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:500}
.ai{background:var(--sun-soft);border:1.5px solid var(--sun);color:var(--sun-ink);border-radius:14px;padding:10px 14px;font-weight:700}
.add{background:none;border:1.5px dashed var(--line);border-radius:12px;padding:9px 14px;color:var(--primary);font-weight:700;width:100%}
.x{background:none;border:0;color:var(--muted);font-size:1.4rem;line-height:1;padding:6px 10px;border-radius:10px}
.x:hover{background:var(--surface2);color:var(--danger)}
.danger{color:var(--danger)}
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:9px 6px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* home */
.next{margin-top:18px;background:var(--surface);border-radius:20px;padding:20px;border-inline-start:10px solid var(--c)}
.next .when{font-weight:700;color:var(--muted);font-size:.95rem}
.next .when.live{color:var(--primary)}
.next h2{font-size:1.6rem;margin:.2rem 0 .3rem}
.next .meta{color:var(--muted);margin-bottom:12px}
.recall{background:var(--surface2);border-radius:14px;padding:12px 14px;margin:0 0 12px}
.recall b{display:block;font-size:.88rem;color:var(--muted);font-weight:500}
.recall.keypt{background:var(--sun-soft);color:var(--sun-ink)}
.recall.keypt b{color:var(--sun-ink)}
.recall ul{margin:.3rem 0 0;padding-inline-start:1.2rem}
.week{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:12px 16px;margin-top:12px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--c);display:block}
.dots i.on{background:var(--c)}
.exam{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:16px;padding:12px 16px;border:2px solid var(--sun)}
.exam .days{font-family:"Secular One","Heebo",sans-serif;font-size:1.9rem;line-height:1;color:var(--sun-ink);background:var(--sun-soft);border-radius:12px;padding:8px 12px;text-align:center;min-width:64px}
.exam .days small{display:block;font-family:"Heebo",sans-serif;font-size:.75rem}

/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.item .dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.item .grow{flex:1;min-width:0}
.item .small{display:block;color:var(--muted);font-size:.9rem}
.course-card{border-inline-start:8px solid var(--c)}
.course-card strong{font-family:"Secular One","Heebo",sans-serif;font-weight:400;font-size:1.15rem}
.lesson-item .no{font-weight:700;color:var(--muted);font-size:.9rem}
.keyline{display:block;background:var(--sun-soft);color:var(--sun-ink);border-radius:8px;padding:2px 8px;margin-top:6px;font-size:.92rem}
.badge{display:inline-block;font-size:.78rem;font-weight:700;border-radius:999px;padding:1px 8px;margin-inline-end:6px;background:var(--surface2);color:var(--muted)}
.badge.exam{background:var(--sun-soft);color:var(--sun-ink)}

/* schedule */
.sched{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.sched-day h3{font-size:1.05rem;margin-bottom:6px;color:var(--muted)}
.sched-day.today h3{color:var(--primary)}
.slot{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:12px;padding:10px 12px;border-inline-start:6px solid var(--c);width:100%;text-align:start;border-top:0;border-bottom:0;border-inline-end:0}
.slot .tm{color:var(--muted);font-size:.92rem;min-width:96px}

/* tasks */
.task{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.task input[type=checkbox]{width:24px;height:24px;flex:none;accent-color:var(--primary)}
.task .grow{flex:1;min-width:0}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.task .small{display:block;color:var(--muted);font-size:.88rem}
.due-late{color:var(--danger);font-weight:700}
.due-soon{color:var(--primary);font-weight:700}
.addrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-top:8px}
.addrow.k{grid-template-columns:1fr auto auto auto}
.addrow.wide{grid-template-columns:1fr 1fr auto auto auto}
@media (max-width:560px){.addrow,.addrow.k,.addrow.wide{grid-template-columns:1fr 1fr}.addrow input[type=text],.addrow .full{grid-column:1/-1}}
input[type=text],input[type=date],input[type=time],input[type=search],textarea,select{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
textarea{resize:vertical;min-height:3em;line-height:1.6}

/* course hero */
.hero{background:var(--surface);border-radius:20px;padding:20px;border-inline-start:10px solid var(--c)}
.hero .sess{color:var(--muted);margin:.1rem 0}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.actions .primary.big{flex-basis:100%}
details.gloss{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
details.gloss summary{font-weight:700;cursor:pointer}
dl{margin:.6rem 0 0}
dt{font-weight:700;margin-top:.6rem}
dd{margin:0;color:var(--muted)}
ol.keys{margin:.6rem 0 0;padding-inline-start:1.4rem}
ol.keys li{margin-bottom:.5rem}

/* editor */
.editor .ed-head{display:flex;flex-wrap:wrap;align-items:end;gap:10px 16px;margin-bottom:6px}
.chip{display:inline-block;background:var(--c);color:#fff;border-radius:999px;padding:3px 12px;font-weight:700;font-size:.9rem;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.ed-head .date{margin-inline-start:auto;display:flex;align-items:center;gap:8px;color:var(--muted)}
.ed-head .date input{width:auto}
.field{background:var(--surface);border-radius:18px;padding:16px;margin-top:14px;border:1px solid var(--line)}
.field>label,.field>h2,.field .lbl{display:block;font-family:"Secular One","Heebo",sans-serif;font-size:1.2rem;margin-bottom:.3rem}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.rows{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) auto;gap:8px;align-items:start}
.row.q{grid-template-columns:auto 1fr auto;align-items:center}
.row.q input[type=checkbox]{width:24px;height:24px;accent-color:var(--primary)}
.row.q.answered input[type=text]{text-decoration:line-through;color:var(--muted)}
@media (max-width:560px){.row{grid-template-columns:1fr auto}.row textarea{grid-column:1/2}}
.field.key{background:var(--sun-soft);border:2px solid var(--sun)}
.field.key label{color:var(--sun-ink)}
.field.key textarea{border-color:var(--sun);font-size:1.1rem;font-weight:500}
.ed-foot{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:20px}

/* modal */
#modal{position:fixed;inset:0;z-index:20;background:rgba(10,20,15,.45);display:none;align-items:flex-end;justify-content:center;padding:env(safe-area-inset-top,0px) 0 0}
#modal.open{display:flex}
@media (min-width:701px){#modal{align-items:center}}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:701px){.sheet{border-radius:22px}}
.sheet h2{font-size:1.4rem;margin-bottom:12px}
.f{margin-bottom:14px;display:block}
.f>span{display:block;font-weight:700;margin-bottom:4px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid transparent;background:var(--c)}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.sess-row{display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:6px;margin-bottom:8px;align-items:center}
.sess-row .room{grid-column:1/4}
.sheet-foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.sheet-foot .primary{flex:1}
.check{display:flex;align-items:center;gap:8px}
.check input{width:22px;height:22px;accent-color:var(--primary)}
.preview{background:var(--surface);border-radius:14px;padding:14px;white-space:pre-wrap;margin-bottom:10px}
.thinking{display:flex;align-items:center;gap:12px;padding:24px 0;color:var(--muted)}
.pulse{width:18px;height:18px;border-radius:50%;background:var(--sun);flex:none}
@media (prefers-reduced-motion:no-preference){.pulse{animation:pulse 1.1s ease-in-out infinite}@keyframes pulse{50%{transform:scale(.6);opacity:.5}}}

/* onboarding */
.onb{text-align:center;padding:8px 4px}
.onb svg{width:84px;height:84px;margin:4px auto 14px;display:block}
.onb h2{font-size:1.6rem}
.onb p{font-size:1.08rem;margin:.4rem auto 0;max-width:30em}
.steps{display:flex;justify-content:center;gap:6px;margin-top:18px}
.steps i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}
.steps i.on{background:var(--primary);width:22px;border-radius:4px}

/* flashcards */
.card{background:var(--surface);border-radius:20px;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;border-top:8px solid var(--c);margin:10px 0 16px}
.card .term{font-family:"Secular One","Heebo",sans-serif;font-size:1.7rem}
.card .def{margin-top:14px;font-size:1.1rem}
.card .from{margin-top:8px;color:var(--muted);font-size:.85rem}

/* rich text */
.rtb{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr,60px));z-index:3;display:flex;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;gap:4px;background:var(--surface);padding:6px 0 8px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.rtb button{flex:none;white-space:nowrap;background:var(--surface2);border:1px solid transparent;border-radius:10px;min-width:40px;height:40px;padding:0 10px;font-size:.95rem;font-weight:500;color:var(--ink)}
.rtb button[aria-pressed="true"]{border-color:var(--primary);color:var(--primary);background:var(--surface)}
.rtb .sep{width:1px;background:var(--line);margin:4px 2px}
.rtb .ai-b{background:var(--sun-soft);color:var(--sun-ink);font-weight:700}
.rich{line-height:1.75}
.rich h2{font-size:1.4rem;margin:.9rem 0 .3rem;color:var(--primary)}
.rich h3{font-size:1.15rem;margin:.8rem 0 .25rem;color:var(--primary)}
.rich p,.rich div{margin:0 0 .5rem}
.rich ul,.rich ol{margin:0 0 .6rem;padding-inline-start:1.4rem}
.rich li{margin-bottom:.25rem}
.rich mark{background:#F7DB6A;color:#2A2100;padding:0 2px;border-radius:3px}
.rich .sm,.rich font[size="1"],.rich font[size="2"]{font-size:.85em}
.rich .lg,.rich font[size="5"],.rich font[size="6"],.rich font[size="7"]{font-size:1.3em;font-weight:500}
.rich b,.rich strong{font-weight:700}
.rich img{display:block;max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);margin:8px 0;background:var(--surface2)}
#f-rich img{cursor:default}
#f-rich.dragover{border-color:var(--sun);background:var(--sun-soft)}
#f-rich{min-height:220px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;font-size:1.05rem}
#f-rich:focus{border-color:var(--primary)}
#f-rich:empty::before{content:attr(data-ph);color:var(--muted);white-space:pre-line}
/* chat */
.chat{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto;padding:4px 0}
.bub{max-width:88%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;line-height:1.6}
.bub.me{align-self:flex-start;background:var(--primary);color:var(--primary-ink);border-end-start-radius:4px}
.bub.ai{align-self:flex-end;background:var(--surface);border:1px solid var(--line);border-end-end-radius:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.92rem}
.chat-in{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px}
/* timer */
.tbadge{background:var(--sun);color:#3A2E00;border:0;border-radius:999px;padding:6px 12px;font-weight:700;font-variant-numeric:tabular-nums}
.tbig{font-family:"Secular One","Heebo",sans-serif;font-size:4.2rem;text-align:center;font-variant-numeric:tabular-nums;color:var(--primary);margin:10px 0;direction:ltr}
/* reader */
.reader .r-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px}
.reader .r-head .grow{flex:1}
.star{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:700;white-space:nowrap}
.star[aria-pressed="true"]{background:var(--sun-soft);border-color:var(--sun);color:var(--sun-ink)}
.r-body{background:var(--surface);border-radius:18px;padding:18px 18px 8px;margin-top:14px;font-size:1.08rem;line-height:1.75}
.r-body h3{font-size:1.15rem;margin:1rem 0 .3rem;color:var(--primary)}
.r-body h3:first-child{margin-top:0}
.r-body p{margin:0 0 .7rem}
.r-body ul{margin:0 0 .8rem;padding-inline-start:1.3rem}
.r-body li{margin-bottom:.3rem}
.r-key{background:var(--sun-soft);border:2px solid var(--sun);color:var(--sun-ink);border-radius:16px;padding:12px 16px;margin-top:14px;font-size:1.1rem;font-weight:500}
.r-key b{display:block;font-size:.85rem}
.r-imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:10px}
.r-imgs img{width:100%;border-radius:12px;border:1px solid var(--line);display:block}
.r-nav{display:flex;justify-content:space-between;gap:8px;margin-top:20px}
.r-lesson{border-top:2px solid var(--line);padding-top:18px;margin-top:22px}
.r-lesson:first-of-type{border-top:0;margin-top:8px}
.src{display:inline-block;font-size:.78rem;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--surface2);color:var(--muted);margin-inline-start:6px}
.drop{border:2px dashed var(--line);border-radius:14px;padding:14px;text-align:center;background:var(--surface)}
.drop input{margin-top:8px}
.filelist{font-size:.9rem;color:var(--muted);margin-top:6px}
/* multiple choice */
.mc-q{font-family:"Secular One","Heebo",sans-serif;font-size:1.35rem;line-height:1.35;margin:6px 0 14px}
.mc-opts{display:flex;flex-direction:column;gap:8px}
.mc-opt{display:flex;gap:10px;align-items:flex-start;text-align:start;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:1.05rem;width:100%}
.mc-opt:disabled{opacity:1}
.mc-opt:disabled:not(.right):not(.wrong){opacity:.6}
.mc-opt .ltr{font-weight:700;color:var(--muted);flex:none;width:1.4em}
.mc-opt.right{border-color:#2F8F6B;background:color-mix(in srgb,#2F8F6B 14%,var(--surface))}
.mc-opt.wrong{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,var(--surface))}
.mc-explain{background:var(--surface2);border-radius:12px;padding:10px 14px;margin-top:12px}
.bar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;background:var(--primary)}
.score{font-family:"Secular One","Heebo",sans-serif;font-size:3rem;text-align:center;color:var(--primary);line-height:1.1;margin:10px 0}
.review{display:flex;align-items:center;gap:14px;background:var(--primary);color:var(--primary-ink);border-radius:18px;padding:16px;margin-top:12px}
.review .grow{flex:1}
.review button{background:var(--sun);color:#3A2E00;border:0;border-radius:12px;padding:10px 16px;font-weight:700}
.greet{color:var(--muted);font-weight:500;margin:0 0 2px;font-size:1.05rem}
.onb-courses{display:flex;flex-direction:column;gap:6px;margin:12px 0;text-align:start}
.onb input[type=text]{margin-top:14px;font-size:1.15rem;text-align:center}
mark{background:var(--sun-soft);color:inherit;border-radius:4px;padding:0 2px}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:16px;padding:18px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:no-preference){.next,.hero{animation:rise .35s ease-out}@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}

/* ================= design v2: a notebook, not an app ================= */
:root{
  --bg:#F3F5F2;--surface:#FFFFFF;--surface2:#EEF1EC;--ink:#1A2421;--muted:#66706A;--line:#DFE4DD;--rule:#D3DFE8;--margin:#E8B0A6;
  --primary:#1F4D3D;--primary-ink:#FFFFFF;--sun:#F4D23C;--sun-soft:#FBF3CC;--sun-ink:#463800;--hl:rgba(244,210,60,.85);
  --danger:#B23A26;--logo-bg:#1F4D3D;--spark:#A88300;
  --serif:"Frank Ruhl Libre","Noto Serif Hebrew","Times New Roman",serif;
  --sheet:0 1px 0 rgba(26,36,33,.04),0 6px 18px -10px rgba(26,36,33,.18);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121715;--surface:#1A201E;--surface2:#222A27;--ink:#E7ECE8;--muted:#98A39D;--line:#2C3532;--rule:#2C3A44;--margin:#6B3D37;
  --primary:#8FD0B0;--primary-ink:#0F1F18;--sun:#E9C93A;--sun-soft:#3A3416;--sun-ink:#F6E7A6;--hl:rgba(233,201,58,.32);--logo-bg:#2A6650;--spark:#E3C14B;
  --sheet:0 1px 0 rgba(0,0,0,.3);}}
:root[data-theme="dark"]{
  --bg:#121715;--surface:#1A201E;--surface2:#222A27;--ink:#E7ECE8;--muted:#98A39D;--line:#2C3532;--rule:#2C3A44;--margin:#6B3D37;
  --primary:#8FD0B0;--primary-ink:#0F1F18;--sun:#E9C93A;--sun-soft:#3A3416;--sun-ink:#F6E7A6;--hl:rgba(233,201,58,.32);--logo-bg:#2A6650;--spark:#E3C14B;
  --sheet:0 1px 0 rgba(0,0,0,.3);}
body{font-family:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
h1,h2,h3,.wordmark,.mc-q,.card .term,.pl-title,.course-card strong,.mm-center,.score,.fey-score,.field>label,.field>h2,.field .lbl,.tbig,.exam .days,.onb h2{font-family:var(--serif);font-weight:700;letter-spacing:0}
h1{font-size:2.1rem;line-height:1.2}
h2{font-size:1.3rem}
.greet{font-size:1rem;margin-bottom:4px}
.wordmark{font-size:1.55rem}
.brand svg{width:30px;height:30px}
.top{background:color-mix(in srgb,var(--surface) 92%,transparent);border-bottom:1px solid var(--line)}
body::before{background:var(--surface)}
/* icons */
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em;flex:none;display:inline-block;margin-inline-end:.35em}
.i-spark{color:var(--spark)}.i-starf{color:#D9A400}.i-flame{color:#D9822B}.i-sprout{color:#4E9A6B}
.icon-btn .ic{margin:0;width:1.25em;height:1.25em}
/* nav */
nav#nav button{display:flex;align-items:center;justify-content:center;gap:.4em;border-radius:10px}
nav#nav button .ic{margin:0}
nav#nav button[aria-current="page"]{background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary)}
@media (max-width:700px){
  nav#nav{border-top:1px solid var(--line);box-shadow:0 -6px 20px -14px rgba(0,0,0,.25)}
  nav#nav button{flex-direction:column;gap:2px;font-size:.78rem;padding:7px 2px}
  nav#nav button .ic{width:1.45em;height:1.45em}
}
/* buttons: one clear hierarchy */
.primary{border-radius:12px;font-weight:600;letter-spacing:.005em;box-shadow:0 1px 0 rgba(0,0,0,.12) inset,0 2px 6px -3px rgba(31,77,61,.6)}
.primary.big{border-radius:14px;padding:16px 20px}
.ghost,.ai{display:inline-flex;align-items:center;justify-content:center;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;color:var(--ink);font-weight:500;padding:10px 14px}
.ai{background:var(--surface)}
.ghost:active,.ai:active,.tool:active{transform:translateY(1px)}
.add{border:1px dashed var(--rule);border-radius:10px}
/* sheets instead of a pile of cards */
.next,.hero,.field,.r-body,.pl-card,.streak,.week,.exam,.card{border:1px solid var(--line);box-shadow:var(--sheet);border-radius:16px}
.next,.hero{border-inline-start:4px solid var(--c);border-start-start-radius:6px;border-end-start-radius:6px}
.next .when{font-weight:600}
.next h2{font-size:1.75rem}
.recall{background:transparent;border-inline-start:3px solid var(--rule);border-radius:0;padding:4px 12px;margin-bottom:12px}
.recall.keypt{background:transparent;border-inline-start-color:var(--sun)}
.recall.keypt b{color:var(--muted)}
section.block>h2{display:flex;align-items:center;gap:.5em}
section.block>h2::before{content:"";width:.42em;height:.42em;border-radius:50%;background:var(--sun);flex:none}
/* lists read as ruled notebook rows */
.list{gap:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--sheet)}
.list>.item,.list>.task,.list>label.task{border:0;border-radius:0;border-bottom:1px solid var(--rule);box-shadow:none;background:transparent}
.list>:last-child{border-bottom:0}
.list>.exam,.list>.wk-row{border-radius:0;border:0;border-bottom:1px solid var(--rule);box-shadow:none}
.list>.exam{border-inline-start:3px solid var(--sun)}
.list>p.hint{padding:12px 14px;margin:0}
.cgrid{background:none;border:0;box-shadow:none;overflow:visible}
.cgrid>.item{border:1px solid var(--line);border-inline-start:4px solid var(--c);border-radius:14px;border-start-start-radius:6px;border-end-start-radius:6px;background:var(--surface);box-shadow:var(--sheet)}
@media (max-width:700px){.cgrid{gap:8px}}
.item:hover{background:color-mix(in srgb,var(--surface2) 60%,var(--surface))}
.course-card strong{font-size:1.2rem}
.keyline{display:inline;background:linear-gradient(transparent 42%,var(--hl) 42%,var(--hl) 90%,transparent 90%);-webkit-box-decoration-break:clone;box-decoration-break:clone;color:inherit;padding:0 .12em;border-radius:0;margin:0;font-size:.95rem}
.keyline::before{content:"\A";white-space:pre}
.lesson-item .no{font-weight:500;font-size:.85rem}
.chip{font-weight:600;font-size:.8rem;padding:2px 10px;text-shadow:none}
/* quick tools on home */
.qtiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qtiles button{flex-direction:column;gap:6px;padding:12px 4px;font-size:.86rem;line-height:1.2;border-radius:14px;box-shadow:var(--sheet)}
.qtiles .ic{width:1.6em;height:1.6em;margin:0;color:var(--primary)}
.live-cta{width:100%;justify-content:flex-start;gap:.2em;border-inline-start:4px solid var(--sun);font-weight:600}
/* course tools */
.tgroup{margin-top:18px}
.tgroup h3{font-family:"Heebo",sans-serif;font-size:.92rem;font-weight:600;color:var(--muted);margin-bottom:8px}
.trow{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.tool{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 12px;text-align:start;font-weight:500;color:var(--ink);box-shadow:var(--sheet);line-height:1.3}
.tool .ic{width:1.4em;height:1.4em;margin:0;color:var(--primary)}
.tool .ic.i-spark{color:var(--spark)}
.tool small{display:block;color:var(--muted);font-weight:400;font-size:.8rem}
.hero-links{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:10px}
.hero-links .link{font-size:.92rem;color:var(--muted)}
/* reader: the one bold thing, a real notebook page */
.r-body{font-family:var(--serif);font-size:1.16rem;line-height:1.95;padding:22px 26px 12px;border-inline-start:0;position:relative;background:var(--surface)}
.r-body::before{content:"";position:absolute;top:0;bottom:0;inset-inline-start:14px;width:1.5px;background:var(--margin);opacity:.7}
.r-body h3{font-size:1.25rem;color:var(--primary)}
.r-body dt{font-family:var(--serif)}
.rich h2,.rich h3{font-family:var(--serif)}
.r-key{background:none;border:0;padding:6px 2px;margin-top:16px;font-family:var(--serif);font-size:1.3rem;line-height:1.6;color:var(--ink)}
.r-key b{font-family:"Heebo",sans-serif;font-size:.85rem;font-weight:600;color:var(--muted);margin-bottom:2px}
.r-key .hl{background:linear-gradient(transparent 40%,var(--hl) 40%,var(--hl) 92%,transparent 92%);-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .15em}
.reader .actions{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.reader .actions>*{justify-content:flex-start;box-shadow:var(--sheet);padding:12px}
.reader .actions .primary.big{grid-column:1/-1;justify-content:center}
.reader .actions .ic{color:var(--primary);width:1.3em;height:1.3em}
.star{border-radius:999px;font-weight:500;display:inline-flex;align-items:center}
.star[aria-pressed="true"] .ic{color:#D9A400}
/* editor */
.field{box-shadow:none}
.field.key{background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--sun);border-radius:16px;border-start-start-radius:6px;border-end-start-radius:6px}
.field.key label{color:var(--ink)}
.field.key textarea{border-color:var(--line);font-family:var(--serif);font-size:1.15rem}
#f-rich{font-family:var(--serif);font-size:1.12rem;line-height:1.85}
.rtb button{border-radius:8px}
.tools .ai,.editor>.ai{justify-content:flex-start}
.editor>.ai{border-inline-start:4px solid var(--sun);font-weight:600}
/* streak & review */
.streak{align-items:flex-start}
.streak .fire .ic{width:1.6em;height:1.6em;margin:0}
.streak .wk i{border-radius:50%;width:24px;height:24px}
.review{background:var(--primary);border-radius:16px;box-shadow:var(--sheet)}
.review button{border-radius:10px}
/* modals */
.sheet{background:var(--bg)}
.sheet h2{font-size:1.45rem}
.mc-opt{border-width:1.5px;border-radius:12px}
.empty{border:1px dashed var(--rule);background:transparent}
.badge.exam{background:var(--sun-soft);color:var(--sun-ink)}
.pl-btns button .ic{margin:0;width:1.1em;height:1.1em}
.pl-btns .play .ic{width:1.2em;height:1.2em}
.dtb button .ic{margin:0}
.dtb button{display:inline-flex;align-items:center;gap:.3em}
.tbadge{display:inline-flex;align-items:center}
.tbadge[hidden]{display:none}
.tbadge .ic{margin-inline-end:.25em}
@media (prefers-reduced-motion:no-preference){.next,.hero{animation:none}}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:500;z-index:60;box-shadow:0 8px 24px -8px rgba(0,0,0,.4);transition:opacity .25s,transform .25s;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast .ic{color:var(--sun)}
@media (min-width:701px){#toast{bottom:28px}}
/* reader v3 */
.r-hero{padding:6px 0 4px}
.r-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;color:var(--muted);font-size:.88rem}
.r-meta>span:not(.chip):not(.r-score)+span:not(.chip)::before,.r-meta .chip+span::before{content:"";display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--line);margin-inline-end:12px;vertical-align:middle}
.r-score{background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary);font-weight:600;border-radius:999px;padding:1px 10px}
.r-hero h1{font-size:2.3rem;margin:10px 0 12px;line-height:1.15}
.r-key{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--sheet)}
.toc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin-top:14px}
.toc b{display:block;font-size:.85rem;color:var(--muted);font-weight:600;margin-bottom:6px}
.toc ol{margin:0;padding:0;list-style:none;counter-reset:t}
.toc li{counter-increment:t;border-top:1px solid var(--rule)}
.toc li:first-child{border-top:0}
.toc button{width:100%;text-align:start;background:none;border:0;padding:9px 0;display:flex;gap:10px;align-items:baseline;color:var(--ink);font-weight:500}
.toc button::before{content:counter(t);font-family:var(--serif);font-weight:700;color:var(--primary);min-width:1.3em}
.rich blockquote{margin:6px 0 14px;padding:10px 14px;background:color-mix(in srgb,var(--primary) 7%,var(--surface));border-inline-start:3px solid var(--primary);border-radius:4px 12px 12px 4px;font-family:"Heebo",sans-serif;font-size:1rem;line-height:1.6}
.rich blockquote b{color:var(--primary)}
.numbered .sec{display:flex;align-items:baseline;gap:10px;margin-top:1.4rem;scroll-margin-top:calc(var(--hdr,60px) + 20px)}
.numbered .sec::before{content:attr(data-n);flex:none;display:inline-grid;place-items:center;width:1.7em;height:1.7em;border-radius:50%;background:var(--primary);color:var(--primary-ink);font-family:"Heebo",sans-serif;font-size:.75em;font-weight:700;transform:translateY(-.1em)}
.numbered .sec:first-child{margin-top:0}
.r-body.rich h3:not(.sec){font-size:1.12rem;color:var(--ink)}
.gloss-grid{margin-top:16px}
.gloss-grid h3{display:flex;align-items:center;gap:8px;font-size:1.2rem;margin-bottom:10px}
.gloss-grid h3 span{font-family:"Heebo",sans-serif;font-size:.75rem;background:var(--surface2);color:var(--muted);border-radius:999px;padding:2px 8px}

/* ux pass 1 */
.qtiles{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:1fr}

.sheet-foot{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom,0px));margin-bottom:calc(-20px - env(safe-area-inset-bottom,0px));padding:12px 0 calc(20px + env(safe-area-inset-bottom,0px));background:var(--bg);box-shadow:0 -12px 12px -12px rgba(0,0,0,.18);z-index:2}

/* ================= design v3: calmer, tidier, one system ================= */
:root{--r:16px;--r-sm:12px;--tint:color-mix(in srgb,var(--primary) 9%,var(--surface));--tint2:color-mix(in srgb,var(--primary) 16%,var(--surface));
  --shadow:0 1px 2px rgba(26,36,33,.05),0 8px 24px -14px rgba(26,36,33,.22);--ease:cubic-bezier(.2,.7,.2,1)}

body{text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
h1{font-size:2rem;letter-spacing:-.01em}
/* header */

.status{display:inline-flex;align-items:center;gap:5px;margin-inline-start:auto;font-size:.8rem;font-weight:500;color:var(--muted);background:var(--surface2);border-radius:999px;padding:5px 10px;max-width:none;transition:color .2s,background .2s}
.status:empty{display:none}
.status .ic{margin:0;width:1.15em;height:1.15em}
.status.ok{color:var(--primary)}
.status.err{background:color-mix(in srgb,var(--danger) 12%,var(--surface));color:var(--danger)}
@media (max-width:480px){.status:not(.err) span{display:none}.status{padding:7px;font-size:.8rem}.status.err{max-width:150px;overflow:hidden;white-space:nowrap}.status.err span{overflow:hidden;text-overflow:ellipsis}}
.icon-btn{border-radius:12px;width:42px;height:42px;background:var(--surface2);transition:background .2s}

/* nav */
nav#nav button{transition:color .2s,background .2s;font-weight:500}

@media (max-width:700px){

}
/* buttons & fields */
.primary,.ghost,.ai,.tool,.item,.slot,.mc-opt,.seg button,.add,.tpl{transition:background-color .2s,border-color .2s,box-shadow .2s,transform .12s var(--ease),filter .2s}
.primary:active,.ghost:active,.ai:active,.tool:active,.item:active,.slot:active{transform:scale(.985)}

.primary.big{border-radius:14px;padding:15px 20px;box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 8px 18px -10px color-mix(in srgb,var(--primary) 80%,transparent)}

input[type=text],input[type=date],input[type=time],input[type=search],textarea,select{border:1.5px solid var(--line);border-radius:var(--r-sm);min-height:46px;transition:border-color .2s,box-shadow .2s}

.next,.hero,.field,.r-body,.pl-card,.streak,.week,.card,.list,.empty,details.gloss,.toc,.r-key,.gcard,.task-form{border-radius:var(--r)}

.cc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}

.cnt{flex:none;font-size:.74rem;font-weight:600;border-radius:999px;padding:3px 9px;margin-top:2px;background:color-mix(in srgb,var(--c) 15%,var(--surface));color:var(--ink);white-space:nowrap}
.cnt.zero{background:var(--surface2);color:var(--muted);font-weight:500}
.item .cc-teacher{margin-top:3px;font-size:.88rem}
.cc-sess{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:8px}
.sl{display:inline-flex;align-items:center;gap:5px;font-size:.86rem;color:var(--muted)}
.sl .ic{margin:0;width:1.05em;height:1.05em;color:color-mix(in srgb,var(--c) 75%,var(--muted))}
/* lists */
.list>.item,.list>.task,.list>label.task{padding:13px 16px}
.item .dot{width:10px;height:10px;box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 18%,transparent)}
section.block{margin-top:30px}
section.block>h2{font-size:1.2rem;margin-bottom:.6rem}
.page-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.count{font-size:.85rem;font-weight:600;color:var(--primary);background:var(--tint);border-radius:999px;padding:3px 12px;white-space:nowrap}
/* home */
.greet{font-size:.95rem;font-weight:500;color:var(--muted)}
.streak{padding:14px 16px;gap:14px}

.review{border-radius:var(--r);padding:16px 18px;background:linear-gradient(135deg,var(--primary),color-mix(in srgb,var(--primary) 78%,#000));box-shadow:var(--shadow)}

.tgroup{margin-top:22px}

.trow{gap:10px}
.tool{border-radius:14px;padding:12px;gap:12px;box-shadow:var(--shadow);border-color:var(--line)}

.empty{padding:22px 18px;line-height:1.6}

</style>

function makeDbStore(col){
  const q={};
  const chain=(id,fn)=>{
    const p=(q[id]||Promise.resolve()).then(fn).then(()=>true,async e=>{
      if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,700+Math.random()*900));try{await fn();return true}catch(_){}}
      if(e&&(e.code==='invalid_argument'||e.code==='revoked'||e.code==='not_granted'))return 'denied';
      console.warn(e);return false;
    });
    q[id]=p;return p;
  };
  return{kind:'db',
    subscribe(cb,onErr){return col.onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});cb(o)},e=>onErr&&onErr(e))},
    put(id,data){return chain(id,()=>col.doc(id).set(data))},
    remove(id){return chain(id,()=>col.doc(id).delete())}
  };
}
function makeLocalStore(){
  const KEY='mahberet:v1';let docs={};
  try{docs=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){docs={}}
  const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(docs));return true}catch(e){return false}};
  return{kind:'local',subscribe(cb){cb(docs)},put(id,d){docs[id]=d;return Promise.resolve(persist())},remove(id){delete docs[id];return Promise.resolve(persist())}};
}
function docData(id){

}

function flush(id){

  const v=dirty.get(id);if(v==null||!store)return Promise.resolve();
  const data=docData(id);if(!data){dirty.delete(id);updateStatus();return Promise.resolve()}
  return store.put(id,clone(data)).then(ok=>{

    if(ok){statusErr=false;if(dirty.get(id)===v)dirty.delete(id)}

}

const RT={P:'p',DIV:'p',BR:'br',B:'b',STRONG:'b',I:'i',EM:'i',U:'u',MARK:'mark',H1:'h2',H2:'h2',H3:'h3',H4:'h3',H5:'h3',UL:'ul',OL:'ol',LI:'li',BLOCKQUOTE:'blockquote'};
const RT_DROP=new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','SVG','MATH','TEMPLATE','VIDEO','AUDIO','TITLE','META','LINK','HEAD']);
function cleanNode(n){
  if(n.nodeType===3)return esc(n.nodeValue);
  if(n.nodeType!==1||RT_DROP.has(n.tagName))return '';
  if(n.tagName==='IMG'){const s=n.getAttribute('src')||'';return /^\/_blob\/[A-Za-z0-9_-]+$/.test(s)?`<img src="${s}" alt="${esc(n.getAttribute('alt')||'')}">`:''}
  let inner=[...n.childNodes].map(cleanNode).join('');
  const st=(n.getAttribute('style')||'').toLowerCase();
  if(n.tagName==='FONT'){const s=+n.getAttribute('size');if(s&&s<=2)inner=`<span class="sm">${inner}</span>`;else if(s>=5)inner=`<span class="lg">${inner}</span>`}
  if(n.tagName==='SPAN'&&n.classList.contains('sm'))inner=`<span class="sm">${inner}</span>`;
  if(n.tagName==='SPAN'&&n.classList.contains('lg'))inner=`<span class="lg">${inner}</span>`;
  if(n.tagName!=='SPAN'&&n.tagName!=='FONT'&&/background(-color)?:\s*(?!transparent|rgba\(0,\s*0,\s*0,\s*0\)|initial|inherit)/.test(st))inner=`<mark>${inner}</mark>`;
  if(n.tagName==='SPAN'||n.tagName==='FONT'){
    if(/font-weight:\s*(bold|[6-9]00)/.test(st))inner=`<b>${inner}</b>`;
    if(/text-decoration[^;]*underline/.test(st))inner=`<u>${inner}</u>`;
    if(/background(-color)?:\s*(?!transparent|rgba\(0,\s*0,\s*0,\s*0\)|initial|inherit)/.test(st))inner=`<mark>${inner}</mark>`;
    if(/font-size:\s*(x-small|small|smaller|(\d|1[0-3])px)/.test(st))inner=`<span class="sm">${inner}</span>`;
    if(/font-size:\s*(large|x-large|xx-large|larger|(1[89]|[2-9]\d)px)/.test(st))inner=`<span class="lg">${inner}</span>`;
    return inner;
  }
  const tag=RT[n.tagName];if(!tag)return inner;

}
function sanitize(html){const t=document.createElement('template');t.innerHTML=String(html||'');return [...t.content.childNodes].map(cleanNode).join('')}
function htmlToText(html){
  const t=document.createElement('template');t.innerHTML=String(html||'');const lines=[];let cur='';
  const flush=()=>{if(cur.trim())lines.push(cur.trim());cur=''};
  const walk=(n,ol)=>{
    if(n.nodeType===3){cur+=n.nodeValue;return}
    if(n.nodeType!==1)return;const tg=n.tagName;
    if(tg==='BR'){flush();return}
    if(tg==='IMG'){flush();const a=(n.getAttribute('alt')||'').trim();cur='[תמונה'+(a?': '+a:'')+']';flush();return}
    if(/^H[1-6]$/.test(tg)){flush();cur=n.textContent.trim().replace(/[:：]$/,'');if(cur)cur+=':';flush();return}
    if(tg==='LI'){flush();cur=ol?((ol.i=(ol.i||0)+1)+'. '):'- ';[...n.childNodes].forEach(c=>walk(c,null));flush();return}
    const block=/^(P|DIV|UL|OL|BLOCKQUOTE)$/.test(tg);if(block)flush();
    const nol=tg==='OL'?{}:tg==='UL'?null:ol;[...n.childNodes].forEach(c=>walk(c,nol));if(block)flush();
  };

}
function notesHtmlOf(l){return l.notesHtml!=null?sanitize(l.notesHtml):fmtNotes(l.notes)}
function fmtNotes(t){
  let html='',inList=false;
  for(const raw of String(t||'').split('\n')){const ln=raw.trim();
    if(!ln){if(inList){html+='</ul>';inList=false}continue}
    const m=ln.match(/^[-•*]\s+(.*)/);
    if(m){if(!inList){html+='<ul>';inList=true}html+=`<li>${esc(m[1])}</li>`;continue}
    if(inList){html+='</ul>';inList=false}
    const q=ln.match(/^(בקיצור|במילים פשוטות|טיפ לזכירה|שים לב|חשוב לזכור)\s*[:：]\s*(.+)$/);
    if(q){html+=`<blockquote><b>${esc(q[1])}:</b> ${esc(q[2])}</blockquote>`;continue}
    if(/[:：]$/.test(ln)&&ln.length<70)html+=`<h3>${esc(ln.replace(/[:：]$/,''))}</h3>`;else html+=`<p>${esc(ln)}</p>`;
  }
  if(inList)html+='</ul>';return html;
}
const GAPS=[1,3,7,14,30];

function decorateNotes(html){
  const lvl=/<h2>/.test(html)?'h2':'h3';const toc=[];let n=0;
  html=html.replace(new RegExp(`<${lvl}>([\\s\\S]*?)</${lvl}>`,'g'),(m,inner)=>{n++;toc.push(inner.replace(/<[^>]+>/g,''));return `<${lvl} id="sec-${n}" class="sec" data-n="${n}">${inner}</${lvl}>`});
  return {html,toc};
}
function readMinutes(l){const w=String(l.notes||'').split(/\s+/).filter(Boolean).length+(l.terms||[]).length*12;return Math.max(1,Math.round(w/170))}
function lessonReadHtml(id,l,no,full){
  const imgs=(l.files||[]).filter(f=>f.kind==='image');
  const d=l.notes?decorateNotes(notesHtmlOf(l)):{html:'',toc:[]};
  const terms=(l.terms||[]).filter(x=>x.t);
  return `${l.key?`<div class="r-key"><b>השורה התחתונה</b><span class="hl">${esc(l.key)}</span></div>`:''}
    ${full&&d.toc.length>=3?`<nav class="toc" aria-label="תוכן השיעור"><b>בשיעור הזה</b><ol>${d.toc.map((t,i)=>`<li><button data-act="toc" data-v="sec-${i+1}">${esc(t)}</button></li>`).join('')}</ol></nav>`:''}
    ${l.notes?`<div class="r-body rich numbered">${d.html}</div>`:''}
    ${terms.length?`<section class="gloss-grid"><h3>מילון מושגים <span>${terms.length}</span></h3><div class="gg">${terms.map(x=>`<div class="gcard"><b>${esc(x.t)}</b><span>${esc(x.d||'')}</span></div>`).join('')}</div></section>`:''}
    ${full&&(l.questions||[]).some(x=>x.t)?`<div class="r-body"><h3>שאלות ששאלתי</h3><ul>${l.questions.filter(x=>x.t).map(x=>`<li>${esc(x.t)}${x.done?' ✓':''}</li>`).join('')}</ul></div>`:''}
    ${imgs.length?`<div class="r-imgs">${imgs.map(f=>`<img src="/_blob/${esc(f.id)}" alt="${esc(f.name||'תמונה מקורית')}" loading="lazy">`).join('')}</div>`:''}
    ${(l.files||[]).filter(f=>f.kind!=='image').map(f=>`<p class="hint">מקור: ${esc(f.name)}</p>`).join('')}`;

function snippet(text,q){
  const i=text.toLowerCase().indexOf(q.toLowerCase());if(i<0)return null;
  const s=Math.max(0,i-50),e=Math.min(text.length,i+q.length+70);
  return (s>0?'…':'')+esc(text.slice(s,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length,e))+(e<text.length?'…':'');
}
function searchResults(q){
  q=(q||'').trim();if(q.length<2)return '<p class="hint">הקלד לפחות 2 אותיות.</p>';
  const out=[];
  for(const [id,l] of Object.entries(S.lessons)){
    const c=courseById(l.courseId);if(!c)continue;
    const parts=[l.topic,l.key,l.notes,...(l.terms||[]).map(x=>x.t+': '+(x.d||'')),...(l.questions||[]).map(x=>x.t)].filter(Boolean);
    let sn=null;for(const p of parts){sn=snippet(p,q);if(sn)break}
    if(sn)out.push({id,l,c,sn});
  }
  out.sort((a,b)=>(b.l.date||'').localeCompare(a.l.date||''));
  if(!out.length)return '<div class="empty">לא נמצא שום דבר. נסה מילה אחרת.</div>';
  return `<div class="list">${out.map(r=>`<button class="item" style="--c:${r.c.color}" data-act="open-lesson" data-id="${r.id}"><span class="dot"></span>
    <span class="grow"><span class="small">${esc(r.c.name)}, שיעור ${lessonNo(r.id)}, ${shortDate(r.l.date)}</span>${r.sn}</span></button>`).join('')}</div>`;
}

async function aiOrganize(){
  const l=S.lessons[view.id],c=courseById(l.courseId);
  if((l.notes||'').trim().length<20){openModal(`<h2>✨ Claude עוזר</h2><p>כתוב קודם כמה שורות ב“מה למדנו”, ואז Claude יסדר אותן.</p><div class="sheet-foot"><button class="primary" data-act="modal-close">הבנתי</button></div>`);return}
  openModal(thinkingHtml('Claude מסדר את הסיכום…'));
  aiCtl=new AbortController();
  const prompt=`You help a Hebrew-speaking university student who has learning and memory difficulties organize lecture notes.
Course: ${c?c.name:''}
Lesson topic: ${l.topic||'(not given)'}
The student's raw notes (may be messy, with typos):
"""
${l.notes}
"""
Return ONLY a JSON object, no other text, in this exact shape:
{"notes": string, "terms": [{"t": string, "d": string}], "key": string}
Rules:
- ${PLAIN}
${NOTESFMT}
- "notes": the same content, organized into short lines that start with "- ". If the content has clear parts, add a short header line ending with ":" before each part. Keep ALL information from the original. Do not add facts that are not in the notes. Fix spelling.
- "terms": up to 8 important terms that appear in the notes, each with a short, simple explanation based on the notes.
- "key": one short, simple sentence with the single most important idea of the lesson.`;
  try{
    const r=await sampleFn.json(prompt,{signal:aiCtl.signal,modelTier:'default'});
    aiCtl=null;
    if(!r||typeof r.notes!=='string')throw{code:'invalid_json'};
    aiResult={notes:r.notes,terms:Array.isArray(r.terms)?r.terms.filter(x=>x&&x.t).slice(0,8).map(x=>({t:String(x.t),d:String(x.d||'')})):[],key:String(r.key||'')};
    const have=new Set((l.terms||[]).map(x=>(x.t||'').trim()));
    const newTerms=aiResult.terms.filter(x=>!have.has(x.t.trim()));
    setSheet(`<h2>✨ ככה זה נראה מסודר</h2>
      <div class="preview">${esc(aiResult.notes)}</div>
      ${newTerms.length?`<p><b>מושגים שיתווספו:</b> ${newTerms.map(x=>esc(x.t)).join(', ')}</p>`:''}
      ${aiResult.key?`<div class="recall keypt"><b>הצעה לנקודה החשובה</b>${esc(aiResult.key)}</div>`:''}
      <p class="hint">הגרסה שכתבת נשמרת, ואפשר לחזור אליה בלחיצה.</p>
      <div class="sheet-foot"><button class="primary" data-act="ai-apply">להשתמש בזה</button><button class="ghost" data-act="modal-close">ביטול</button></div>`);
  }catch(e){aiCtl=null;if(e&&e.code==='cancelled')return;if(modalOpen)setSheet(aiErr(e))}
}
function aiApply(){
  const l=S.lessons[view.id];if(!l||!aiResult)return;
  l.prevNotes=l.notes;l.prevHtml=l.notesHtml??null;l.notes=aiResult.notes;l.notesHtml=fmtNotes(aiResult.notes);
  const have=new Set((l.terms||[]).map(x=>(x.t||'').trim()));
  l.terms=(l.terms||[]).filter(x=>x.t||x.d).concat(aiResult.terms.filter(x=>!have.has(x.t.trim())));
  if(!(l.key||'').trim()&&aiResult.key)l.key=aiResult.key;

<<<
${content}
>>>

function examSubmit(timeout){
  const z=exam;if(!z||z.done)return;

let VOICES=[];
function loadVoices(){try{VOICES=(speechSynthesis.getVoices()||[]).filter(v=>/^(he|iw)/i.test(v.lang))}catch(e){VOICES=[]}return VOICES}
try{speechSynthesis.onvoiceschanged=()=>{loadVoices();if(modalOpen&&$('#voice-sel'))setSheet(settingsHtml())};loadVoices()}catch(e){}
function voiceScore(v){const n=v.name||'';let s=0;
  if(/natural|neural|online/i.test(n))s+=10;if(/premium/i.test(n))s+=8;if(/enhanced|משופר/i.test(n))s+=6;if(/siri/i.test(n))s+=5;if(/google/i.test(n))s+=3;if(v.localService===false)s+=1;
  if(/compact|espeak/i.test(n))s-=5;return s}
function bestVoice(){
  const vs=VOICES.length?VOICES:loadVoices();if(!vs.length)return null;
  const want=pref('voice');if(want){const v=vs.find(x=>x.name===want);if(v)return v}
  return vs.slice().sort((a,b)=>voiceScore(b)-voiceScore(a))[0];
}
function voiceLabel(v){const n=v.name.replace(/\s*\(.*?\)\s*/g,' ').replace(/Microsoft|Google|Online|Natural|- Hebrew|Hebrew|\(Israel\)/gi,'').trim()||v.name;
  const q=voiceScore(v)>=8?' – איכות גבוהה':voiceScore(v)>=5?' – משופר':'';return n+q}
function speakable(t){
  return String(t||'')
    .replace(/ד["״]ר/g,'דוקטור').replace(/פרופ['׳]/g,'פרופסור').replace(/גב['׳]/g,'גברת').replace(/וכו['׳]/g,'וכולי').replace(/מס['׳]/g,'מספר')
    .replace(/(\d)\s*%/g,'$1 אחוז').replace(/&/g,' ו').replace(/\s[–—-]\s/g,', ').replace(/[*_#•→←↔]/g,' ').replace(/\s{2,}/g,' ').trim();
}
function makeUtter(text){
  const u=new SpeechSynthesisUtterance(speakable(text));u.lang='he-IL';
  const v=bestVoice();if(v)u.voice=v;
  u.rate=Math.min(1.6,+(pref('rate')||1)*0.96);u.pitch=1.02;u.volume=1;return u;

const BGM={ctx:null,gain:null,timer:null,on:false,step:0};
function bgmStart(){
  try{
    if(!BGM.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;BGM.ctx=new C();BGM.gain=BGM.ctx.createGain();BGM.gain.gain.value=0;
      const lp=BGM.ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;BGM.gain.connect(lp);lp.connect(BGM.ctx.destination)}
    BGM.ctx.resume();BGM.on=true;BGM.gain.gain.cancelScheduledValues(BGM.ctx.currentTime);BGM.gain.gain.linearRampToValueAtTime(.05,BGM.ctx.currentTime+2);
    const CH=[[220,277.18,329.63,415.3],[196,246.94,293.66,369.99],[174.61,220,261.63,329.63],[196,246.94,329.63,392]];
    const play=()=>{if(!BGM.on)return;const t=BGM.ctx.currentTime,ch=CH[BGM.step++%CH.length];
      ch.forEach((f,i)=>{const o=BGM.ctx.createOscillator(),g=BGM.ctx.createGain();o.type=i?'sine':'triangle';o.frequency.value=f/(i?1:2);
        g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.22/(i+1),t+1.6);g.gain.linearRampToValueAtTime(0,t+6.2);o.connect(g);g.connect(BGM.gain);o.start(t);o.stop(t+6.4)});};
    play();clearInterval(BGM.timer);BGM.timer=setInterval(play,5000);

let speaking=false;

function speakLesson(l){

  if(speaking){stopSpeak();return}
  const text=[l.topic,l.key&&('הנקודה החשובה: '+l.key),(l.notes||'').replace(/\[תמונה[^\]]*\]/g,'').replace(/^- /gm,''),(l.terms||[]).filter(x=>x.t).map(x=>x.t+': '+(x.d||'')).join('.\n')].filter(Boolean).join('.\n');

function audioParts(d){
  const parts=[];if(d.intro)chunkText(d.intro).forEach(t=>parts.push({text:t,chap:0}));
  const ord=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שביעי'];
  (d.chapters||[]).forEach((ch,i)=>{
    parts.push({text:`חלק ${ord[i]||i+1}: ${ch.title}.`,title:true,chap:i+1,chTitle:ch.title});
    (ch.paras||[]).forEach(pa=>chunkText(pa).forEach(t=>parts.push({text:t,chap:i+1})));
    if(ch.check&&ch.check.q){parts.push({text:'שאלה קטנה לחשוב עליה: '+ch.check.q,chap:i+1});parts.push({pause:5000,chap:i+1});parts.push({text:'התשובה: '+(ch.check.a||''),chap:i+1})}
  });
  const n=(d.chapters||[]).length+1;
  if((d.recap||[]).length){parts.push({text:'ולסיכום, '+(d.recap.length===3?'שלושה':'כמה')+' דברים לזכור.',title:true,chap:n,chTitle:'סיכום'});
    d.recap.forEach((r,i)=>parts.push({text:`${['ראשון','שני','שלישי','רביעי','חמישי'][i]||''}: ${r}`,chap:n}))}
  if(d.outro)chunkText(d.outro).forEach(t=>parts.push({text:t,chap:n}));
  return parts;
}
async function aiScript(lid){
  const l=S.lessons[lid];if(!l)return [];const hsh=hashLesson(l);
  if(!(l.audio&&l.audio.hash===hsh&&l.audio.v===3&&l.audio.data)){
    const c=courseById(l.courseId);
    const r=await sampleFn.json(`Create an AUDIO LESSON in Hebrew that teaches this lecture to a university student with learning and memory difficulties, who will only LISTEN to it (while driving, working out or walking). After listening once, they should truly understand the material, even if they missed the lecture. Course: ${c?c.name:''}.
Lecture notes (between the markers):
<<<
${lessonText(l)}
>>>
Return ONLY JSON, no other text:
{"intro": string, "chapters": [{"title": string, "paras": [string], "check": {"q": string, "a": string}}], "recap": [string, string, string], "outro": string}
Content:
- 3 to 6 chapters, in the notes' order, one main idea each. Together they must cover everything important in the notes. Explain from zero: what it is, why it matters, how it works, and one concrete everyday example or analogy from Israeli daily life.
- "intro": 2-3 sentences: what we will learn today and why it is useful.
- "title": 2-5 words.
- "paras": 2-5 short spoken paragraphs per chapter (1-3 sentences each).
- "check": a quick question to think about after the chapter, and a short answer (one sentence).
- "recap": exactly 3 key points, one simple sentence each. "outro": one short encouraging sentence.
Style: a warm, clear friend on a podcast, talking directly to the listener ("אתה"), natural spoken Hebrew, rhetorical questions, smooth transitions. Short sentences. Spell numbers and abbreviations as words. No symbols, lists, parentheses, emojis or markdown. Do not add facts beyond simple clarifications. Total about 500-900 words.`,{modelTier:'default'});
    if(!r||!Array.isArray(r.chapters)||!r.chapters.length)throw{code:'invalid_json'};
    const data={intro:String(r.intro||''),chapters:r.chapters.slice(0,7).map(ch=>({title:String(ch.title||''),paras:(Array.isArray(ch.paras)?ch.paras:[]).map(String),check:ch.check&&ch.check.q?{q:String(ch.check.q),a:String(ch.check.a||'')}:null})),recap:(Array.isArray(r.recap)?r.recap:[]).slice(0,5).map(String),outro:String(r.outro||'')};
    const L=S.lessons[lid];if(!L)return [];L.audio={hash:hsh,v:3,data};saveDoc(lid,0);
  }
  return audioParts(S.lessons[lid].audio.data);
}
async function explainAgain(){
  const tr=PL.tracks[PL.t];if(!tr||!sampleFn)return;
  const cur=tr.parts[PL.c]||{};const ch=cur.chap;
  const txt=tr.parts.filter(p=>p.text&&(ch==null||p.chap===ch)).map(p=>p.text).join(' ').slice(0,4000)||cur.text||'';
  plPause();PL.now='רגע, Claude מסביר את זה בדרך אחרת…';plUI();
  try{
    const r=await sampleFn(`A student is listening to an audio lesson in Hebrew and said "לא הבנתי". Explain this part again, more simply and in different words, with a new everyday example or analogy. Spoken, friendly Hebrew, talking to "אתה". Short sentences, no symbols or lists. 80-160 words. Start with a sentence like "בוא ננסה להסביר את זה אחרת."
Part to re-explain:
<<<
${txt}
>>>`,{modelTier:'default'});
    const extra=chunkText(r.text||'').map(t=>({text:t,chap:ch}));
    if(extra.length){
      let end=PL.c;while(end<tr.parts.length&&(ch==null||tr.parts[end].chap===ch))end++;
      tr.parts.splice(end,0,...extra,{text:'עכשיו זה ברור יותר? נמשיך.',chap:ch});
      PL.c=end;
    }
  }catch(e){}
  plResume();
}
function chapterInfo(){
  const tr=PL.tracks[PL.t];if(!tr)return '';const cur=tr.parts[Math.min(PL.c,tr.parts.length-1)]||{};
  const titles=tr.parts.filter(p=>p.title&&p.chTitle);if(!titles.length||cur.chap==null)return '';
  const t=titles.find(p=>p.chap===cur.chap);return t?`חלק ${titles.indexOf(t)+1} מתוך ${titles.length}: ${t.chTitle}`:'';
}
async function plStep(){
  if(!PL.playing)return;
  const tr=PL.tracks[PL.t];
  if(!tr){bgmStop();PL.playing=false;PL.now='סיימת את ההאזנה. כל הכבוד!';plUI();wake(false);markActive();return}
  if(PL.c>=tr.parts.length){PL.t++;PL.c=0;return plStep()}
  const part=tr.parts[PL.c];
  if(part.ai){
    if(PL.busy)return;PL.busy=true;PL.now='רגע, Claude מכין לך את השיעור המוסבר… (בפעם הראשונה זה לוקח כחצי דקה)';plUI();
    try{const extra=await aiScript(tr.lid);tr.parts.splice(PL.c,1,...(extra.length?extra:[{text:'לא הצלחתי להכין הסבר. ממשיך.'}]));
      const nx=PL.tracks[PL.t+1];if(nx&&nx.lid&&nx.parts.some(p=>p.ai))aiScript(nx.lid).catch(()=>{})}
    catch(e){tr.parts.splice(PL.c,1,...lessonParts(S.lessons[tr.lid]||{},0,'mine').slice(1))}
    PL.busy=false;return plStep();
  }
  if(part.pause){PL.now='…';plUI();PL.timer=setTimeout(()=>{PL.c++;plStep()},part.pause);return}
  PL.now=part.text;plUI();
  const ss=window.speechSynthesis;if(!ss){PL.playing=false;PL.now='המכשיר הזה לא תומך בהקראה.';plUI();return}
  const u=makeUtter(part.text);
  const my=PL.seq=(PL.seq||0)+1;
  u.onend=()=>{if(PL.seq!==my||!PL.playing)return;PL.c++;PL.timer=setTimeout(plStep,part.title?700:230)};
  u.onerror=()=>{if(PL.seq!==my||!PL.playing)return;PL.c++;setTimeout(plStep,50)};
  ss.speak(u);
}
function plStart(){
  PL.tracks=buildTracks();PL.t=0;PL.c=0;PL.now='';
  if(!PL.tracks.length)return;
  try{speechSynthesis.cancel()}catch(e){}
  speaking=false;PL.playing=true;render();wake(true);if(pref('bgm')==='1')bgmStart();plStep();
}
function plPause(){bgmStop();PL.playing=false;PL.seq=(PL.seq||0)+1;clearTimeout(PL.timer);try{speechSynthesis.cancel()}catch(e){}plUI();wake(false)}
function plResume(){if(!PL.tracks.length)return;PL.playing=true;if(pref('bgm')==='1')bgmStart();plUI();wake(true);plStep()}
function chapStarts(tr){const a=[];(tr?tr.parts:[]).forEach((p,i)=>{if(p.title)a.push(i)});return a}
function plChapter(dir){
  const tr=PL.tracks[PL.t];const st=chapStarts(tr);
  if(dir===0){const s=st.filter(i=>i<=PL.c).pop();plJump(0,(s!=null?s:0)-PL.c);return}
  if(dir>0){const n=st.find(i=>i>PL.c);if(n!=null){plJump(0,n-PL.c);return}plJump(1,0);return}
  const prev=st.filter(i=>i<PL.c-2);const p=prev.length?prev[prev.length-1]:null;
  if(p!=null){plJump(0,p-PL.c);return}if(PL.c>2){plJump(0,-PL.c);return}plJump(-1,0);
}
function plJump(dt,dc){const was=PL.playing;plPause();
  if(dt){PL.t=Math.max(0,Math.min(PL.tracks.length-1,PL.t+dt));PL.c=0}
  if(dc){PL.c=Math.max(0,PL.c+dc)}
  const tr=PL.tracks[PL.t];PL.now=tr&&tr.parts[PL.c]&&tr.parts[PL.c].text||'';plUI();if(was)plResume();}
function plStop(){plPause();PL.tracks=[];PL.now='';render()}

function startReview(){
  const items=dueReview().map(x=>({doc:x.doc,qi:x.qi}));if(!items.length)return;
  quiz={mode:'review',items,i:0,pick:null,right:0,wrong:[]};openModal(mcHtml());
}
function mcHtml(){
  const z=quiz,title=z.mode==='review'?'חזרה יומית':z.mode==='course'?'מבחן על כל החומר':'מבחן על השיעור';
  if(z.i>=z.items.length){
    const n=z.items.length,pct=z.right/n;
    const msg=pct===1?'מושלם! החומר יושב טוב.':pct>=.6?'יפה מאוד! מה שטעית בו יחזור אליך בחזרה היומית.':'זה בדיוק בשביל זה. השאלות שטעית בהן יחזרו מחר בחזרה היומית.';
    if(z.mode==='lesson'){const l=S.lessons[z.lid];if(l&&l.quiz){l.quiz.last=z.right;saveDoc(z.lid,0)}}
    return `<h2>${title}</h2><div class="score">${z.right}/${n}</div><p style="text-align:center">${msg}</p>
    ${z.wrong.length?`<div class="mc-explain"><b>כדאי לזכור:</b><ul style="margin:.3rem 0 0;padding-inline-start:1.2rem">${z.wrong.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div>`:''}
    <div class="sheet-foot"><button class="primary" data-act="modal-close">סיום</button>${z.mode==='lesson'?`<button class="ghost" data-act="quiz-again">שוב</button>`:''}${z.mode==='course'?`<button class="ghost" data-act="course-quiz" data-id="${z.cid}">מבחן חדש</button>`:''}</div>`;
  }
  const it=z.items[z.i],q=qOf(it);
  if(!q){z.i++;return mcHtml()}
  const c=courseOfDoc(it.doc)||{name:''};
  const where=it.doc.startsWith('Q_')?(q.lno?`שיעור ${q.lno}`:'כל החומר'):`שיעור ${lessonNo(it.doc)}`;
  const answered=z.pick!=null;
  return `<h2>${title}</h2><div class="bar"><i style="width:${Math.round(z.i/z.items.length*100)}%"></i></div>
  <p class="hint">שאלה ${z.i+1} מתוך ${z.items.length}${z.mode==='review'?`, ${esc(c.name)}, ${where}`:z.mode==='course'&&q.lno?`, משיעור ${q.lno}`:''}</p>
  <div class="mc-q">${esc(q.q)}</div>
  <div class="mc-opts">${q.o.map((o,oi)=>{let cls='';if(answered){if(oi===q.a)cls='right';else if(oi===z.pick)cls='wrong'}
    return `<button class="mc-opt ${cls}" data-act="mc-pick" data-o="${oi}" ${answered?'disabled':''}><span class="ltr">${'אבגד'[oi]}.</span><span>${esc(o)}</span></button>`}).join('')}</div>
  ${answered?`<div class="mc-explain"><b>${z.pick===q.a?'נכון! ':'לא בדיוק. '}</b>${esc(q.e||('התשובה הנכונה: '+q.o[q.a]))}</div>
    <div class="sheet-foot"><button class="primary" data-act="mc-next">${z.i+1<z.items.length?'לשאלה הבאה':'לתוצאה'}</button></div>`
  :`<div class="sheet-foot"><button class="ghost" data-act="modal-close">אחר כך</button></div>`}`;
}
function mcPick(oi){
  const z=quiz;if(!z||z.pick!=null)return;
  const it=z.items[z.i],q=qOf(it);if(!q)return;
  z.pick=oi;const ok=oi===q.a;
  if(ok)z.right++;else z.wrong.push(q.o[q.a]+(q.e?' – '+q.e:''));
  schedule(q,ok);saveDoc(it.doc);
  setSheet(mcHtml());
}

let savedRange=null;
document.addEventListener('selectionchange',()=>{const ed=$('#f-rich'),s=getSelection();if(ed&&s.rangeCount&&ed.contains(s.anchorNode)){savedRange=s.getRangeAt(0).cloneRange();updateRtb()}});
function updateRtb(){
  const tb=$('.rtb');if(!tb)return;
  const st=c=>{try{return document.queryCommandState(c)}catch(e){return false}};
  let blk='';try{blk=(document.queryCommandValue('formatBlock')||'').toLowerCase()}catch(e){}
  tb.querySelectorAll('[data-fmt]').forEach(b=>{const f=b.dataset.fmt;
    if(['bold','underline','insertUnorderedList','insertOrderedList'].includes(f))b.setAttribute('aria-pressed',st(f));
    if(f==='h')b.setAttribute('aria-pressed',blk===b.dataset.v);});
}
function fmt(cmd,val){
  const ed=$('#f-rich');if(!ed)return;
  if(cmd==='draw'){openDraw(null);return}
  if(cmd==='image'){const i=$('#img-in');if(i){i.value='';i.click()}return}
  if(cmd==='explain'){const txt=(savedRange&&ed.contains(savedRange.commonAncestorContainer)?savedRange.toString():'').trim();explainText(txt);return}
  ed.focus();if(savedRange){const s=getSelection();s.removeAllRanges();s.addRange(savedRange)}
  try{
    if(cmd==='h'){let cur='';try{cur=(document.queryCommandValue('formatBlock')||'').toLowerCase()}catch(e){}document.execCommand('formatBlock',false,cur===val?'<p>':'<'+val+'>')}
    else if(cmd==='mark'){document.execCommand('styleWithCSS',false,true);document.execCommand('hiliteColor',false,'#F7DB6A');document.execCommand('styleWithCSS',false,false)}
    else if(cmd==='size'){document.execCommand('styleWithCSS',false,false);document.execCommand('fontSize',false,val)}
    else if(cmd==='clear'){document.execCommand('removeFormat');document.execCommand('formatBlock',false,'<p>')}
    else document.execCommand(cmd,false,null);
  }catch(e){}
  ed.dispatchEvent(new Event('input',{bubbles:true}));updateRtb();
}

async function insertImages(files){
  const ed=$('#f-rich');if(!ed)return;const lid=view.id;
  if(!assetsNs){openModal(`<h2>תמונות</h2><p>אי אפשר לשמור תמונות כאן. פתח את מרקר מהקישור ב-Claude.</p><div class="sheet-foot"><button class="primary" data-act="modal-close">הבנתי</button></div>`);return}
  const st=$('#status');
  for(const f of files){
    if(!f.type.startsWith('image/'))continue;
    if(st){st.className='status';st.textContent='מעלה תמונה…'}
    let blob,up;
    try{blob=await shrinkImage(f,1600);up=await assetsNs.upload(blob)}catch(e){if(st){st.className='status err';st.textContent='התמונה לא נשמרה'}continue}
    const ed2=$('#f-rich');
    if(ed2&&view.name==='lesson'&&view.id===lid){
      ed2.focus();const s=getSelection();
      if(savedRange&&ed2.contains(savedRange.commonAncestorContainer)){s.removeAllRanges();s.addRange(savedRange)}
      else{const r=document.createRange();r.selectNodeContents(ed2);r.collapse(false);s.removeAllRanges();s.addRange(r)}
      document.execCommand('insertHTML',false,`<img src="/_blob/${up.id}" alt=""><p><br></p>`);
      ed2.dispatchEvent(new Event('input',{bubbles:true}));
    }else{const l=S.lessons[lid];if(l){l.notesHtml=notesHtmlOf(l)+`<img src="/_blob/${up.id}" alt="">`;l.notes=htmlToText(l.notesHtml);saveDoc(lid)}}
    if(sampleFn&&imgCaps)describeImage(blob,up.id,lid);
  }
  updateStatus();
}
async function describeImage(blob,id,lid){
  try{
    const l=S.lessons[lid],c=l&&courseById(l.courseId);
    const r=await sampleFn(`This image (a screenshot, drawing, diagram, chart or photo) was added to a university student's lecture notes (course: ${c?c.name:''}). Describe it in simple Hebrew for their notes: what it shows, important labels or axes, and the main idea it illustrates. 1-3 short sentences. No preface, no markdown.`,{images:[blob],modelTier:'default'});

function drawSize(){

function drawBg(ctx,w,hgt,bg){
  ctx.clearRect(0,0,w,hgt);ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,w,hgt);
  const u=w/34;ctx.strokeStyle='#C9D6E3';ctx.fillStyle='#B7C6D6';ctx.lineWidth=Math.max(1,w/1400);
  if(bg==='lines'){for(let y=u*2;y<hgt;y+=u*1.25){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}ctx.strokeStyle='#F0B4B4';ctx.beginPath();ctx.moveTo(w-u*1.6,0);ctx.lineTo(w-u*1.6,hgt);ctx.stroke()}
  if(bg==='grid'){const g=u*.8;for(let x=w%g;x<w;x+=g){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,hgt);ctx.stroke()}for(let y=g;y<hgt;y+=g){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}}
  if(bg==='dots'){const g=u*.8,r=Math.max(1,w/900);for(let x=g/2;x<w;x+=g)for(let y=g/2;y<hgt;y+=g){ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}}
}
function strokePath(ctx,s,W){
  const pts=s.p;if(!pts.length)return;
  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=s.c;
  if(s.t==='hl'){ctx.globalAlpha=.32;ctx.lineWidth=.024*W;ctx.beginPath();ctx.moveTo(pts[0][0]*W,pts[0][1]*W);for(const q of pts)ctx.lineTo(q[0]*W,q[1]*W);ctx.stroke();ctx.restore();return}
  const base=(DSIZE[s.w]||DSIZE.m)*W;
  if(pts.length===1){ctx.fillStyle=s.c;ctx.beginPath();ctx.arc(pts[0][0]*W,pts[0][1]*W,base*(.5+pts[0][2])/2,0,7);ctx.fill();ctx.restore();return}
  let sx=pts[0][0]*W,sy=pts[0][1]*W;
  for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],mx=(a[0]+b[0])/2*W,my=(a[1]+b[1])/2*W;ctx.lineWidth=base*(.45+(a[2]+b[2])/2);
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.quadraticCurveTo(a[0]*W,a[1]*W,mx,my);ctx.stroke();sx=mx;sy=my}
  const z=pts[pts.length-1];ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(z[0]*W,z[1]*W);ctx.stroke();
  ctx.restore();
}
function redraw(){const c=$('#dcv'),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);D.strokes.forEach(s=>strokePath(ctx,s,c.width));const l=$('#dlive');l.getContext('2d').clearRect(0,0,l.width,l.height)}
function dpt(e){const r=$('#dlive').getBoundingClientRect();const pr=e.pointerType==='pen'?(e.pressure||.5):.5;return[+((e.clientX-r.left)/r.width).toFixed(4),+((e.clientY-r.top)/r.width).toFixed(4),+pr.toFixed(2)]}
function eraseAt(pt){const r=.018;const keep=D.strokes.filter(s=>!s.p.some(q=>Math.hypot(q[0]-pt[0],q[1]-pt[1])<r+(s.t==='hl'?.012:0)));if(keep.length!==D.strokes.length){D.strokes=keep;D.dirty=true;redraw()}}
(function(){
  const live=document.getElementById('dlive');
  live.addEventListener('pointerdown',e=>{
    if(e.pointerType==='pen'&&!D.sawPen){D.sawPen=true;if(!D.penOnly){D.penOnly=true;$('#dtb').innerHTML=iconize(drawTbHtml());$('#dpage').classList.add('pan')}}
    if(D.penOnly&&e.pointerType==='touch')return;
    e.preventDefault();try{live.setPointerCapture(e.pointerId)}catch(_){}
    D.hist.push(D.strokes.slice());if(D.hist.length>60)D.hist.shift();D.redo=[];
    const pt=dpt(e);
    if(D.tool==='eraser'){D.erasing=true;eraseAt(pt);return}
    D.cur={t:D.tool,c:D.color,w:D.size,p:[pt]};
  });
  live.addEventListener('pointermove',e=>{
    if(!D.cur&&!D.erasing)return;e.preventDefault();
    const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    if(D.erasing){evs.forEach(ev=>eraseAt(dpt(ev)));return}
    evs.forEach(ev=>D.cur.p.push(dpt(ev)));
    const ctx=live.getContext('2d');ctx.clearRect(0,0,live.width,live.height);strokePath(ctx,D.cur,live.width);
  });
  const end=e=>{
    if(D.erasing){D.erasing=false;return}
    if(!D.cur)return;const s=D.cur;D.cur=null;
    if(s.p.length){D.strokes.push(s);D.dirty=true;const c=$('#dcv');strokePath(c.getContext('2d'),s,c.width)}
    const ctx=live.getContext('2d');ctx.clearRect(0,0,live.width,live.height);
  };
  live.addEventListener('pointerup',end);live.addEventListener('pointercancel',end);live.addEventListener('pointerleave',e=>{if(e.pointerType!=='touch')end(e)});
  window.addEventListener('resize',()=>{if(D.open)drawSize()});
})();
function exportDrawing(){
  const W=1400,H=Math.round(W*D.h),c=document.createElement('canvas');c.width=W;c.height=H;const ctx=c.getContext('2d');
  drawBg(ctx,W,H,D.bg);D.strokes.forEach(s=>strokePath(ctx,s,W));
  return new Promise(r=>c.toBlob(r,'image/png'));
}

async function handwritingToText(png,id,lid){
  const st=$('#status');if(st){st.className='status';st.textContent='Claude קורא את כתב היד…'}

    const l=S.lessons[lid],c=l&&courseById(l.courseId);

  }catch(e){}

function drawClose(force){
  if(!force&&D.dirty&&D.strokes.length&&!confirm('לצאת בלי לשמור את הציור?'))return;
  D.open=false;$('#draw').hidden=true;document.body.style.overflow='';
}
function drawAct(a,v){
  if(a==='tool'){D.tool=v}
  else if(a==='color'){D.color=v;if(D.tool==='eraser')D.tool='pen'}
  else if(a==='size'){D.size=v;if(D.tool==='eraser')D.tool='pen'}
  else if(a==='bg'){D.bg=v;pref('dbg',v);drawBg($('#dbg').getContext('2d'),$('#dbg').width,$('#dbg').height,v)}
  else if(a==='undo'){if(D.hist.length){D.redo.push(D.strokes);D.strokes=D.hist.pop();D.dirty=true;redraw()}return}
  else if(a==='redo'){if(D.redo.length){D.hist.push(D.strokes);D.strokes=D.redo.pop();redraw()}return}
  else if(a==='pen'){D.penOnly=!D.penOnly;$('#dpage').classList.toggle('pan',D.penOnly)}
  else if(a==='clear'){if(D.strokes.length&&confirm('לנקות את כל הדף?')){D.hist.push(D.strokes);D.strokes=[];D.dirty=true;redraw()}return}
  else if(a==='more'){D.h+=.7;drawSize();return}
  else if(a==='save'){drawSave(v==='text');return}
  else if(a==='close'){drawClose(false);return}
  $('#dtb').innerHTML=iconize(drawTbHtml());
}

${(l?lessonText(l):'').slice(0,8000)}

${PLAIN}

const fmtT=s=>{s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};

function timerHtml(){

/* ---------- exam plan ---------- */
let planDraft=null;
function buildPlan(task){
  const t=todayKey(),days=daysBetween(t,task.due);const ls=lessonsOf(task.courseId).filter(l=>!isEmptyLesson(l));
  if(days<1)return {err:'המבחן היום או שכבר עבר, אין זמן לתוכנית.'};
  if(!ls.length)return {err:'עוד אין סיכומים בקורס הזה, אז אין על מה לבנות תוכנית.'};
  const items=[];const studyDays=Math.max(1,days-1);
  const chunks=Math.min(studyDays,ls.length);
  for(let k=0;k<chunks;k++){
    const a=Math.floor(k*ls.length/chunks),b=Math.floor((k+1)*ls.length/chunks)-1;
    items.push({due:addDays(t,k),title:a===b?`חזרה למבחן: שיעור ${a+1}${ls[a].topic?' ('+ls[a].topic.slice(0,25)+')':''}`:`חזרה למבחן: שיעורים ${a+1}–${b+1}`});
  }
  for(let k=chunks;k<studyDays;k++)items.push({due:addDays(t,k),title:'חזרה למבחן: תרגול מושגים וחזרה יומית'});
  if(days>=2)items.push({due:addDays(t,days-1),title:'חזרה למבחן: מבחן תרגול על כל החומר + הנקודות החשובות'});
  return {items};
}
function openPlan(taskId){
  const task=S.tasks.find(x=>x.id===taskId);if(!task)return;const c=courseById(task.courseId);
  const r=buildPlan(task);planDraft={taskId,items:r.items||[]};
  openModal(`<h2>📅 תוכנית חזרה: ${esc(task.title)}</h2><p class="hint">${c?esc(c.name)+', ':''}המבחן ב-${shortDate(task.due)}. כל יום חלק קטן, וביום האחרון מבחן תרגול.</p>
  ${r.err?`<p>${r.err}</p>`:`<div class="list">${r.items.map(x=>`<div class="task"><div class="grow"><span class="tt">${esc(x.title)}</span><span class="small">${dueInfo(x.due).txt}</span></div></div>`).join('')}</div>`}
  <div class="sheet-foot">${r.err?'':'<button class="primary" data-act="plan-apply">להוסיף למשימות</button>'}<button class="ghost" data-act="modal-close">${r.err?'סגירה':'ביטול'}</button></div>`);
}
function applyPlan(){
  const d=planDraft;if(!d)return;const task=S.tasks.find(x=>x.id===d.taskId);if(!task)return;
  S.tasks=S.tasks.filter(x=>x.planFor!==d.taskId||x.done);
  d.items.forEach(x=>S.tasks.push({id:uid(),title:x.title,due:x.due,courseId:task.courseId,lessonId:'',kind:'task',done:false,planFor:d.taskId}));
  saveDoc('tasks',0);planDraft=null;$('#modal').classList.remove('open');modalOpen=false;go('tasks');
}

async function shrinkImage(file,max=2000){
  try{const bmp=await createImageBitmap(file,{imageOrientation:'from-image'});const s=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',.85));}catch(e){return file}
}
