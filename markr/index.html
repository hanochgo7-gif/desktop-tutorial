    if(!BGM.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;BGM.ctx=new C();BGM.gain=BGM.ctx.createGain();BGM.gain.gain.value=0;
      const lp=BGM.ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;BGM.gain.connect(lp);lp.connect(BGM.ctx.destination)}
    BGM.ctx.resume();BGM.on=true;BGM.gain.gain.cancelScheduledValues(BGM.ctx.currentTime);BGM.gain.gain.linearRampToValueAtTime(.05,BGM.ctx.currentTime+2);
    const CH=[[220,277.18,329.63,415.3],[196,246.94,293.66,369.99],[174.61,220,261.63,329.63],[196,246.94,329.63,392]];
    const play=()=>{if(!BGM.on)return;const t=BGM.ctx.currentTime,ch=CH[BGM.step++%CH.length];
      ch.forEach((f,i)=>{const o=BGM.ctx.createOscillator(),g=BGM.ctx.createGain();o.type=i?'sine':'triangle';o.frequency.value=f/(i?1:2);
        g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.22/(i+1),t+1.6);g.gain.linearRampToValueAtTime(0,t+6.2);o.connect(g);g.connect(BGM.gain);o.start(t);o.stop(t+6.4)});};

function audioParts(d){

<<<
${lessonText(l)}
>>>

- 3 to 6 chapters, in the notes' order, one main idea each. Together they must cover everything important in the notes. Explain from zero: what it is, why it matters, how it works, and one concrete everyday example or analogy from Israeli daily life.

  const part=tr.parts[PL.c];
  if(part.ai){
    if(PL.busy)return;PL.busy=true;PL.now='רגע, Claude מכין לך את השיעור המוסבר… (בפעם הראשונה זה לוקח כחצי דקה)';plUI();

function drawBg(ctx,w,hgt,bg){

/* ---------- exam plan ---------- */
let planDraft=null;
function buildPlan(task){
  const t=todayKey(),days=daysBetween(t,task.due);const ls=lessonsOf(task.courseId).filter(l=>!isEmptyLesson(l));
  if(days<1)return {err:'המבחן היום או שכבר עבר, אין זמן לתוכנית.'};
  if(!ls.length)return {err:'עוד אין סיכומים בקורס הזה, אז אין על מה לבנות תוכנית.'};
  const items=[];const studyDays=Math.max(1,days-1);
  const chunks=Math.min(studyDays,ls.length);
  for(let k=0;k<chunks;k++){
    const a=Math.floor(k*ls.length/chunks),b=Math.floor((k+1)*ls.length/chunks)-1;
    items.push({due:addDays(t,k),title:a===b?`חזרה למבחן: שיעור ${a+1}${ls[a].topic?' ('+ls[a].topic.slice(0,25)+')':''}`:`חזרה למבחן: שיעורים ${a+1}–${b+1}`});
  }
  for(let k=chunks;k<studyDays;k++)items.push({due:addDays(t,k),title:'חזרה למבחן: תרגול מושגים וחזרה יומית'});
  if(days>=2)items.push({due:addDays(t,days-1),title:'חזרה למבחן: מבחן תרגול על כל החומר + הנקודות החשובות'});
  return {items};
}
function openPlan(taskId){
  const task=S.tasks.find(x=>x.id===taskId);if(!task)return;const c=courseById(task.courseId);
  const r=buildPlan(task);planDraft={taskId,items:r.items||[]};
  openModal(`<h2>📅 תוכנית חזרה: ${esc(task.title)}</h2><p class="hint">${c?esc(c.name)+', ':''}המבחן ב-${shortDate(task.due)}. כל יום חלק קטן, וביום האחרון מבחן תרגול.</p>
  ${r.err?`<p>${r.err}</p>`:`<div class="list">${r.items.map(x=>`<div class="task"><div class="grow"><span class="tt">${esc(x.title)}</span><span class="small">${dueInfo(x.due).txt}</span></div></div>`).join('')}</div>`}
  <div class="sheet-foot">${r.err?'':'<button class="primary" data-act="plan-apply">להוסיף למשימות</button>'}<button class="ghost" data-act="modal-close">${r.err?'סגירה':'ביטול'}</button></div>`);
}
function applyPlan(){
  const d=planDraft;if(!d)return;const task=S.tasks.find(x=>x.id===d.taskId);if(!task)return;
  S.tasks=S.tasks.filter(x=>x.planFor!==d.taskId||x.done);
  d.items.forEach(x=>S.tasks.push({id:uid(),title:x.title,due:x.due,courseId:task.courseId,lessonId:'',kind:'task',done:false,planFor:d.taskId}));
  saveDoc('tasks',0);planDraft=null;$('#modal').classList.remove('open');modalOpen=false;go('tasks');
}

let pdfReady=null;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function loadPdf(){
  if(!pdfReady)pdfReady=loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js')

}
async function shrinkImage(file,max=2000){
  try{const bmp=await createImageBitmap(file,{imageOrientation:'from-image'});const s=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',.85));}catch(e){return file}
}

function addTask(title,due,courseId,lessonId,kind){

function startPractice(cid,lid){
  const ls=lessonsOf(cid);const src=lid?ls.filter(l=>l.id===lid):ls;
  const cards=src.flatMap(l=>{const no=ls.indexOf(l)+1;return [...((l.cards&&l.cards.list)||[]).map(x=>({t:x.q,d:x.a,no})),...(l.terms||[]).filter(x=>x.t).map(x=>({...x,no}))]});
  for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]]}
  practice={cid,cards,i:0,flip:false,known:0,total:cards.length};
}

function onField(e){
  const el=e.target;
  if(el.tagName==='TEXTAREA')grow(el);
  if(el.id==='search-q'){lastQ=el.value;$('#search-res').innerHTML=searchResults(lastQ);return}
  if(el.dataset.pf){S.profile[el.dataset.pf]=el.value;saveDoc('profile');return}
  if(el.dataset.cf&&formDraft){formDraft[el.dataset.cf]=el.type==='checkbox'?el.checked:el.value;formDraft._dirty=1;return}
  if(el.dataset.s!=null&&formDraft){formDraft.sessions[+el.dataset.s][el.dataset.k]=el.value;formDraft._dirty=1;return}
  if(el.dataset.td&&taskDraft){taskDraft[el.dataset.td]=el.value;taskDraft._dirty=1;if(el.dataset.td==='title'){const b=$('[data-act=td-ai]');if(b)b.disabled=!el.value.trim();$('#td-err').textContent=''}
    if(el.dataset.td==='due')document.querySelectorAll('[data-act=td-due]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===el.value));return}
  if(el.dataset.ts!=null&&taskDraft){const st=taskDraft.steps[+el.dataset.ts];if(st){st.t=el.value;taskDraft._dirty=1}return}
  if(el.dataset.tsd!=null&&taskDraft){const st=taskDraft.steps[+el.dataset.tsd];if(st){st.done=el.checked;taskDraft._dirty=1;el.closest('.step').classList.toggle('done',el.checked)}return}
  if(el.id==='f-rich'){const l=S.lessons[view.id];if(!l)return;markActive();l.notesHtml=sanitize(el.innerHTML);l.notes=htmlToText(l.notesHtml);if(!l.notes)l.notesHtml='';saveDoc(view.id);return}
  if(view.name==='lesson'&&el.closest('.editor')){
    const l=S.lessons[view.id];if(!l)return;
    if(el.dataset.f){l[el.dataset.f]=el.value;saveDoc(view.id)}
    else if(el.dataset.l){const it=l[el.dataset.l][+el.dataset.i];if(!it)return;
      it[el.dataset.k]=el.type==='checkbox'?el.checked:el.value;
      if(el.type==='checkbox')el.closest('.row').classList.toggle('answered',el.checked);
      saveDoc(view.id)}
  }
}

/* ---------- start ---------- */
applyPrefs();
document.querySelectorAll('#nav button[data-to]').forEach(b=>{b.innerHTML=ic({home:'home',courses:'book',tasks:'check',search:'search'}[b.dataset.to])+'<span>'+b.textContent+'</span>'});
document.querySelector('[data-act=settings]').innerHTML=ic('sliders')+'<span class="lbl-d">הגדרות</span>';
document.querySelector('.nav-add').innerHTML=ic('plus')+'<span class="lbl">הוספה</span>';
function setHdr(){const t=document.querySelector('.top');if(t)document.documentElement.style.setProperty('--hdr-h',(innerWidth>=1024?0:t.offsetHeight)+'px')}
window.addEventListener('resize',setHdr);setHdr();
(async function init(){
  render();
  let db=null,id=null;
  try{
    if(window.claude&&typeof claude.use==='function'){
      const [d,u,s,dl,as]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('sample'),claude.use('downloads'),claude.use('assets')]);
      db=d;window.__dbRaw=d;id=u?await u.id():null;sampleFn=s||null;downloadsNs=dl||null;assetsNs=as||null;
      let canW=null;if(u&&typeof u.can==='function'){try{canW=await u.can('data.write');if(canW===false)db=null}catch(e){}}
      if(db&&pref('forceLocal')==='1')db=null;
      if(db&&id&&canW!==true){
        try{await Promise.race([db.collection('data/users/'+id).doc('ping').set({t:Date.now()}),new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),5000))])}
        catch(e){if(e&&(e.code==='invalid_argument'||e.code==='not_granted'||e.code==='revoked'||e.code==='capability_disabled')){db=null;pref('forceLocal','1')}}
      }
      if(sampleFn){try{const lim=await sampleFn.limits();imgCaps=lim&&lim.images?lim.images:null}catch(e){imgCaps=null}}
    }
  }catch(e){}
  if(db&&id){try{store=makeDbStore(db.collection('data/users/'+id))}catch(e){store=null}}
  if(!store)store=makeLocalStore();
  if(window.__dbRaw){try{const sn=await window.__dbRaw.doc('public/template').get();if(sn&&sn.exists){const t=sn.data();if(t&&Array.isArray(t.courses)&&t.courses.length){TEMPLATE=clone(t);if(modalOpen&&wizard)setSheet(onbHtml());else if(loaded&&view.name==='home')render()}}}catch(e){}}
  store.subscribe(applyDocs,()=>{statusErr=true;updateStatus()});
})();
</script>
</body>
</html>
