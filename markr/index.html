async function runUpload(){
  const files=[...($('#up-files').files||[])];
  const cid=$('#up-course').value,target=$('#up-target').value,date=$('#up-date').value||todayKey();
  const pasted=(($('#up-text')||{}).value||'').trim(),url=(($('#up-url')||{}).value||'').trim();
  if(!files.length&&!pasted){if(url){upDraft={...upDraft,cid};setSheet(linkHelpHtml(url,cid));return}$('#up-err').textContent='צריך לבחור קובץ, תמונה או להדביק טקסט.';return}
  upDraft={...upDraft,cid,target,date};
  const c=courseById(cid);
  setSheet(thinkingHtml('קורא את הקבצים…'));
  aiCtl=new AbortController();const sig=aiCtl.signal;
  try{
    const maxImg=imgCaps?imgCaps.maxCount:0;
    const images=[],keep=[],texts=[],names=[];
    if(pasted)texts.push('טקסט שהועתק מהמצגת'+(url?` (${url})`:'')+':\n'+pasted.slice(0,60000));
    for(const f of files){
      names.push(f.name);
      const isPdf=f.type==='application/pdf'||/\.pdf$/i.test(f.name);
      if(f.type.startsWith('image/')){
        if(!imgCaps)throw{code:'no_images'};
        const b=await shrinkImage(f);if(images.length<maxImg)images.push(b);keep.push({blob:b,name:f.name});
      }else if(isPdf){
        let lib;try{lib=await loadPdf()}catch(e){throw{code:'pdf'}}
        const doc=await lib.getDocument({data:new Uint8Array(await f.arrayBuffer()),isEvalSupported:false}).promise;
        let txt='';
        for(let pn=1;pn<=Math.min(doc.numPages,80);pn++){
          const page=await doc.getPage(pn);const tc=await page.getTextContent();
          txt+=`\n[עמוד ${pn}]\n`+tc.items.map(x=>x.str+(x.hasEOL?'\n':' ')).join('');
          if(imgCaps&&images.length<Math.min(maxImg,8)){
            const vp=page.getViewport({scale:1});const sc=Math.min(2,1600/vp.width);const v2=page.getViewport({scale:sc});
            const cv=document.createElement('canvas');cv.width=v2.width;cv.height=v2.height;
            await page.render({canvasContext:cv.getContext('2d'),viewport:v2}).promise;
            images.push(await new Promise(r=>cv.toBlob(r,'image/jpeg',.8)));
          }
        }
        texts.push(`קובץ PDF: ${f.name}\n${txt.slice(0,60000)}`);
      }else{
        texts.push(`קובץ: ${f.name}\n${(await f.text()).slice(0,60000)}`);
      }
    }
    if(sig.aborted)return;
    const src=(texts.length?`\nText extracted from the files (for PDFs, Hebrew text order may be scrambled; when page images are provided, trust the images):\n<<<\n${texts.join('\n\n')}\n>>>\n`:'')+(images.length?`\nThe attached ${images.length} image(s) are photos/pages of the student's study material, in order.\n`:'');
    if(upDraft.mode==='copy'){
      setSheet(`<h2>📝 מעתיק את מה שכתוב…</h2><div class="preview" id="up-live">…</div><div class="sheet-foot"><button class="ghost" data-act="modal-close">עצור</button></div>`);
      const prompt=`Transcribe the study material below EXACTLY as written, for a student's notebook (course: ${c?c.name:''}).
${src}
Rules:
- Do NOT summarize, shorten, translate or add anything. Keep the original language and wording.
- Keep the structure: headings on their own line ending with ":", bullet points as lines starting with "- ", paragraphs as plain lines.
- Ignore page numbers, headers/footers and decorations. Write [לא ברור] for words you cannot read.
- For drawings, diagrams, charts or sketches, write a short Hebrew description in its place, in the form [תרשים: ...].
- Output format: the FIRST line is a short Hebrew title for this material (3-7 words). Then one empty line. Then the full transcription. Nothing else.`;
      const r=await sampleFn(prompt,{signal:sig,images:images.length?images:undefined,modelTier:'default',onText:({text})=>{const el=$('#up-live');if(el)el.textContent=text}});
      aiCtl=null;
      const txt=(r.text||'').trim();const nl=txt.indexOf('\n');
      upResult={topic:(nl>0?txt.slice(0,nl):'').replace(/^[#*\s]+|[*\s]+$/g,'').slice(0,80),notes:(nl>0?txt.slice(nl+1):txt).trim(),terms:[],key:'',truncated:r.truncated,keep,names};
    }else{
      const learn=upDraft.mode==='learn';
      setSheet(thinkingHtml(learn?'Claude בונה לך הסבר מאפס, צעד אחר צעד… (זה יכול לקחת דקה)':'Claude מסכם את החומר…'));
      const prompt=learn?`You are a patient, friendly tutor. A Hebrew-speaking university student with learning and memory difficulties MISSED this lecture (course: ${c?c.name:''}). All they have is the material below (photos of slides, slide PDFs or notes). Teach the lesson to them from zero, in simple Hebrew, as if they have no background.
${src}
Return ONLY a JSON object, no other text: {"topic": string, "notes": string, "terms": [{"t": string, "d": string}], "key": string}
- "topic": a short title (3-7 words).
${PLAIN}
${NOTESFMT}
- "notes": a full teaching explanation made of short lines. Section headers are short lines ending with ":"; content lines start with "- ". Use this order: a section "מה צריך לדעת לפני:" with 1-3 basic background ideas; then one section per main idea of the slides, in the slides' order, each explained step by step in short simple sentences and with a concrete everyday example (a line starting "- דוגמה:"); then "איך הכול מתחבר:" (2-3 lines); then "סיכום קצר:" (3-5 lines). Explain every concept, formula, chart or number that appears on the slides. You may add short general explanations needed to understand the slides, but do not add new topics. If part of the material is unreadable, say so in one line.
- "terms": up to 12 important terms with short, simple explanations.
- "key": one simple sentence with the single most important idea.`:`You help a Hebrew-speaking university student with learning and memory difficulties. Summarize the study material below into a clear, well-organized lesson summary in simple Hebrew (course: ${c?c.name:''}).
${src}
Return ONLY a JSON object, no other text: {"topic": string, "notes": string, "terms": [{"t": string, "d": string}], "key": string}
- "topic": a short title (3-7 words).
${PLAIN}
${NOTESFMT}
- "notes": the summary as short lines; bullets start with "- "; short section headers end with ":". Keep all the important ideas, examples and numbers. Do not invent facts. Describe important drawings, diagrams, charts and sketches in words (start such a line with "- תרשים:") and explain what they show.
- "terms": up to 10 important terms from the material with short, simple explanations.
- "key": one simple sentence with the single most important idea.`;
      const r=await sampleFn.json(prompt,{signal:sig,images:images.length?images:undefined,modelTier:'default'});
      aiCtl=null;
      if(!r||typeof r.notes!=='string')throw{code:'invalid_json'};
      upResult={topic:String(r.topic||'').slice(0,80),notes:r.notes,terms:(Array.isArray(r.terms)?r.terms:[]).filter(x=>x&&x.t).slice(0,10).map(x=>({t:String(x.t),d:String(x.d||'')})),key:String(r.key||''),keep,names};
    }
    if(!modalOpen)return;

  }catch(e){
    aiCtl=null;if(e&&e.code==='cancelled')return;if(!modalOpen)return;

    setSheet(m[e&&e.code]?`<h2>העלאה</h2><p>${m[e.code]}</p><div class="sheet-foot"><button class="primary" data-act="modal-close">סגירה</button></div>`:aiErr(e));
  }
}
async function applyUpload(){

  if(lid){const l=S.lessons[lid];
    l.notesHtml=notesHtmlOf(l)+(r.topic?`<h2>${esc(r.topic)}</h2>`:'')+fmtNotes(r.notes);l.notes=htmlToText(l.notesHtml);
    const have=new Set((l.terms||[]).map(x=>(x.t||'').trim()));l.terms=(l.terms||[]).concat(r.terms.filter(x=>!have.has(x.t.trim())));

  }else{
    lid=newLesson(d.cid,d.date);Object.assign(S.lessons[lid],{topic:r.topic,notes:r.notes,notesHtml:fmtNotes(r.notes),terms:r.terms,key:r.key,source:d.mode==='learn'?'learn':'upload'});
  }

  {const cc=courseById(S.lessons[lid].courseId);toast(`נשמר ב${cc?cc.name:'קורס'}, שיעור ${lessonNo(lid)}`)}

async function exportCourse(cid){
  const c=courseById(cid),ls=lessonsOf(cid).filter(l=>!isEmptyLesson(l));
  let md=`# ${c.name}\n${c.teacher?c.teacher+'\n':''}\n`;
  ls.forEach((l,i)=>{
    md+=`## שיעור ${i+1}, ${shortDate(l.date)}${l.topic?': '+l.topic:''}\n\n`;
    if(l.key)md+=`**הנקודה:** ${l.key}\n\n`;
    if(l.notes)md+=l.notes+'\n\n';
    const tm=(l.terms||[]).filter(x=>x.t);if(tm.length)md+='**מושגים**\n'+tm.map(x=>`- ${x.t}: ${x.d||''}`).join('\n')+'\n\n';
    const q=(l.questions||[]).filter(x=>x.t);if(q.length)md+='**שאלות**\n'+q.map(x=>`- ${x.t}${x.done?' (נענתה)':''}`).join('\n')+'\n\n';
  });

function startPractice(cid,lid){
  const ls=lessonsOf(cid);const src=lid?ls.filter(l=>l.id===lid):ls;

  for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]]}

}

    case 'lsn-start':{const s=$('#lsn-lesson');if(s)LSN.lid=s.value;plStart();break}
    case 'lsn-stop':plStop();break;
    case 'pl-toggle':PL.playing?plPause():plResume();break;
    case 'pl-next':plChapter(1);break;
    case 'pl-chapter':plChapter(0);break;
    case 'pl-again':explainAgain();break;
    case 'pl-prev':plChapter(-1);break;
    case 'pl-back':plJump(0,-1);break;
    case 'set-rate-pl':pref('rate',b.dataset.v);document.querySelectorAll('[data-act=set-rate-pl]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===b.dataset.v));if(PL.playing){plPause();plResume()}break;
    case 'exam-setup':exam=null;setOrOpen(examSetupHtml(id));break;
    case 'exam-start':examStart(id,+b.dataset.n);break;
    case 'exam-pick':if(exam&&!exam.done){exam.ans[exam.i]=+b.dataset.o;markActive();setSheet(examHtml())}break;
    case 'exam-go':if(exam&&!exam.done){exam.i=+b.dataset.k;setSheet(examHtml());$('#sheet').scrollTop=0}break;
    case 'exam-submit':examSubmit(false);break;
    case 'weak':openModal(weakHtml(id));break;
    case 'weak-open':modalOpen=false;$('#modal').classList.remove('open');go('read',id);break;
    case 'mindmap':mindMap(id,false);break;
    case 'mindmap-new':mindMap(id,true);break;
    case 'cards':if(sampleFn)lessonCards(id);break;
    case 'fey':openModal(feyHtml(id,''));break;
    case 'fey-again':setSheet(feyHtml(id,b.dataset.t));break;
    case 'fey-check':feyCheck(id);break;
    case 'weekly':openModal(weeklyHtml());break;
    case 'weekly-ai':if(sampleFn)weeklyAi();break;
    case 'speak':{const l=S.lessons[view.id];if(l)speakLesson(l);break}
    case 'live':liveItems=[];go('live',id);setTimeout(()=>$('#live-in')&&$('#live-in').focus(),50);break;
    case 'live-course':{const ex=lessonsOf(id).find(l=>l.date===todayKey());liveItems=[];go('live',ex?ex.id:newLesson(id));setTimeout(()=>$('#live-in')&&$('#live-in').focus(),50);break}
    case 'live-add':liveAdd(b.dataset.k);break;
    case 'live-done':go('lesson',id);break;
    case 'set-easy':pref('easy',b.dataset.v);applyPrefs();setSheet(settingsHtml());break;
    case 'set-rate':pref('rate',b.dataset.v);setSheet(settingsHtml());break;
    case 'voice-test':sampleVoice();break;
    case 'copy-link-msg':{const ta=$('#link-msg');let ok=false;try{ta.select();ok=document.execCommand('copy')}catch(e){}
      if(!ok&&navigator.clipboard){navigator.clipboard.writeText(ta.value).then(()=>{$('#copy-ok').textContent='הועתק. עכשיו מדביקים בצ׳אט עם Claude.'}).catch(()=>{$('#copy-ok').textContent='סמן את הטקסט והעתק ידנית.'})}
      else $('#copy-ok').textContent=ok?'הועתק. עכשיו מדביקים בצ׳אט עם Claude.':'סמן את הטקסט והעתק ידנית.';break}
    case 'bgm':{const on=pref('bgm')!=='1';pref('bgm',on?'1':'0');if(on&&PL.playing)bgmStart();else bgmStop();b.setAttribute('aria-pressed',on);b.innerHTML=iconize(on?'🎵 מוזיקה ברקע: פועלת':'🎵 מוזיקה ברקע');break}
    case 'set-goal':S.profile.goal=+b.dataset.v;saveDoc('profile',0);setSheet(settingsHtml());break;
    case 'backup':downloadBackup();break;
    case 'ex-add':{const l=S.lessons[view.id];if(l){l.terms=l.terms||[];l.terms.push({t:b.dataset.t,d:b.dataset.d});saveDoc(view.id,0)}closeModal();break}
    case 'ask':openChat(id);break;
    case 'chat-send':chatSend($('#chat-q').value);break;
    case 'chat-chip':chatSend(b.dataset.q);break;
    case 'timer':openModal(timerHtml());break;
    case 'timer-start':timerStart(+b.dataset.m);setSheet(timerHtml());break;
    case 'timer-break':timerStart(5,'break');setSheet(timerHtml());break;
    case 'timer-pause':if(timer){if(timer.paused){timer.end=Date.now()+timer.left*1000;timer.paused=false}else{timer.left=timerLeft();timer.paused=true}timerUpdate();setSheet(timerHtml())}break;
    case 'timer-stop':timer=null;timerUpdate();setSheet(timerHtml());break;
    case 'plan':openPlan(id);break;
    case 'plan-apply':applyPlan();break;
    case 'read-all':readStarOnly=false;go('readall',id);break;
    case 'read-filter':readStarOnly=b.dataset.v==='1';render();break;
    case 'edit-lesson':go('lesson',id);break;
    case 'star':{const l=S.lessons[view.id];if(l){l.star=!l.star;saveDoc(view.id,0);render()}break}
    case 'upload':openUpload(id);break;
    case 'upload-missed':{const l=S.lessons[id];if(l)openUpload(l.courseId,id,'learn');break}
    case 'up-mode':upDraft.mode=b.dataset.v;document.querySelectorAll('[data-act=up-mode]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===upDraft.mode));break;
    case 'up-start':runUpload();break;
    case 'up-apply':applyUpload();break;
    case 'mc-pick':mcPick(+b.dataset.o);break;
    case 'mc-next':quiz.i++;quiz.pick=null;setSheet(mcHtml());$('#sheet').scrollTop=0;break;
    case 'review':startReview();break;
    case 'onb-done':finishOnboarding();closeModal();break;
    case 'onb-add-course':formDraft={id:null,name:'',teacher:'',color:PALETTE[S.courses.length%PALETTE.length],sessions:[{day:0,start:'10:00',end:'11:30',room:''}],archived:false,fromWizard:true};setSheet(courseFormHtml());$('#sheet input[type=text]').focus();break;
    case 'ai-apply':aiApply();break;
    case 'add-task-lesson':{if(addTask($('#lt-title').value,$('#lt-due').value,L.courseId,view.id,$('#lt-kind').value)){render();$('#lt-title').focus()}break}
    case 'add-task-course':{if(addTask($('#ct-title').value,$('#ct-due').value,id,'',$('#ct-kind').value)){render();$('#ct-title').focus()}break}
    case 'add-task':{const c=$('#t-course').value,k=$('#t-kind').value;if(addTask($('#t-title').value,$('#t-due').value,c,'',k)){render();$('#t-course').value=c;$('#t-kind').value=k;$('#t-title').focus()}break}
    case 'del-task':S.tasks=S.tasks.filter(t=>t.id!==id);saveDoc('tasks',0);render();break;
    case 'task-form':taskFormOpen=b.dataset.v==='1';render();if(taskFormOpen)$('#t-title').focus();break;
    case 'course-mode':courseMode=b.dataset.m;render();break;
    case 'new-course':formDraft={id:null,name:'',teacher:'',color:PALETTE[S.courses.length%PALETTE.length],sessions:[{day:0,start:'10:00',end:'11:30',room:''}],archived:false};openModal(courseFormHtml());break;
    case 'edit-course':formDraft=clone(courseById(id));formDraft.sessions=formDraft.sessions||[];openModal(courseFormHtml());break;
    case 'pick-color':formDraft.color=b.dataset.c;setSheet(courseFormHtml());break;
    case 'add-session':{const last=formDraft.sessions[formDraft.sessions.length-1];formDraft.sessions.push(last?{...last}:{day:0,start:'10:00',end:'11:30',room:''});setSheet(courseFormHtml());break}
    case 'rm-session':formDraft.sessions.splice(+b.dataset.i,1);setSheet(courseFormHtml());break;
    case 'save-course':{const d=formDraft;d.name=(d.name||'').trim();
      if(!d.name){$('#cf-err').textContent='צריך לכתוב שם לקורס.';return}
      d.sessions=d.sessions.map(s=>({...s,day:+s.day}));
      const fw=d.fromWizard;delete d.fromWizard;
      if(!d.id){d.id=uid();S.courses.push(d)}else{const i=S.courses.findIndex(c=>c.id===d.id);S.courses[i]=d}
      saveDoc('courses',0);formDraft=null;
      if(fw){setSheet(onbHtml());break}modalOpen=false;$('#modal').classList.remove('open');go('course',d.id);break}
    case 'del-course':{const d=formDraft;if(!confirm(`למחוק את “${d.name}” ואת כל הסיכומים שלו? אי אפשר לבטל.\nאם הקורס רק הסתיים, עדיף לסמן “הקורס הסתיים”.`))return;
      lessonsOf(d.id).forEach(l=>removeDoc(l.id));S.courses=S.courses.filter(c=>c.id!==d.id);S.tasks=S.tasks.filter(t=>t.courseId!==d.id);
      saveDoc('courses',0);saveDoc('tasks',0);formDraft=null;modalOpen=false;$('#modal').classList.remove('open');go('courses');break}
    case 'modal-close':if(exam&&!exam.done&&!confirm('לצאת מהמבחן? התשובות לא יישמרו.'))break;if(formDraft&&formDraft.fromWizard){formDraft=null;setSheet(onbHtml());break}closeModal();break;
    case 'practice':startPractice(id);if(modalOpen)setSheet(practiceHtml());else openModal(practiceHtml());break;
    case 'flip':practice.flip=true;setSheet(practiceHtml());break;
    case 'card-yes':markActive();practice.known++;practice.i++;practice.flip=false;setSheet(practiceHtml());break;
    case 'card-no':practice.cards.push(practice.cards[practice.i]);practice.i++;practice.flip=false;
      if(practice.cards.length>practice.total*3)practice.cards.length=practice.i;setSheet(practiceHtml());break;
    case 'export':exportCourse(id);break;
    case 'settings':openModal(settingsHtml());break;
    case 'set-size':pref('size',b.dataset.v);applyPrefs();setSheet(settingsHtml());break;
    case 'set-theme':pref('theme',b.dataset.v);applyPrefs();setSheet(settingsHtml());break;
    case 'show-onb':wizard=true;onbStep=0;setSheet(onbHtml());break;
    case 'onb-next':onbStep++;setSheet(onbHtml());break;
  }
});
function onField(e){
  const el=e.target;
  if(el.tagName==='TEXTAREA')grow(el);
  if(el.id==='search-q'){lastQ=el.value;$('#search-res').innerHTML=searchResults(lastQ);return}
  if(el.dataset.pf){S.profile[el.dataset.pf]=el.value;saveDoc('profile');return}
  if(el.dataset.cf&&formDraft){formDraft[el.dataset.cf]=el.type==='checkbox'?el.checked:el.value;return}
  if(el.dataset.s!=null&&formDraft){formDraft.sessions[+el.dataset.s][el.dataset.k]=el.value;return}
  if(el.id==='f-rich'){const l=S.lessons[view.id];if(!l)return;markActive();l.notesHtml=sanitize(el.innerHTML);l.notes=htmlToText(l.notesHtml);if(!l.notes)l.notesHtml='';saveDoc(view.id);return}
  if(view.name==='lesson'&&el.closest('.editor')){
    const l=S.lessons[view.id];if(!l)return;
    if(el.dataset.f){l[el.dataset.f]=el.value;saveDoc(view.id)}
    else if(el.dataset.l){const it=l[el.dataset.l][+el.dataset.i];if(!it)return;
      it[el.dataset.k]=el.type==='checkbox'?el.checked:el.value;
      if(el.type==='checkbox')el.closest('.row').classList.toggle('answered',el.checked);
      saveDoc(view.id)}
  }
}
document.addEventListener('input',onField);
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='restore-file'&&el.files[0]){
    el.files[0].text().then(t=>{let j;try{j=JSON.parse(t)}catch(_){}
      const msg=$('#restore-msg');
      if(!j||j.app!=='nekuda'||!j.docs){if(msg)msg.textContent='זה לא קובץ גיבוי של מרקר.';return}
      if(!confirm('לשחזר מהגיבוי? קורסים ומשימות יוחלפו בגרסה מהגיבוי, וסיכומים מהגיבוי יתווספו.'))return;
      restoreDocs(j.docs);if(msg)msg.textContent='שוחזר בהצלחה.';
    });return}
  if(el.id==='img-in'&&el.files.length){insertImages([...el.files]);return}
  if(el.id==='voice-sel'){pref('voice',el.value);sampleVoice();return}
  if(el.id==='lsn-course'){LSN.cid=el.value;LSN.lid=null;render();return}
  if(el.id==='lsn-lesson'){LSN.lid=el.value;return}
  if(el.id==='up-course'){$('#up-target').innerHTML=upTargets(el.value,'new');$('#up-date-wrap').hidden=false;return}
  if(el.id==='up-target'){$('#up-date-wrap').hidden=el.value!=='new';return}
  if(el.id==='up-files'){$('#up-list').textContent=[...el.files].map(f=>f.name).join(', ');return}
  if(el.type==='checkbox'&&el.closest('.editor')&&el.dataset.l){onField(e);return}
  if(el.dataset.chg==='task'){const t=S.tasks.find(x=>x.id===el.dataset.id);if(t){t.done=el.checked;saveDoc('tasks',0);if(view.name!=='lesson')setTimeout(render,250);else el.closest('.task').classList.toggle('done',el.checked)}}
  if(el.dataset.chg==='q'){const l=S.lessons[el.dataset.lid];if(l&&l.questions[+el.dataset.qi]){l.questions[+el.dataset.qi].done=el.checked;saveDoc(el.dataset.lid,0);setTimeout(render,250)}}
});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&(e.key==='k'||e.key==='ל')){e.preventDefault();if(modalOpen)closeModal();go('search');setTimeout(()=>$('#search-q')&&$('#search-q').focus(),30);return}
  if((e.metaKey||e.ctrlKey)&&e.key==='Enter'&&view.name==='lesson'){e.preventDefault();const b=$('[data-act=done-lesson]');b&&b.click();return}
  if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='live-in'&&!e.isComposing){e.preventDefault();liveAdd('n');return}
  if(e.key==='Escape'&&D.open){drawAct('close');return}
  if(e.key==='Escape'&&modalOpen)closeModal();
  if(e.key==='Enter'&&e.target.tagName==='INPUT'){
    if(e.target.id==='onb-name'){e.preventDefault();$('[data-act=onb-next]').click();return}
    if(e.target.id==='chat-q'){e.preventDefault();chatSend(e.target.value);return}
    const m={'lt-title':'add-task-lesson','ct-title':'add-task-course','t-title':'add-task'}[e.target.id];
    if(m){e.preventDefault();document.querySelector(`[data-act="${m}"]`).click()}
  }
});
function grow(el){el.style.height='auto';el.style.height=(el.scrollHeight+4)+'px'}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushAll()});
window.addEventListener('pagehide',()=>flushAll());
setInterval(()=>{if(view.name==='home'&&!modalOpen&&loaded&&document.visibilityState==='visible'&&!document.activeElement.matches('input,textarea,select'))render()},60000);

/* ---------- start ---------- */
applyPrefs();
document.querySelectorAll('#nav button').forEach(b=>{b.innerHTML=ic({home:'home',courses:'book',tasks:'check',search:'search'}[b.dataset.to])+'<span>'+b.textContent+'</span>'});
document.querySelector('[data-act=settings]').innerHTML=ic('sliders');
function setHdr(){const t=document.querySelector('.top');if(t)document.documentElement.style.setProperty('--hdr',t.querySelector('.top-in').offsetHeight+(getComputedStyle($('#nav')).position==='fixed'?0:$('#nav').offsetHeight)+'px')}
window.addEventListener('resize',setHdr);setHdr();
(async function init(){
  render();
  let db=null,id=null;
  try{
    if(window.claude&&typeof claude.use==='function'){
      const [d,u,s,dl,as]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('sample'),claude.use('downloads'),claude.use('assets')]);
      db=d;window.__dbRaw=d;id=u?await u.id():null;sampleFn=s||null;downloadsNs=dl||null;assetsNs=as||null;
      let canW=null;if(u&&typeof u.can==='function'){try{canW=await u.can('data.write');if(canW===false)db=null}catch(e){}}
      if(db&&pref('forceLocal')==='1')db=null;
      if(db&&id&&canW!==true){
        try{await Promise.race([db.collection('data/users/'+id).doc('ping').set({t:Date.now()}),new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),5000))])}
        catch(e){if(e&&(e.code==='invalid_argument'||e.code==='not_granted'||e.code==='revoked'||e.code==='capability_disabled')){db=null;pref('forceLocal','1')}}
      }
      if(sampleFn){try{const lim=await sampleFn.limits();imgCaps=lim&&lim.images?lim.images:null}catch(e){imgCaps=null}}
    }
  }catch(e){}
  if(db&&id){try{store=makeDbStore(db.collection('data/users/'+id))}catch(e){store=null}}
  if(!store)store=makeLocalStore();
  if(window.__dbRaw){try{const sn=await window.__dbRaw.doc('public/template').get();if(sn&&sn.exists){const t=sn.data();if(t&&Array.isArray(t.courses)&&t.courses.length){TEMPLATE=clone(t);if(modalOpen&&wizard)setSheet(onbHtml());else if(loaded&&view.name==='home')render()}}}catch(e){}}
  store.subscribe(applyDocs,()=>{statusErr=true;updateStatus()});
})();
</script>
</body>
