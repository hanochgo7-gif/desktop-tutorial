<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">

  <link rel="canonical" href="https://gotovski.co.il/services/data-center-360.html">

  <meta property="og:url" content="https://gotovski.co.il/services/data-center-360.html">

  <style>

:root{
  --onyx:#0f0e12; --carbon:#322d2a; --paper:#eeece7; --muted:#9ea3ab;
  --accent:#1c82ad; --accent-2:#4fbbea; --glass:rgba(15,14,18,.62); --line:rgba(255,255,255,.14);
  --display:"Heebo",system-ui,"Segoe UI",Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--onyx);color:var(--paper);font-family:var(--display);overflow:hidden}
#pano{position:absolute;inset:0}
.ui{direction:rtl;position:absolute;z-index:5;display:flex;gap:10px;align-items:center}
.top{top:calc(14px + env(safe-area-inset-top,0px));inset-inline:16px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.card{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:12px 16px;max-width:min(420px,100%)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.18em;color:var(--accent-2)}
h1{margin:4px 0 2px;font-size:clamp(20px,3.2vw,28px);font-weight:700;line-height:1.1;text-wrap:balance}
.meta{font-size:13px;color:var(--muted);line-height:1.5}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;padding:4px 9px;border-radius:999px;background:#f2d27a;color:var(--onyx)}
.tools{display:flex;gap:8px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--glass);border:1px solid var(--line);color:var(--paper);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.btn:hover{background:rgba(28,130,173,.55)}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bottom{bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline:16px;justify-content:space-between;align-items:flex-end;gap:16px}
@media (max-width:720px){.bottom{flex-direction:column;align-items:stretch}.bottom .scenes{flex:none}.bottom>div:last-child{justify-items:start!important}}
.scenes{display:flex;gap:8px;overflow-x:auto;flex:1 1 0;min-width:0;padding-bottom:2px}
.scene{all:unset;cursor:pointer;flex:none;display:flex;gap:10px;align-items:center;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:6px 12px 6px 6px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:14px;font-weight:500}
.scene img{width:64px;height:40px;object-fit:cover;border-radius:8px;display:block}
.scene[aria-current="true"]{border-color:var(--accent-2);box-shadow:0 0 0 1px var(--accent-2) inset}
.scene:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.hint{font-size:13px;color:var(--paper);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:8px 14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:opacity .6s}
.hint.gone{opacity:0}
.note{font-size:11px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.hint{transition:none}}
@media (max-width:520px){.card{padding:10px 12px}.scene span{display:none}.scene{padding:6px}}
/* Pannellum 2.5.6, https://github.com/mpetroff/pannellum */
.pnlm-panorama-info{position:absolute;bottom:4px;background-color:rgba(0,0,0,0.7);border-radius:0 3px 3px 0;padding-right:10px;color:#fff;text-align:left;display:none;z-index:2;-webkit-transform:translateZ(9999px);transform:translateZ(9999px)}.pnlm-title-box{position:relative;font-size:20px;display:table;padding-left:5px;margin-bottom:3px}.pnlm-author-box{position:relative;font-size:12px;display:table;padding-left:5px}.pnlm-load-box{position:absolute;top:50%;left:50%;width:200px;height:150px;margin:-75px 0 0 -100px;background-color:rgba(0,0,0,0.7);border-radius:3px;text-align:center;font-size:20px;display:none;color:#fff}.pnlm-load-box p{margin:20px 0}.pnlm-lbox{position:absolute;top:50%;left:50%;width:20px;height:20px;margin:-10px 0 0 -10px;display:none}.pnlm-loading{animation-duration:1.5s;-webkit-animation-duration:1.5s;animation-name:pnlm-mv;-webkit-animation-name:pnlm-mv;animation-iteration-count:infinite;-webkit-animation-iteration-count:infinite;animation-timing-function:linear;-webkit-animation-timing-function:linear;height:10px;width:10px;background-color:#fff;position:relative}@keyframes pnlm-mv{from{left:0;top:0}25%{left:10px;top:0}50%{left:10px;top:10px}75%{left:0;top:10px}to{left:0;top:0}}@-webkit-keyframes pnlm-mv{from{left:0;top:0}25%{left:10px;top:0}50%{left:10px;top:10px}75%{left:0;top:10px}to{left:0;top:0}}.pnlm-load-button{position:absolute;top:50%;left:50%;width:200px;height:100px;margin:-50px 0 0 -100px;background-color:rgba(0,0,0,.7);border-radius:3px;text-align:center;font-size:20px;display:table;color:#fff;cursor:pointer}.pnlm-load-button:hover{background-color:rgba(0,0,0,.8)}.pnlm-load-button p{display:table-cell;vertical-align:middle}.pnlm-info-box{font-size:15px;position:absolute;top:50%;left:50%;width:200px;height:150px;margin:-75px 0 0 -100px;background-color:#000;border-radius:3px;display:table;text-align:center;color:#fff;table-layout:fixed}.pnlm-info-box a,.pnlm-author-box a{color:#fff;word-wrap:break-word;overflow-wrap:break-word}.pnlm-info-box p{display:table-cell;vertical-align:middle;padding:0 5px 0 5px}.pnlm-error-msg{display:none}.pnlm-about-msg{font-size:11px;line-height:11px;color:#fff;padding:5px 8px 5px 8px;background:rgba(0,0,0,0.7);border-radius:3px;position:absolute;top:50px;left:50px;display:none;opacity:0;-moz-transition:opacity .3s ease-in-out;-webkit-transition:opacity .3s ease-in-out;-o-transition:opacity .3s ease-in-out;-ms-transition:opacity .3s ease-in-out;transition:opacity .3s ease-in-out;z-index:1}.pnlm-about-msg a:link,.pnlm-about-msg a:visited{color:#fff}.pnlm-about-msg a:hover,.pnlm-about-msg a:active{color:#eee}.pnlm-hotspot-base{position:absolute;visibility:hidden;cursor:default;vertical-align:middle;top:0;z-index:1}.pnlm-hotspot{height:26px;width:26px;border-radius:13px}.pnlm-hotspot:hover{background-color:rgba(255,255,255,0.2)}.pnlm-hotspot.pnlm-info{background-position:0 -104px}.pnlm-hotspot.pnlm-scene{background-position:0 -130px}div.pnlm-tooltip span{visibility:hidden;position:absolute;border-radius:3px;background-color:rgba(0,0,0,0.7);color:#fff;text-align:center;max-width:200px;padding:5px 10px;margin-left:-220px;cursor:default}div.pnlm-tooltip:hover span{visibility:visible}div.pnlm-tooltip:hover span:after{content:'';position:absolute;width:0;height:0;border-width:10px;border-style:solid;border-color:rgba(0,0,0,0.7) transparent transparent transparent;bottom:-20px;left:-10px;margin:0 50%}.pnlm-compass{position:absolute;width:50px;height:50px;right:4px;bottom:4px;border-radius:25px;background-image:url('data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20height%3D%2250%22%20width%3D%2250%22%3E%0A%3Cpath%20d%3D%22m24.5078%206-3.2578%2018h7.5l-3.25781-18h-0.984376zm-3.2578%2020%203.2578%2018h0.9844l3.2578-18h-7.5zm1.19531%200.9941h5.10938l-2.5547%2014.1075-2.5547-14.1075z%22%2F%3E%0A%3C%2Fsvg%3E%0A');cursor:default;display:none}.pnlm-world{position:absolute;left:50%;top:50%}.pnlm-face{position:absolute;-webkit-transform-origin:0 0;transform-origin:0 0}.pnlm-dragfix,.pnlm-preview-img{position:absolute;height:100%;width:100%}.pnlm-preview-img{background-size:cover;background-position:center}.pnlm-lbar{width:150px;margin:0 auto;border:#fff 1px solid;height:6px}.pnlm-lbar-fill{background:#fff;height:100%;width:0}.pnlm-lmsg{font-size:12px}.pnlm-fade-img{position:absolute;top:0;left:0}.pnlm-pointer{cursor:pointer}
.pnlm-panorama-info,.pnlm-about-msg{display:none!important}
.hs{width:0;height:0;cursor:pointer}
.hs .dot{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;background:rgba(15,14,18,.55);border:2px solid var(--paper);display:grid;place-items:center;box-shadow:0 0 0 6px rgba(79,187,234,.25);transition:transform .25s}
.hs .dot svg{width:20px;height:20px;fill:none;stroke:var(--paper);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hs:hover .dot{transform:scale(1.12);background:var(--accent)}
.hs .lbl{position:absolute;top:30px;left:50%;transform:translateX(-50%);white-space:nowrap;direction:rtl;font:700 13px/1 var(--display);color:var(--paper);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:7px 12px}
.mapbox{top:calc(76px + env(safe-area-inset-top,0px));left:16px}
.map{position:relative;width:220px;max-width:42vw;padding:8px}
.map svg{display:block;width:100%;height:auto}
.map .pt{cursor:pointer}
.map .pt circle{fill:var(--onyx);stroke:var(--paper);stroke-width:2}
.map .pt.on circle{fill:var(--accent-2);stroke:var(--accent-2)}
.map .pt:focus-visible circle{stroke:#f2d27a;stroke-width:3}
.map .fov{fill:rgba(79,187,234,.35)}
@media (max-width:520px){.map{display:none}}
.pnlm-load-box{background:var(--glass);border-radius:14px;font-family:var(--display)}
.pnlm-load-box p{font-family:var(--display)}

.back{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:12px;background:var(--glass);border:1px solid var(--line);color:var(--paper);font:500 14px/1 var(--display);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);text-decoration:none}
.back:hover{background:rgba(28,130,173,.55)}
.back:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.back svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:520px){.back span{display:none}.back{width:44px;padding:0;justify-content:center}}

<body>
<div id="pano" role="img" aria-label="תמונת 360 מעלות של חצר גנרטורים בחוות שרתים: שורות גנרטורים דיזל במכולות משני צדי כביש שירות, צנרת דלק צהובה, גדר ביטחון ומבנה חוות השרתים בקצה"></div>
<div class="ui top">
  <div class="card">
    <div class="eyebrow">ש.גוטובסקי · תשתיות דלק לחוות שרתים</div>
    <h1 id="scene-title">חצר הגנרטורים</h1>
    <div class="meta"><span id="scene-desc">גנרטורי גיבוי במכולות, צנרת אספקה והחזרה לכל יחידה, ומבנה החווה בקצה הכביש.</span> <span class="badge">הדמיה · טיוטה</span></div>
  </div>
  <div class="tools">
    <a class="back" href="data-center.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg><span>חזרה לחוות שרתים</span></a>
    <button class="btn" id="rotate" type="button" aria-pressed="true" aria-label="סיבוב אוטומטי"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg></button>
    <button class="btn" id="full" type="button" aria-label="מסך מלא"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
</div>
<div class="ui mapbox">
    <div class="card map" aria-label="תוכנית האתר">
      <svg viewBox="0 0 220 150" role="group" aria-label="תוכנית האתר: לחצו על נקודה כדי לעבור אליה">
        <rect x="6" y="6" width="208" height="138" rx="6" fill="none" stroke="rgba(255,255,255,.35)" stroke-dasharray="4 3"/>
        <rect x="70" y="14" width="80" height="26" rx="2" fill="rgba(255,255,255,.14)"/><text x="110" y="31" text-anchor="middle" fill="#9ea3ab" font-size="9" font-family="Heebo">מבנה החווה</text>
        <g fill="rgba(255,255,255,.22)"><rect x="40" y="52" width="40" height="8"/><rect x="40" y="66" width="40" height="8"/><rect x="40" y="80" width="40" height="8"/><rect x="140" y="52" width="40" height="8"/><rect x="140" y="66" width="40" height="8"/><rect x="140" y="80" width="40" height="8"/></g>
        <rect x="20" y="104" width="72" height="32" rx="2" fill="none" stroke="rgba(255,255,255,.3)"/><text x="56" y="132" text-anchor="middle" fill="#9ea3ab" font-size="8" font-family="Heebo">מכלים</text>
        <rect x="150" y="104" width="34" height="24" rx="2" fill="rgba(255,255,255,.14)"/>
        <path id="fov" class="fov" d=""/>
        <g id="pts"></g>
      </svg>
    </div>
</div>
<div class="ui bottom">
  <div class="scenes" id="scenes" role="list" aria-label="נקודות בסיור"></div>
  <div style="display:grid;gap:8px;justify-items:end">
    <div class="hint" id="hint">גררו כדי להסתכל מסביב · לחצו על החצים כדי לעבור</div>
    <div class="note">הדמיה ממוחשבת להמחשה בלבד, אינה פרויקט קיים.</div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pannellum/2.5.6/pannellum.js"></script>
<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // x,y: position on the site plan; north: plan heading (degrees) of the panorama's yaw 0
  const SCENES = {
    yard:   { title: 'חצר הגנרטורים', file: 'generator-yard', x: 110, y: 70, north: 0,
              desc: 'גנרטורי גיבוי במכולות, צנרת אספקה והחזרה לכל יחידה, ומבנה החווה בקצה הכביש.',
              links: [{ to: 'hall', yaw: 2, pitch: -3 }, { to: 'tanks', yaw: 160, pitch: -8 }] },
    tanks:  { title: 'חוות המכלים', file: 'tank-farm', x: 56, y: 98, north: 0,
              desc: 'מכלי סולר דו-דופניים במאצרת בטון, עם מדי מפלס, אוורור וצנרת יציאה אל מסד הצנרת.',
              links: [{ to: 'yard', yaw: -60, pitch: -6 }, { to: 'unload', yaw: 120, pitch: -8 }, { to: 'pumps', yaw: 175, pitch: -6 }] },
    unload: { title: 'עמדת פריקה למכליות', file: 'unloading-bay', x: 120, y: 132, north: 180,
              desc: 'נקודת מילוי מקורה עם מצמדים מהירים, מד ספיקה, סינון, הארקה ותעלת ניקוז לאיסוף דליפות.',
              links: [{ to: 'tanks', yaw: -15, pitch: -6 }, { to: 'yard', yaw: 80, pitch: -6 }, { to: 'pumps', yaw: -110, pitch: -8 }] },
    pumps:  { title: 'חדר המשאבות והסינון', file: 'pump-room', x: 167, y: 116, north: 270,
              desc: 'זוג משאבות העברה, מערכת ליטוש וסינון סולר, מגופים, אל-חוזרים ולוח בקרה עם גילוי דליפות.',
              links: [{ to: 'unload', yaw: 0, pitch: -8 }, { to: 'hall', yaw: 178, pitch: -6 }] },
    hall:   { title: 'אולם גנרטור', file: 'generator-hall', x: 110, y: 27, north: 0,
              desc: 'גנרטור דיזל 2.5 מגה-וואט עם מיכל יומי, צנרת אספקה והחזרה, ומשתיק פליטה.',
              links: [{ to: 'yard', yaw: -150, pitch: -6 }, { to: 'pumps', yaw: 150, pitch: -6 }] }
  };
  const order = ['yard', 'tanks', 'unload', 'pumps', 'hall'];
  const arrow = '<svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
  const tip = (div, args) => {
    div.classList.add('hs');
    div.innerHTML = '<span class="dot">' + arrow + '</span><span class="lbl"></span>';
    div.querySelector('.lbl').textContent = args.label;
    div.setAttribute('role', 'button'); div.setAttribute('aria-label', 'מעבר אל ' + args.label);
  };
  const scenes = {};
  for (const id of order) {
    const sc = SCENES[id];
    scenes[id] = {
      type: 'equirectangular', panorama: '../images/tour/' + sc.file + '.jpg', hfov: 100, minPitch: -75, maxPitch: 90,
      hotSpots: sc.links.map(l => ({ type: 'scene', sceneId: l.to, yaw: l.yaw, pitch: l.pitch, cssClass: 'hs-wrap', createTooltipFunc: tip, createTooltipArgs: { label: SCENES[l.to].title }, targetYaw: 'sameAzimuth' }))
    };
  }
  const viewer = pannellum.viewer('pano', {
    default: { firstScene: order[0], sceneFadeDuration: 900, autoLoad: true, autoRotate: reduced ? 0 : -1.6, autoRotateInactivityDelay: 8000, showControls: false, compass: false },
    scenes
  });
  // scene buttons
  const list = document.getElementById('scenes');
  for (const id of order) {
    const b = document.createElement('button');
    b.className = 'scene'; b.type = 'button'; b.setAttribute('role', 'listitem'); b.dataset.id = id;
    b.innerHTML = '<img alt="" src="../images/tour/thumb-' + SCENES[id].file + '.jpg"><span></span>';
    b.querySelector('span').textContent = SCENES[id].title;
    b.addEventListener('click', () => viewer.loadScene(id));
    list.appendChild(b);
  }
  // site plan points
  const NS = 'http://www.w3.org/2000/svg', pts = document.getElementById('pts');
  for (const id of order) {
    const g = document.createElementNS(NS, 'g'); g.setAttribute('class', 'pt'); g.dataset.id = id;
    g.setAttribute('tabindex', '0'); g.setAttribute('role', 'button'); g.setAttribute('aria-label', SCENES[id].title);
    const c = document.createElementNS(NS, 'circle'); c.setAttribute('cx', SCENES[id].x); c.setAttribute('cy', SCENES[id].y); c.setAttribute('r', 5.5);
    const t = document.createElementNS(NS, 'title'); t.textContent = SCENES[id].title;
    g.append(c, t); pts.appendChild(g);
    const go = () => viewer.loadScene(id);
    g.addEventListener('click', go);
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  }
  const fov = document.getElementById('fov');
  const drawFov = () => {
    const sc = SCENES[viewer.getScene()]; if (!sc) return;
    const h = (sc.north + viewer.getYaw()) * Math.PI / 180, half = (viewer.getHfov() / 2) * Math.PI / 180, r = 26;
    const p = a => (sc.x + r * Math.sin(a)).toFixed(1) + ' ' + (sc.y - r * Math.cos(a)).toFixed(1);
    fov.setAttribute('d', 'M' + sc.x + ' ' + sc.y + ' L' + p(h - half) + ' A' + r + ' ' + r + ' 0 0 1 ' + p(h + half) + ' Z');
    requestAnimationFrame(drawFov);
  };
  const mark = () => {
    const cur = viewer.getScene();
    list.querySelectorAll('.scene').forEach(b => b.setAttribute('aria-current', b.dataset.id === cur ? 'true' : 'false'));
    pts.querySelectorAll('.pt').forEach(g => g.classList.toggle('on', g.dataset.id === cur));
    document.getElementById('scene-title').textContent = SCENES[cur].title;
    document.getElementById('scene-desc').textContent = SCENES[cur].desc;
  };
  viewer.on('load', mark);
  viewer.on('scenechange', mark);
  requestAnimationFrame(drawFov);
  const hint = document.getElementById('hint');
  ['mousedown', 'touchstart'].forEach(ev => viewer.on(ev, () => hint.classList.add('gone')));
  const rot = document.getElementById('rotate');
  if (reduced) rot.setAttribute('aria-pressed', 'false');
  rot.addEventListener('click', () => {
    const on = rot.getAttribute('aria-pressed') !== 'true';
    rot.setAttribute('aria-pressed', on ? 'true' : 'false');
    on ? viewer.startAutoRotate(-1.6) : viewer.stopAutoRotate();
  });
  document.getElementById('full').addEventListener('click', () => { try { viewer.toggleFullscreen(); } catch (e) {} });
})();
</script>
