<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../assets/fonts/fonts.css"><title>B: Crop first</title>
<style>
:root{--forest:#0E4239;--canopy:#1B6E62;--mint:#7FC49B;--paper:#F2F5F3;--font:"Plex",Arial,sans-serif;--mono:"Plex Mono",monospace}
*{box-sizing:border-box}body{margin:0;font:400 17px/1.55 var(--font);color:#102722;background:var(--paper)}
.hero{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.l{padding:14vh 5vw 6vh}.r{position:relative;background:#0b2f29}.r img{width:100%;height:100%;object-fit:cover}
h1{font-size:clamp(2.6rem,5vw,4.6rem);line-height:1;letter-spacing:-.03em;color:var(--forest);margin:0 0 18px}
.q{font-size:1.3rem;color:#4B605B;margin:0 0 22px}
.crops{display:flex;flex-wrap:wrap;gap:10px}.crops button{font:600 1.05rem var(--font);padding:14px 18px;border:1.5px solid var(--forest);background:#fff;color:var(--forest);border-radius:999px}
.crops button.on{background:var(--forest);color:#fff}
.ans{margin-top:28px;border-top:2px solid var(--forest);padding-top:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ans b{display:block;font:600 1.6rem var(--font);color:var(--forest)}.ans span{font-size:.9rem;color:#4B605B}
.cta{margin-top:26px;display:inline-block;background:var(--canopy);color:#fff;padding:15px 22px;border-radius:4px;font-weight:600;text-decoration:none}
</style></head><body>
<section class="hero"><div class="l"><h1>Net houses, built for your crop.</h1><p class="q">What do you grow?</p>
<div class="crops"><button class="on">Bananas</button><button>Apples</button><button>Cherries</button><button>Kiwi</button><button>Avocado</button><button>Something else</button></div>
<div class="ans"><div><b>11% net</b><span>light and airy</span></div><div><b>up to 10 ha</b><span>in one structure</span></div><div><b>wind &amp; hail</b><span>in winter; less evaporation in summer</span></div></div>
<a class="cta" href="#">Discuss your banana project</a></div>
<div class="r"><img src="../assets/img/forest-1600.jpg" alt=""></div></section></body></html>
