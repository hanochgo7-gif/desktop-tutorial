    var dx = p.i === 0 ? -1 : p.i === NX - 1 ? 1 : 0, dz = p.k === 0 ? -1 : p.k === NZ - 1 ? 1 : 0;
    var top = new THREE.Vector3(p.x, H, p.z), gnd = new THREE.Vector3(p.x + dx * 2.2, 0, p.z + dz * 2.2);
    var dir = gnd.clone().sub(top), len = dir.length();
    var a = rod(len, .025, steelDark); a.position.copy(top);
    a.quaternion.setFromUnitVectors(new THREE.Vector3(1, 0, 0), dir.normalize()); scene.add(a); anchors.push(a);
    var blk = new THREE.Mesh(new THREE.BoxGeometry(.5, .2, .5), mat(0xB9B6AE)); blk.position.copy(gnd).setY(.1); blk.castShadow = true; scene.add(blk); anchorBlocks.push(blk);
  });

  // רשת: טקסטורת עין רשת לבנה
  function netTex(rep) {
    var c = document.createElement("canvas"); c.width = c.height = 64; var x = c.getContext("2d");
    x.fillStyle = "#FFFFFF"; x.fillRect(0, 0, 64, 64);
    x.strokeStyle = "rgba(150,165,160,.55)"; x.lineWidth = 2;
    for (var i = 0; i <= 64; i += 16) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, 64); x.stroke(); x.beginPath(); x.moveTo(0, i); x.lineTo(64, i); x.stroke(); }
    var t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); t.anisotropy = 4; return t;
  }
  var netM = new THREE.MeshLambertMaterial({ map: netTex([LX / 1.2, SZ / 1.2]), transparent: true, opacity: .74, side: THREE.DoubleSide, depthWrite: false });
  var roofs = [];
  for (var rz = 0; rz < NZ - 1; rz++) {
    var rg = new THREE.PlaneGeometry(LX, SZ); rg.rotateX(-Math.PI / 2); rg.translate(LX / 2, 0, SZ / 2);
    var r = new THREE.Mesh(rg, netM); r.position.set(X0, H + .02, Z0 + rz * SZ); r.receiveShadow = false; scene.add(r); roofs.push(r);
  }
  // דפנות: נתלות מלמעלה ויורדות
  var sideM = new THREE.MeshLambertMaterial({ map: netTex([LX / 1.2, H / 1.2]), transparent: true, opacity: .62, side: THREE.DoubleSide, depthWrite: false });
  var sideM2 = new THREE.MeshLambertMaterial({ map: netTex([LZ / 1.2, H / 1.2]), transparent: true, opacity: .62, side: THREE.DoubleSide, depthWrite: false });
  function wall(len, m) { var g = new THREE.PlaneGeometry(len, H); g.translate(0, -H / 2, 0); return new THREE.Mesh(g, m); }
  var walls = [];
  var w1 = wall(LX, sideM); w1.position.set(0, H, Z0); walls.push(w1);
  var w2 = wall(LX, sideM); w2.position.set(0, H, Z0 + LZ); walls.push(w2);
  var w3 = wall(LZ, sideM2); w3.rotation.y = Math.PI / 2; w3.position.set(X0, H, 0); walls.push(w3);
  var w4 = wall(LZ, sideM2); w4.rotation.y = Math.PI / 2; w4.position.set(X0 + LX, H, 0); walls.push(w4);
  walls.forEach(function (w) { scene.add(w); });
  // דלת בחזית: משקוף מגולוון
  var door = new THREE.Group();
  var dp1 = new THREE.Mesh(new THREE.BoxGeometry(.12, 2.6, .12), steel); dp1.position.set(-1.1, 1.3, 0);
  var dp2 = dp1.clone(); dp2.position.x = 1.1;
  var dl = new THREE.Mesh(new THREE.BoxGeometry(2.32, .12, .12), steel); dl.position.set(0, 2.6, 0);
  var dpanel = new THREE.Mesh(new THREE.PlaneGeometry(2.1, 2.5), new THREE.MeshLambertMaterial({ color: 0xE9EEEC, transparent: true, opacity: .85, side: THREE.DoubleSide }));
  dpanel.position.set(0, 1.27, .02);
  [dp1, dp2, dl].forEach(function (m) { m.castShadow = true; door.add(m); }); door.add(dpanel);
  door.position.set(X0 + SX * 3, 0, Z0 + LZ + .03); scene.add(door);

  // שלב 6: קווי השקיה ועצים
  var lanes = []; for (var lz = 0; lz < NZ - 1; lz++) lanes.push(Z0 + lz * SZ + SZ / 2);
  var drips = lanes.map(function (z) { var d = rod(LX - 1, .03, mat(0x3E4644)); d.position.set(X0 + .5, .05, z); scene.add(d); return d; });
  var TR = []; lanes.forEach(function (z, li) { for (var t = 0; t < 18; t++) TR.push({ x: X0 + .8 + t * (LX - 1.6) / 17, z: z, d: (li * 18 + t) / (lanes.length * 18), s: .85 + Math.random() * .3 }); });
  var trunkG = new THREE.CylinderGeometry(.07, .1, 1.1, 6); trunkG.translate(0, .55, 0);
  var crownG = new THREE.IcosahedronGeometry(.85, 1); crownG.translate(0, 1.75, 0);
  var trunks = new THREE.InstancedMesh(trunkG, mat(0x6B5A44), TR.length), crowns = new THREE.InstancedMesh(crownG, mat(0x3F7A3F), TR.length);
  trunks.castShadow = crowns.castShadow = true; scene.add(trunks); scene.add(crowns);
  // פירות קטנים (נראים רק בקרוב)
  // ברד: חלקיקים שנופלים; מעל המבנה הם ניתזים מהרשת
  var HN = 900, hp = new Float32Array(HN * 3), hv = new Float32Array(HN), hb = new Uint8Array(HN);
  function seedHail(i, top) { hp[i * 3] = (Math.random() * 2 - 1) * (LX / 2 + 10); hp[i * 3 + 1] = top ? 14 + Math.random() * 14 : Math.random() * 28; hp[i * 3 + 2] = (Math.random() * 2 - 1) * (LZ / 2 + 10); hv[i] = -(16 + Math.random() * 8); hb[i] = 0; }
  for (var hi = 0; hi < HN; hi++) seedHail(hi, false);
  var hg = new THREE.BufferGeometry(); hg.setAttribute("position", new THREE.BufferAttribute(hp, 3));
  var hailM = new THREE.PointsMaterial({ color: 0xFFFFFF, size: .22, transparent: true, opacity: 0, depthWrite: false });
  var hail = new THREE.Points(hg, hailM); hail.frustumCulled = false; scene.add(hail);

  // ---------- אנימציה לפי התקדמות ----------
  var STORM = new THREE.Color(0x7A8A8D);
  function cl(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function sm(a, b, v) { var t = cl((v - a) / (b - a)); return t * t * (3 - 2 * t); }
  function vis(o, s) { o.visible = s > .001; }
  // מצלמה: נקודת מבט לכל פרק (מיקום, יעד)
  var K = [
    [[30, 28, 36], [0, 0, 0]],
    [[17, 9, 24], [0, 0, 2]],
    [[26, 9, 22], [0, 1.6, 0]],
    [[13, 9.5, 17], [-2, 3.2, 0]],
    [[22, 17, 25], [0, 2.6, 0]],
    [[7, 5, 31], [1, 1.8, 6]],
    [[-21, 5.5, 15], [0, 1.4, 0]],
    [[20, 6.5, 28], [0, 3.2, 0]],
    [[30, 21, 31], [0, 2, 0]],
    [[34, 22, 34], [0, 1.5, 0]]
  ];
  var cp = new THREE.Vector3(), ct = new THREE.Vector3(), va = new THREE.Vector3(), vb = new THREE.Vector3();
  function camAt(P, t) {
    var x = P - .5, i = Math.max(0, Math.min(K.length - 2, Math.floor(x))), f = sm(0, 1, x - i);
    if (x < 0) f = 0; if (x > K.length - 1) { i = K.length - 2; f = 1; }
    va.fromArray(K[i][0]); vb.fromArray(K[i + 1][0]); cp.copy(va).lerp(vb, f);
    va.fromArray(K[i][1]); vb.fromArray(K[i + 1][1]); ct.copy(va).lerp(vb, f);
    // בסוף: סיבוב איטי סביב המבנה
    var orb = sm(8.6, 9.4, P);
    if (orb > 0 && !reduce) { var a = t * .06, r = Math.hypot(cp.x, cp.z), a0 = Math.atan2(cp.z, cp.x); cp.x = Math.cos(a0 + a * orb) * r; cp.z = Math.sin(a0 + a * orb) * r; }
    if (!reduce) { cp.x += Math.sin(t * .35) * .25; cp.y += Math.sin(t * .27) * .15; }
    camera.position.copy(cp); camera.lookAt(ct);
  }
  function apply(P, t, dt) {
    // 0: תכנון
    var b0 = sm(.05, .8, P);
    bpG.setDrawRange(0, Math.round(bpCount * b0 / 2) * 2);
    bpM.opacity = 1 - .75 * sm(2.2, 3, P); vis(blue, b0);
    // 1: יתדות וחוטים
    stakes.forEach(function (s, n) { var d = n / stakes.length; var v = sm(1.05 + d * .45, 1.15 + d * .45, P) * (1 - sm(2.1 + d * .5, 2.3 + d * .5, P)); s.scale.setScalar(Math.max(.001, v)); vis(s, v); });
    strings.forEach(function (s, n) { var v = sm(1.25 + n * .08, 1.6 + n * .08, P); var off = 1 - sm(2.5, 2.9, P); s.scale.x = Math.max(.001, v); vis(s, v * off); });
    // 2: עמודים
    poles.forEach(function (m, n) { var p = POLES[n], d = (p.i * NZ + p.k) / POLES.length; var v = sm(2.05 + d * .55, 2.2 + d * .55, P); m.scale.set(1, Math.max(.001, v), 1); vis(m, v); });
    // 3: כבלים ועיגונים
    cables.forEach(function (c, n) { var d = n / cables.length; var v = sm(3.05 + d * .5, 3.2 + d * .5, P); c.scale.x = Math.max(.001, v); vis(c, v); });
    anchors.forEach(function (a, n) { var d = n / anchors.length; var v = sm(3.3 + d * .4, 3.4 + d * .4, P); a.scale.x = Math.max(.001, v); vis(a, v); anchorBlocks[n].visible = v > .01; });
    // 4: רשת (נפרסת שורה אחרי שורה) · 8: מתקפלת בחורף
    var fold = sm(8.15, 8.55, P) * (1 - sm(8.95, 9.25, P));
    roofs.forEach(function (r, n) { var d = n / roofs.length; var v = sm(4.05 + d * .55, 4.3 + d * .55, P); v = v * (1 - fold * .95); r.scale.x = Math.max(.001, v); vis(r, v); });
    // 5: דפנות ודלת
    walls.forEach(function (w, n) { var v = sm(5.05 + n * .1, 5.4 + n * .1, P); w.scale.y = Math.max(.001, v); vis(w, v); });
    var dv = sm(5.4, 5.65, P); door.scale.setScalar(Math.max(.001, dv)); vis(door, dv);
    // 6: השקיה, ואז עצים
    drips.forEach(function (d, n) { var v = sm(6.02 + n * .06, 6.25 + n * .06, P); d.scale.x = Math.max(.001, v); vis(d, v); });
    TR.forEach(function (tr, n) {
      var v = sm(6.35 + tr.d * .4, 6.5 + tr.d * .4, P) * tr.s;
      dm.position.set(tr.x, 0, tr.z); dm.rotation.set(0, n, 0); dm.scale.set(Math.max(.001, v), Math.max(.001, v), Math.max(.001, v)); dm.updateMatrix();
      trunks.setMatrixAt(n, dm.matrix); crowns.setMatrixAt(n, dm.matrix);
    });
    trunks.instanceMatrix.needsUpdate = crowns.instanceMatrix.needsUpdate = true;
    // 7: ברד
    var hOn = sm(6.85, 7.15, P) * (1 - sm(7.85, 8.15, P));
    hailM.opacity = hOn * .95; hail.visible = hOn > .01;
    // סערה: שמיים אפורים ואור עמום, כדי שהברד ייראה
    renderer.setClearColor(0x5E6E72, hOn * .85); hemi.intensity = .62 - .2 * hOn; sun.intensity = .72 - .38 * hOn;
    scene.fog.color.setHex(0xE6EEEA).lerp(STORM, hOn);
    if (hail.visible && !reduce) {
      var roofOn = fold < .5;
      for (var i = 0; i < HN; i++) {
        var j = i * 3; hv[i] -= 30 * dt; hp[j + 1] += hv[i] * dt;
        var inside = hp[j] > X0 && hp[j] < X0 + LX && hp[j + 2] > Z0 && hp[j + 2] < Z0 + LZ;
        if (!hb[i] && roofOn && inside && hp[j + 1] < H + .05 && hp[j + 1] > H - .5) { hp[j + 1] = H + .05; hv[i] = Math.abs(hv[i]) * .22; hb[i] = 1; hp[j] += (Math.random() - .5) * .3; }
        else if (hb[i] && hp[j + 1] < H + .04) { hp[j + 1] = H + .04; hv[i] = 0; if (Math.random() < dt * 1.5) seedHail(i, true); }
        else if (hp[j + 1] < .05) { if (Math.random() < dt * 3) seedHail(i, true); else { hp[j + 1] = .05; hv[i] = 0; } }
      }
      hg.attributes.position.needsUpdate = true;
    }
  }

  // ---------- גלילה ----------
  var track = document.getElementById("track"), chs = document.getElementById("chapters");
  var Pt = 0, P = 0;
  function readScroll() {
    var r = track.getBoundingClientRect(), vh = window.innerHeight;
    // כל פרק = גובה מסך אחד; ההתקדמות בתוך הפרק מתחילה כשהכרטיס נכנס
    Pt = Math.max(0, Math.min(N - .001, (-r.top + vh * .55) / vh));
  }
  window.addEventListener("scroll", readScroll, { passive: true });

  function size() {
    var w = sceneEl.clientWidth, h = sceneEl.clientHeight;
    renderer.setSize(w, h, false); camera.aspect = w / Math.max(1, h);
    camera.fov = camera.aspect < .8 ? 52 : 38; camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", size); if (window.ResizeObserver) new ResizeObserver(size).observe(sceneEl);
  size();

  var last = performance.now(), t0 = last, curStep = -1;
  function frame(now) {
    var dt = Math.min(.05, (now - last) / 1000); last = now;
    P += (Pt - P) * (1 - Math.pow(reduce ? 0 : .88, dt * 60));
    var t = (now - t0) / 1000;
    apply(P, t, dt); camAt(P, t);
    renderer.render(scene, camera);
    var st = Math.min(N - 1, Math.floor(Pt));
    if (st !== curStep) { curStep = st; document.querySelectorAll(".rail button").forEach(function (b, i) { if (i === st) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current"); }); }
    requestAnimationFrame(frame);
  }

  // ---------- טקסטים ----------
  function build() {
    var t = T[L];
    document.documentElement.lang = L; document.documentElement.dir = t.dir; document.title = t.title;
    ["eb", "h1", "lede", "go", "badge", "note", "foot2"].forEach(function (k) { document.getElementById(k).textContent = t[k]; });
    cv.setAttribute("aria-label", t.aria);
    var lb = document.getElementById("lang"); lb.textContent = t.langL; lb.lang = t.lang;
    chs.innerHTML = ""; var rail = document.getElementById("rail"); rail.innerHTML = "";
    C.forEach(function (c, i) {
      var d = c[L], sec = document.createElement("section"); sec.className = "ch"; sec.id = "c" + i;
      var html = '<div class="card"><span class="k">' + d[0] + '</span><h2>' + d[1] + '</h2><p>' + d[2] + '</p>';
      if (d[3]) html += '<div class="cta"><a class="btn p" href="tel:' + t.tel + '">' + t.call + '</a></div>';
      html += "</div>";
      sec.innerHTML = html; chs.appendChild(sec);
      var b = document.createElement("button"); b.type = "button"; b.setAttribute("aria-label", t.step + " " + (i + 1) + ": " + d[1]); b.innerHTML = "<span></span>";
      b.addEventListener("click", function () { var r = track.getBoundingClientRect(); window.scrollTo({ top: window.scrollY + r.top + i * window.innerHeight + 2, behavior: reduce ? "auto" : "smooth" }); });
      rail.appendChild(b);
    });
    curStep = -1;
  }
  document.getElementById("lang").addEventListener("click", function () { L = L === "he" ? "en" : "he"; try { localStorage.setItem("miftah-build-lang", L); } catch (e) {} build(); });
  build(); readScroll(); P = Pt;
  requestAnimationFrame(frame);
})();
</script>
