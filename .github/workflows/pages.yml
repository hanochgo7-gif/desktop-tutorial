# פריסה אוטומטית ל-GitHub Pages בכל דחיפה לענף
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Dira (דירה מוכנה) is a Next.js app. It's built here into a static copy and published at /dira/.
      # If its build fails, the other sites still deploy and /dira/ is simply left out.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dira/package-lock.json
      - name: Build the Dira studio (static)
        id: dira
        continue-on-error: true
        working-directory: dira
        env:
          BASE_PATH: /desktop-tutorial/dira
          SITE_URL: https://hanochgo7-gif.github.io/desktop-tutorial/dira
          NEXT_TELEMETRY_DISABLED: "1"
          # Cookieless analytics switch on once the repository variable PLAUSIBLE_DOMAIN is set.
          NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${{ vars.PLAUSIBLE_DOMAIN }}
        run: |
          npm ci --no-audit --no-fund
          bash scripts/build-static.sh
      - name: Publish the built Dira site instead of its source
        run: |
          if [ "${{ steps.dira.outcome }}" = "success" ] && [ -f dira/out/index.html ]; then mv dira/out _dira_site; fi
          rm -rf dira
          if [ -d _dira_site ]; then mv _dira_site dira; fi
      # קבצי הבנייה, ההערות הפנימיות והגדרות הפיתוח לא צריכים להיות באתר הציבורי
      - name: Exclude build tools and internal notes (AMS, Mizrahi, Krudo)
        run: rm -rf ams/tools ams/README.md ams/.gitignore .claude .mcp.json mizrahi/tools mizrahi/docs mizrahi/content mizrahi/README.md mizrahi/.gitignore .taste-skill krudoeng/tools krudoeng/README.md krudoeng/.gitignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
