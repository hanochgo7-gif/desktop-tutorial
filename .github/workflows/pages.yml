# פריסה אוטומטית ל-GitHub Pages בכל דחיפה לענף
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Dira (דירה מוכנה) is a Next.js app. It's built here into a static copy and published at /dira/.
      # If its build fails, the other sites still deploy and /dira/ is simply left out.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dira/package-lock.json
      - name: Build the Dira studio (static)
        id: dira
        continue-on-error: true
        working-directory: dira
        env:
          BASE_PATH: /desktop-tutorial/dira
          SITE_URL: https://hanochgo7-gif.github.io/desktop-tutorial/dira
          NEXT_TELEMETRY_DISABLED: "1"
          # Cookieless analytics switch on once the repository variable PLAUSIBLE_DOMAIN is set.
          NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${{ vars.PLAUSIBLE_DOMAIN }}
        run: |
          npm ci --no-audit --no-fund
          bash scripts/build-static.sh
      # Pages caches HTML for 10 minutes: a page cached just before a deploy still asks for the
      # previous build's hashed files. Ship them alongside the new ones (one build back).
      - name: Restore the previous Dira build's static files
        if: steps.dira.outcome == 'success'
        uses: actions/cache/restore@v4
        with:
          path: .dira-prev-static
          key: dira-static-${{ github.sha }}
          restore-keys: dira-static-
      - name: Merge the previous build's static files into this one
        if: steps.dira.outcome == 'success'
        run: |
          mkdir -p .dira-cur && cp -r dira/out/_next/static .dira-cur/static
          if [ -d .dira-prev-static ]; then cp -rn .dira-prev-static/. dira/out/_next/static/; fi
          rm -rf .dira-prev-static && mv .dira-cur/static .dira-prev-static && rm -rf .dira-cur
      - name: Remember this build's static files for the next deploy
        if: steps.dira.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .dira-prev-static
          key: dira-static-${{ github.sha }}
      - name: Publish the built Dira site instead of its source
        run: |
          if [ "${{ steps.dira.outcome }}" = "success" ] && [ -f dira/out/index.html ]; then mv dira/out _dira_site; fi
          rm -rf dira .dira-prev-static
          if [ -d _dira_site ]; then mv _dira_site dira; fi
      # Hemshech Tnua CRM (Vite app) is built into a static copy and published at /hemshech-tnua/.
      # It needs the Supabase project URL and public (anon) key as repository variables
      # HEMSHECH_SUPABASE_URL and HEMSHECH_SUPABASE_ANON_KEY. Without them, or if the build fails,
      # the folder is left out entirely (its source, docs and tests are never published).
      - name: Build the Hemshech Tnua CRM (static)
        id: hemshech
        continue-on-error: true
        if: vars.HEMSHECH_SUPABASE_URL != '' && vars.HEMSHECH_SUPABASE_ANON_KEY != ''
        working-directory: hemshech-tnua
        env:
          VITE_SUPABASE_URL: ${{ vars.HEMSHECH_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.HEMSHECH_SUPABASE_ANON_KEY }}
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Publish the built CRM instead of its source
        run: |
          if [ "${{ steps.hemshech.outcome }}" = "success" ] && [ -f hemshech-tnua/dist/index.html ]; then mv hemshech-tnua/dist _hemshech_site; fi
          rm -rf hemshech-tnua
          if [ -d _hemshech_site ]; then mv _hemshech_site hemshech-tnua; fi
      # קבצי הבנייה, ההערות הפנימיות והגדרות הפיתוח לא צריכים להיות באתר הציבורי
      - name: Exclude build tools and internal notes (AMS, Mizrahi, Krudo, Lucid)
        run: rm -rf ams/tools ams/README.md ams/.gitignore .claude .mcp.json mizrahi/tools mizrahi/docs mizrahi/content mizrahi/README.md mizrahi/.gitignore .taste-skill krudoeng/tools krudoeng/README.md krudoeng/.gitignore lucid/tools lucid/tests lucid/supabase lucid/docs/research/data lucid/node_modules lucid/package.json lucid/package-lock.json lucid/.impeccable
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
