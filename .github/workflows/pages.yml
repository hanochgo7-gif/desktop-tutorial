# פריסה אוטומטית ל-GitHub Pages בכל דחיפה לענף
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Lucid: minify in place for the deploy only (every path kept, source maps published, release hashes
      # recomputed on the built bytes; see lucid/tools/build). On any error the Lucid source is restored and
      # deployed unminified, so this step never blocks the other sites.
      - name: Build Lucid for the deploy (falls back to the source on any error)
        run: cd lucid && (npm ci --prefix tools/build --no-audit --no-fund && node tools/build/build.mjs && node tools/build/verify.mjs) || (git checkout -- . && git clean -fdq -- .)
      # קבצי הבנייה, ההערות הפנימיות והגדרות הפיתוח לא צריכים להיות באתר הציבורי
      - name: Exclude build tools and internal notes (AMS, Mizrahi, Krudo, Lucid)
        run: rm -rf ams/tools ams/README.md ams/.gitignore .claude .mcp.json mizrahi/tools mizrahi/docs mizrahi/content mizrahi/README.md mizrahi/.gitignore .taste-skill krudoeng/tools krudoeng/README.md krudoeng/.gitignore lucid/tools lucid/tests lucid/supabase lucid/docs/research/data lucid/node_modules lucid/package.json lucid/package-lock.json lucid/.impeccable
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
