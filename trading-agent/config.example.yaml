# Copy to config.yaml and edit. config.yaml is git-ignored.

mode: paper          # paper | live. "live" also requires env CONFIRM_LIVE_TRADING=yes
dry_run: true        # true = compute and log orders without sending them to IBKR

ibkr:
  host: 127.0.0.1
  port: 7497         # TWS paper=7497, live=7496 | IB Gateway paper=4002, live=4001
  client_id: 17
  account: ""        # empty = first managed account

# Symbols the agent is allowed to trade. Anything else is refused.
universe:
  - {symbol: SPY,  exchange: SMART, currency: USD}
  - {symbol: QQQ,  exchange: SMART, currency: USD}
  - {symbol: AAPL, exchange: SMART, currency: USD}
  - {symbol: MSFT, exchange: SMART, currency: USD}
  # Tel Aviv example: {symbol: TEVA, exchange: TASE, currency: ILS}

# 50/200 in trend mode: best of the variants tested over 2007-2026 on 28 symbols
# (Sharpe 0.61 vs 0.64 buy&hold and 0.59 for 60/40, max drawdown -18% vs -45%,
# but CAGR 6.3% vs 11.6%). It reduces risk, it does not beat the market.
# Chosen out of ~10 variants on the same data, so expect somewhat worse live.
# The original 20/50 cross scored Sharpe 0.34 on the same test.
strategy:
  fast_sma: 50
  slow_sma: 200
  rsi_period: 14
  rsi_max_entry: 70      # skip entries when RSI is above this (overbought)
  atr_period: 14
  atr_stop_mult: 3.0     # trailing stop = highest close since entry - mult * ATR
  entry_mode: trend      # cross = only on the crossover day | trend = any day fast > slow
  cooldown_bars: 5       # trend mode: wait this many bars after an exit
  # Optional filters (0 / false / "" = off). Backtest before enabling.
  trend_sma: 0           # e.g. 150: close above a rising SMA150 (stage-2 style)
  macd_confirm: false    # MACD histogram > 0
  min_volume_ratio: 0    # e.g. 1.2: volume >= 1.2x its 20-day average
  regime_symbol: ""      # e.g. SPY: buy only while SPY is above its SMA
  regime_sma: 200

risk:
  risk_per_trade_pct: 1.0     # equity lost if the ATR stop is hit
  max_position_pct: 20.0      # cap per symbol, % of equity
  max_gross_exposure_pct: 80  # cap on all positions together
  min_cash_pct: 10            # always keep this much cash
  max_daily_loss_pct: 3.0     # halt new buys for the day after this drawdown
  max_orders_per_day: 10
  limit_offset_pct: 0.2       # limit price = last +/- this %
  broker_stop: true           # resting GTC stop at IBKR, so a crash is covered even if the agent is offline
  max_drawdown_pct: 20        # account down this much from its peak: sell all managed positions, stop the agent
  circuit_symbol: SPY         # market circuit breaker ("" = off)
  circuit_drop_pct: 5         # no buys after a day where SPY fell this much (or if SPY data is unavailable)

# Claude reviews each technical BUY before it is placed. It can approve, veto,
# or shrink the size; it never enlarges a trade, starts one, or blocks a sell.
# Errors and refusals count as a veto. Needs ANTHROPIC_API_KEY in the environment.
analyst:
  enabled: true
  model: claude-opus-5-5
  effort: high           # low | medium | high | xhigh | max
  web_search: true       # look up earnings dates and recent news
  max_searches: 5
  min_confidence: 0.6    # approvals below this confidence become vetoes

# Alerts: always logged; also sent to Telegram when TELEGRAM_BOT_TOKEN and
# TELEGRAM_CHAT_ID are set. Drift warnings fire when live results stop looking
# like the backtest.
monitor:
  alerts: true
  expected_max_drawdown_pct: 18   # the backtest's worst drawdown
  min_sharpe_60d: -1.0
  max_avg_slippage_bps: 15
  max_recent_errors: 5

state_dir: state             # journal, daily state, kill switch file (state/STOP)
