<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><title>poster</title>
<link rel="stylesheet" href="../assets/css/site.css">
<style>html,body{margin:0;background:#03202d}#stage{position:relative;width:1200px;height:900px}</style></head>
<body class="dark"><div id="stage"></div>
<script src="../assets/js/apartment.js"></script>
<script>
  // tools/render.mjs פותח את העמוד עם ?cam=&show=&w=&h= ומצלם
  var q = new URLSearchParams(location.search), host = document.getElementById('stage');
  host.style.width = (q.get('w') || 1200) + 'px'; host.style.height = (q.get('h') || 900) + 'px';
  var api = KrudoApartment.build(host, { cam: q.get('cam') || 'overview', show: q.get('show') || '' });
  document.documentElement.style.setProperty('--k-thermal', 'url("' + KrudoApartment.thermal() + '")');
  setTimeout(function () { api.follow(10); document.body.dataset.ready = '1'; }, 1600);
</script></body></html>
