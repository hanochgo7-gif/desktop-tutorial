<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="../../../images/logo.png">
<title>Data center fuel system</title>
<link rel="stylesheet" href="../../../css/fonts.css">
<style>
/* Layout: one working screen. The site model fills the stage in daylight; a glass HUD rides on top (timeline, live readouts, floating labels), the component card sits beside it and moves below on phones. */
:root {
  color-scheme: light;
  --bg: #eef1f3;
  --ink: #0f1a24;
  --muted: #56636e;
  --line: rgba(15, 26, 36, .12);
  --card: #ffffff;
  --glass: rgba(10, 22, 34, .62);
  --glass-2: rgba(10, 22, 34, .8);
  --glass-line: rgba(160, 220, 255, .28);
  --holo: #7fdcff;
  --accent: #0b668f;
  --fuel: #ffb547;
  --ok: #3fdc95;
  --warn: #ffc857;
  --alarm: #ff5b4f;
  --font: "Heebo", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cousine", monospace;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
html, body { height: 100%; margin: 0; overflow: hidden; }
.app { position: fixed; inset: 0; }
.stage { position: absolute; inset: 0; overflow: hidden; background: #cfe0ec; touch-action: none; isolation: isolate; }
.stage canvas { display: block; width: 100%; height: 100%; }
.stamp { flex: none; font-family: var(--font); letter-spacing: .06em; font-weight: 600; font-size: .7rem; padding: 4px 10px; border-radius: 999px; background: rgba(15,26,36,.82); color: #fff; }
button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.layer { position: absolute; inset: 0; pointer-events: none; }
.hot { position: absolute; left: 0; top: 0; pointer-events: auto; width: 28px; height: 28px; margin: -14px 0 0 -14px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.95); background: rgba(10,22,34,.55); color: #fff; font: 600 .74rem/1 var(--mono); display: grid; place-items: center; cursor: pointer; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); transition: transform .2s, background .2s, opacity .25s; }
.hot:hover { transform: scale(1.12); }
.hot.is-on { background: var(--accent); border-color: #fff; }
.hot.is-alarm { background: var(--alarm); }
.hot.is-hidden, .holo.is-hidden { opacity: 0; pointer-events: none; }
/* holographic panels: corner brackets, scanlines, a light sweep, a ring gauge and a live trace */
.leads { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.leads g { --c: var(--holo); color: var(--c); }
.leads g.on { --c: var(--ok); } .leads g.bad { --c: var(--alarm); } .leads g.warn { --c: var(--warn); }
.leads path { fill: none; stroke: currentColor; stroke-width: 1.2; opacity: .9; filter: drop-shadow(0 0 3px currentColor); }
.leads .dot { fill: #fff; filter: drop-shadow(0 0 4px currentColor); }
.leads .halo { fill: none; stroke: currentColor; stroke-width: 1.2; transform-box: fill-box; transform-origin: center; animation: halo 2.2s ease-out infinite; }
@keyframes halo { from { transform: scale(.35); opacity: 1; } to { transform: scale(2.1); opacity: 0; } }
.holo { --c: var(--holo); position: absolute; left: 0; top: 0; will-change: transform; pointer-events: none; min-width: 176px; padding: 7px 10px 8px; color: #eaf8ff; font-size: .72rem; line-height: 1.35; border-radius: 3px; overflow: hidden; transition: opacity .3s;
  background:
    linear-gradient(var(--c), var(--c)) 0 0 / 11px 2px no-repeat, linear-gradient(var(--c), var(--c)) 0 0 / 2px 11px no-repeat,
    linear-gradient(var(--c), var(--c)) 100% 0 / 11px 2px no-repeat, linear-gradient(var(--c), var(--c)) 100% 0 / 2px 11px no-repeat,
    linear-gradient(var(--c), var(--c)) 0 100% / 11px 2px no-repeat, linear-gradient(var(--c), var(--c)) 0 100% / 2px 11px no-repeat,
    linear-gradient(var(--c), var(--c)) 100% 100% / 11px 2px no-repeat, linear-gradient(var(--c), var(--c)) 100% 100% / 2px 11px no-repeat,
    radial-gradient(120% 90% at 50% 0%, color-mix(in srgb, var(--c) 26%, transparent), transparent 70%),
    linear-gradient(180deg, rgba(12, 40, 60, .74), rgba(4, 16, 28, .82));
  border: 1px solid color-mix(in srgb, var(--c) 38%, transparent);
  box-shadow: 0 0 24px color-mix(in srgb, var(--c) 30%, transparent), inset 0 0 22px color-mix(in srgb, var(--c) 16%, transparent);
  backdrop-filter: blur(8px) saturate(1.3); -webkit-backdrop-filter: blur(8px) saturate(1.3); }
.holo::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, color-mix(in srgb, var(--c) 9%, transparent) 0 1px, transparent 1px 3px); animation: scanl 8s linear infinite; pointer-events: none; }
.holo::after { content: ""; position: absolute; inset-inline: 0; top: 0; height: 40%; background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--c) 16%, transparent) 60%, transparent); animation: sweep 3.6s ease-in-out infinite; pointer-events: none; }
@keyframes scanl { to { background-position: 0 90px; } }
@keyframes sweep { 0% { transform: translateY(-110%); } 60%, 100% { transform: translateY(260%); } }
.holo.on { --c: var(--ok); } .holo.bad { --c: var(--alarm); } .holo.warn { --c: var(--warn); }
.holo.flash { animation: holoIn .75s ease-out; }
@keyframes holoIn { 0% { clip-path: inset(0 0 100% 0); filter: brightness(2.4); } 40% { clip-path: inset(0 0 0 0); filter: brightness(2); } 52% { opacity: .35; } 62% { opacity: 1; } 100% { filter: none; } }
.hh { position: relative; display: flex; align-items: center; gap: 7px; margin-bottom: 5px; white-space: nowrap; }
.hh .id { font: 600 .66rem/1 var(--mono); color: #03131d; background: var(--c); padding: 3px 5px 2px; border-radius: 2px; direction: ltr; box-shadow: 0 0 10px var(--c); }
.hh .tt { font-weight: 500; color: #fff; letter-spacing: .01em; }
.hh .st { margin-inline-start: auto; display: inline-flex; align-items: center; gap: 5px; font: 500 .64rem/1 var(--font); color: var(--c); }
.hh .st i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); animation: pulse 1.4s ease-in-out infinite; }
.hh .st em { font-style: normal; }
.hb { position: relative; display: flex; align-items: center; gap: 10px; }
.ring { position: relative; width: 50px; flex: none; display: grid; justify-items: center; }
.ring svg { width: 50px; height: 50px; transform: rotate(-90deg); overflow: visible; }
.ring circle { fill: none; }
.ring .t { stroke: rgba(234, 248, 255, .16); stroke-width: 4; stroke-dasharray: 1.6 1; }
.ring .v { stroke: var(--fuel); stroke-width: 4; stroke-dasharray: 0 100; filter: drop-shadow(0 0 3px var(--fuel)); transition: stroke-dasharray .5s; }
.ring .v.low { stroke: var(--alarm); filter: drop-shadow(0 0 3px var(--alarm)); }
.ring .o { stroke: color-mix(in srgb, var(--c) 55%, transparent); stroke-width: .8; stroke-dasharray: 8 4.5; animation: spin 14s linear infinite; transform-origin: 22px 22px; }
@keyframes spin { to { transform: rotate(360deg); } }
.ring b { position: absolute; top: 17px; inset-inline: 0; text-align: center; font: 600 .7rem/1 var(--mono); color: #fff; direction: ltr; font-variant-numeric: tabular-nums; }
.ring small { font-size: .56rem; color: rgba(234, 248, 255, .72); margin-top: 1px; white-space: nowrap; }
.rows { flex: 1; display: grid; gap: 2px; min-width: 0; }
.holo .row { display: flex; justify-content: space-between; gap: 12px; white-space: nowrap; }
.holo .row span { color: rgba(234, 248, 255, .7); }
.holo .row b { font: 600 .76rem/1.35 var(--font); color: #fff; direction: ltr; font-variant-numeric: tabular-nums; }
.holo .row.pri b { font-size: .86rem; color: var(--c); text-shadow: 0 0 10px color-mix(in srgb, var(--c) 70%, transparent); }
.spark { position: relative; display: block; width: 100%; height: 22px; margin-top: 6px; border-top: 1px dashed color-mix(in srgb, var(--c) 30%, transparent); }
.spark .l { fill: none; stroke: var(--c); stroke-width: 1.3; vector-effect: non-scaling-stroke; filter: drop-shadow(0 0 2px var(--c)); }
.spark .a { fill: color-mix(in srgb, var(--c) 18%, transparent); }
.holo .cap { display: block; font-size: .58rem; color: rgba(234, 248, 255, .6); margin-top: 1px; }
.holo.mini .cap { display: none; }
.holo.mini { min-width: 0; padding: 5px 8px 6px; }
.holo.mini .hh { margin-bottom: 2px; }
.holo.mini .ring, .holo.mini .spark, .holo.mini .row:not(.pri), .holo.mini .tt { display: none; }
.holo.mini .row.pri span { display: none; }
.dim { position: absolute; left: 0; top: 0; pointer-events: none; font: 500 .7rem/1 var(--mono); color: #0f1a24; background: rgba(255,255,255,.88); border: 1px solid rgba(15,26,36,.2); padding: 4px 7px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, -50%); direction: ltr; }
.dim[hidden] { display: none; }

.hud-top { position: absolute; top: 12px; inset-inline: 12px; display: flex; gap: 10px; align-items: start; justify-content: space-between; pointer-events: none; }
.hud-top > * { pointer-events: auto; }
.hx { --c: var(--holo); position: relative; overflow: hidden; border-radius: 4px !important; border: 1px solid color-mix(in srgb, var(--c) 34%, transparent) !important; box-shadow: 0 0 26px color-mix(in srgb, var(--c) 22%, transparent), inset 0 0 26px color-mix(in srgb, var(--c) 12%, transparent);
  background:
    linear-gradient(var(--c), var(--c)) 0 0 / 14px 2px no-repeat, linear-gradient(var(--c), var(--c)) 0 0 / 2px 14px no-repeat,
    linear-gradient(var(--c), var(--c)) 100% 0 / 14px 2px no-repeat, linear-gradient(var(--c), var(--c)) 100% 0 / 2px 14px no-repeat,
    linear-gradient(var(--c), var(--c)) 0 100% / 14px 2px no-repeat, linear-gradient(var(--c), var(--c)) 0 100% / 2px 14px no-repeat,
    linear-gradient(var(--c), var(--c)) 100% 100% / 14px 2px no-repeat, linear-gradient(var(--c), var(--c)) 100% 100% / 2px 14px no-repeat,
    repeating-linear-gradient(0deg, color-mix(in srgb, var(--c) 6%, transparent) 0 1px, transparent 1px 3px),
    linear-gradient(180deg, rgba(10, 36, 56, .72), rgba(4, 16, 28, .8)) !important; }
.hx::after { content: ""; position: absolute; top: 0; bottom: 0; width: 30%; inset-inline-start: 0; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--c) 12%, transparent), transparent); animation: sweepx 6s ease-in-out infinite; pointer-events: none; }
@keyframes sweepx { 0% { transform: translateX(-120%); } 50%, 100% { transform: translateX(420%); } }
.timeline { flex: 1; max-width: 600px; background: var(--glass); border: 1px solid var(--glass-line); border-radius: 14px; padding: 10px 14px 12px; color: #e9f7ff; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.tl-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.tl-head b { font-size: 1rem; font-weight: 600; }
.tl-head span { font-family: var(--mono); font-size: .78rem; color: var(--holo); direction: ltr; font-variant-numeric: tabular-nums; }
.steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 9px; }
.steps div { font-size: .68rem; color: rgba(233,247,255,.55); display: grid; gap: 5px; }
.steps div::before { content: ""; height: 3px; border-radius: 2px; background: rgba(255,255,255,.16); }
.steps div.done { color: #e9f7ff; }
.steps div.done::before { background: var(--ok); box-shadow: 0 0 8px rgba(63,220,149,.8); }
.steps div.now { color: #fff; }
.steps div.now::before { background: var(--warn); box-shadow: 0 0 8px rgba(255,200,87,.9); animation: pulse 1s ease-in-out infinite; }
.steps div.bad::before { background: var(--alarm); box-shadow: 0 0 8px rgba(255,91,79,.9); }
@keyframes pulse { 50% { opacity: .35; } }

.banner { --c: var(--alarm); position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) scaleY(.2); padding: 16px 30px 14px; font-size: clamp(1.15rem, 2.6vw, 1.9rem); font-weight: 500; letter-spacing: .02em; color: #fff; text-shadow: 0 0 18px var(--c); opacity: 0; pointer-events: none; transition: opacity .3s, transform .45s cubic-bezier(.2,1.4,.4,1); text-align: center; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 4; }
.banner small { color: color-mix(in srgb, var(--c) 60%, #fff); }
.banner small { display: block; font-size: .5em; font-weight: 400; opacity: .85; margin-top: 4px; font-family: var(--mono); }
.banner.show { opacity: 1; transform: translate(-50%, -50%) scaleY(1); }
.banner.ok { --c: var(--ok); }

.bar { position: absolute; inset-inline: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: end; justify-content: space-between; pointer-events: none; }
.bar > * { pointer-events: auto; }
.ctrl { display: grid; gap: 8px; justify-items: start; }
.go { font: 600 1.02rem/1 var(--font); color: #fff; background: linear-gradient(180deg, #e0443a, #b52a21); border: 1px solid rgba(255,160,150,.7); border-radius: 999px; padding: 14px 22px 14px 24px; cursor: pointer; display: inline-flex; gap: 10px; align-items: center; box-shadow: 0 0 0 6px rgba(224,68,58,.18), 0 10px 30px rgba(180,40,30,.45); transition: transform .15s, box-shadow .3s, background .3s; }
.go:hover { transform: translateY(-1px); }
.go:active { transform: scale(.97); }
.go svg { width: 20px; height: 20px; }
.go.idle { animation: goPulse 2.2s ease-in-out infinite; }
@keyframes goPulse { 50% { box-shadow: 0 0 0 12px rgba(224,68,58,.06), 0 10px 30px rgba(180,40,30,.45); } }
.go.back { background: linear-gradient(180deg, #2fb77c, #1d8a5b); border-color: rgba(140,255,200,.6); box-shadow: 0 0 0 6px rgba(47,183,124,.18), 0 10px 30px rgba(20,120,80,.4); }
.more { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 .78rem/1 var(--font); color: #e9f7ff; background: rgba(8,24,38,.66); border: 1px solid rgba(160,220,255,.3); border-radius: 999px; padding: 8px 12px; cursor: pointer; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.chip[aria-pressed="true"] { border-color: var(--warn); color: var(--warn); }
.side { display: grid; gap: 8px; justify-items: end; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; }
.tog { font: inherit; font-size: .8rem; color: #fff; background: rgba(8,24,38,.66); border: 1px solid rgba(160,220,255,.3); border-radius: 999px; padding: 7px 12px; cursor: pointer; display: inline-flex; gap: 7px; align-items: center; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.tog[aria-pressed="true"] { border-color: var(--holo); color: var(--holo); }
.tog svg { width: 15px; height: 15px; }
.gauges { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); min-width: min(500px, 100%); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.g { border-inline-start: 1px solid rgba(127,220,255,.14); padding: 10px 14px; display: grid; gap: 4px; min-width: 0; color: #e9f7ff; }
.g:first-child { border: 0; }
.g small { font-size: .7rem; color: rgba(233,247,255,.75); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g b { font: 600 1.15rem/1.1 var(--font); font-variant-numeric: tabular-nums; text-shadow: 0 0 12px rgba(127,220,255,.55); white-space: nowrap; }
.g b.ok { color: var(--ok); } .g b.warn { color: var(--warn); }
.g .meter { height: 3px; border-radius: 2px; background: rgba(255,255,255,.12); overflow: hidden; }
.g .meter i { display: block; height: 100%; width: 50%; background: var(--fuel); transition: width .4s, background .3s; margin-inline-start: auto; }
.tl-sub { margin: 3px 0 0; font-size: .8rem; line-height: 1.4; color: rgba(233,247,255,.82); font-weight: 300; }
.info { position: absolute; top: 132px; inset-inline-end: 12px; width: min(340px, calc(100% - 24px)); max-height: calc(100% - 250px); overflow: auto; padding: 16px 18px; color: #e9f7ff; display: flex; flex-direction: column; gap: 10px; z-index: 3; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.info[hidden] { display: none; }
.info .x { position: absolute; top: 8px; inset-inline-end: 8px; width: 32px; height: 32px; border-radius: 50%; border: 1px solid rgba(160,220,255,.3); background: rgba(255,255,255,.06); color: #fff; cursor: pointer; display: grid; place-items: center; }
.info .x svg { width: 16px; height: 16px; }
.info .n { font-family: var(--mono); font-size: .72rem; color: var(--holo); direction: ltr; text-align: end; margin-inline-end: 40px; }
.info h2 { font-size: 1.15rem; font-weight: 500; margin: 0; line-height: 1.25; }
.info p { margin: 0; font-size: .86rem; font-weight: 300; color: rgba(233,247,255,.9); }
.spec { display: grid; margin: 0; border-top: 1px solid rgba(160,220,255,.18); }
.spec div { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid rgba(160,220,255,.18); font-size: .8rem; }
.spec dt { color: rgba(233,247,255,.7); }
.spec dd { margin: 0; font-family: var(--mono); font-size: .76rem; text-align: end; color: #fff; }
.stds { display: flex; flex-wrap: wrap; gap: 6px; }
.stds span { font: 500 .7rem/1 var(--mono); padding: 5px 8px; border-radius: 4px; border: 1px solid rgba(127,220,255,.4); color: var(--holo); direction: ltr; }
.nav { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.nav button { font: inherit; font-size: .8rem; color: #fff; background: none; border: 1px solid rgba(160,220,255,.3); border-radius: 999px; padding: 7px 13px; cursor: pointer; }
.nav span { font-size: .76rem; color: rgba(233,247,255,.7); }
.loading { position: absolute; inset: 0; display: grid; place-items: center; background: #dde8f0; color: var(--muted); font-size: .92rem; transition: opacity .6s; z-index: 5; }
.loading.done { opacity: 0; pointer-events: none; }
@media (max-width: 720px) {
  .hud-top { top: 8px; inset-inline: 8px; }
  .timeline { padding: 8px 10px 9px; }
  .tl-head b { font-size: .86rem; }
  .tl-sub { font-size: .72rem; }
  .steps div { font-size: .58rem; }
  .bar { inset-inline: 8px; bottom: 8px; flex-direction: column-reverse; align-items: stretch; gap: 8px; }
  .ctrl { grid-template-columns: 1fr auto; align-items: center; }
  .go { font-size: .92rem; padding: 12px 16px; justify-content: center; }
  .more { grid-column: 1 / -1; }
  .chip { font-size: .7rem; padding: 7px 10px; }
  .side { justify-items: stretch; }
  .gauges { min-width: 0; }
  .g { padding: 7px 9px; }
  .g small { font-size: .6rem; }
  .g b { font-size: .9rem; }
  .tools { justify-content: center; }
  .tog { padding: 7px 10px; }
  .tog span { display: none; }
  .hot { width: 24px; height: 24px; margin: -12px 0 0 -12px; font-size: .66rem; }
  .holo { font-size: .64rem; }
  .info { top: auto; bottom: 8px; inset-inline: 8px; width: auto; max-height: 58%; }
}
@media (prefers-reduced-motion: reduce) { .go.idle, .steps div.now::before, .holo, .holo::before, .holo::after, .hh .st i, .leads .halo, .ring .o, .hx::after { animation: none !important; } .holo::after { display: none; } }
</style>
</head>
<body>
<main class="app" dir="ltr" lang="en">
  <div class="stage" id="stage">
    <div class="loading" id="loading">Loading the simulation…</div>
    <div class="layer" id="holoLayer"></div>
    <div class="layer" id="hotLayer" hidden></div>
    <div class="banner hx" id="banner" role="status" aria-live="assertive"></div>
    <div class="hud-top">
      <div class="timeline hx" aria-live="polite">
        <div class="tl-head"><b id="tlText">Grid power is normal</b><span id="tlClock">T 00:00</span></div>
        <p class="tl-sub" id="tlSub">Press the red button to see what happens when the power fails.</p>
        <div class="steps" id="steps"><div>Grid</div><div>Batteries</div><div>Start</div><div>Transfer</div><div>Fuel feed</div></div>
      </div>
      <span class="stamp">Rendering</span>
    </div>
    <aside class="info hx" id="info" hidden aria-labelledby="cT">
      <button class="x" type="button" id="infoX" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <span class="n" id="cN">01 / 14</span>
      <h2 id="cT">—</h2>
      <p id="cD">—</p>
      <dl class="spec" id="cS"></dl>
      <div class="stds" id="cStd"></div>
      <div class="nav"><button type="button" id="prev">Previous</button><span id="cPos"></span><button type="button" id="next">Next</button></div>
    </aside>
    <div class="bar">
      <div class="ctrl">
        <button class="go" type="button" id="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v9"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg><span id="goT">Trigger a power outage</span></button>
        <div class="more" role="group" aria-label="More scenarios">
          <button class="chip" type="button" data-mode="maint" aria-pressed="false">Outage with a generator down</button>
          <button class="chip" type="button" data-mode="leak" aria-pressed="false">Leak detection</button>
        </div>
      </div>
      <div class="side">
        <div class="gauges hx">
          <div class="g"><small>Servers powered by</small><b id="gSrc">Grid</b><span class="meter"><i id="mSrc"></i></span></div>
          <div class="g"><small>Fuel on site</small><b id="gMain">—</b><span class="meter"><i id="mMain"></i></span></div>
          <div class="g"><small>Fuel lasts</small><b id="gAuto">—</b><span class="meter"><i id="mAuto"></i></span></div>
