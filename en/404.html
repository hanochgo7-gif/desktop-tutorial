<script>
    (function () {
      // Dira Ready (/desktop-tutorial/dira/) is a separate site: keep its visitors there.
      if (location.pathname.indexOf('/desktop-tutorial/dira') === 0) {
        var l = /\/dira\/en(\/|$)/.test(location.pathname) ? 'en' : 'he';
        location.replace('/desktop-tutorial/dira/' + l + '/' + location.search);
        return;
      }
      // Lucid (/desktop-tutorial/lucid/) is a separate app that routes by #: a mistyped path goes to its start.
      if (/^\/desktop-tutorial\/lucid(\/|$)/.test(location.pathname)) {
        location.replace('/desktop-tutorial/lucid/' + location.search);
        return;
      }
      // שורש האתר: בכתובת הזמנית של GitHub Pages האתר יושב תחת /desktop-tutorial/
      var base = location.pathname.indexOf('/desktop-tutorial/') === 0 ? '/desktop-tutorial/' : '/';
      window.__base = base;
      var path = decodeURIComponent(location.pathname).toLowerCase();
      // כתובות מהאתר הישן (בלי .html) מועברות לעמוד המתאים
      var rest = path.slice(base.length);
      // רק כתובות ברמה העליונה או תחת services/articles: לא נוגעים בכתובות של אתרים אחרים באותו מאגר
      if (/\.html?$/.test(path) || !(/^[^\/]+\/?$/.test(rest) || /^(services|articles)\//.test(rest))) return;
      var map = [
        [/גלרי|gallery|תמונ|photo/, 'gallery.html'],
        [/אודות|עלינו|about|החברה|company/, 'about.html'],
        [/דרוש|משרות|career|jobs/, 'careers.html'],
        [/שירות|תחומ|service|הקמ|שיפוץ|צנרת|עפר/, 'index.html#fields'],
        [/פרויקט|project|portfolio/, 'projects.html'],
        [/צור|קשר|contact|הצעת/, 'contact.html'],
        [/מאמר|בלוג|blog|article/, 'articles.html'],
        [/נגישות|accessib/, 'accessibility.html'],
        [/פרטיות|privacy/, 'privacy.html']
      ];
      for (var i = 0; i < map.length; i++) { if (map[i][0].test(path)) { location.replace(base + map[i][1]); return; } }
    })();
  </script>
