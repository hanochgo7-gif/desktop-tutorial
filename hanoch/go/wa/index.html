<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>פותחים את וואטסאפ · HG Studio</title>
<!-- דף מעבר לוואטסאפ: כל לחיצה על וואטסאפ באתר עוברת כאן לרגע, כדי שגוגל אדס יספור ביקור בדף הזה כפנייה (המרה לפי כתובת הדף).
     מעביר רק לכתובות וואטסאפ (wa.me / api.whatsapp.com), כדי שאי אפשר יהיה להשתמש בו להפניה לאתר אחר -->
<style>
  html,body{margin:0;height:100%;background:#0e0e10;color:#ede8de;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;text-align:center;padding:24px}
  .dot{width:46px;height:46px;border-radius:50%;border:4px solid #25d36633;border-top-color:#25d366;animation:s 0.8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.dot{animation:none;border-color:#25d366}}
  p{margin:0;font-size:1.15rem}
  a{display:inline-block;margin-top:.4rem;padding:.75rem 1.4rem;border-radius:99px;background:#25d366;color:#06301a;font-weight:700;text-decoration:none}
  small{opacity:.6;font-size:.85rem}
</style>
<script src="/js/consent.js" defer></script>
<script src="/js/ga.js" defer></script>
<script src="/js/meta.js" defer></script>
</head>
<body>
<main>
  <div class="dot" aria-hidden="true"></div>
  <p id="msg">פותחים את וואטסאפ…</p>
  <a id="go" href="https://wa.me/972545522053" rel="noopener">לא נפתח? לחצו כאן</a>
  <small id="sig">HG Studio · חנוך גוטובסקי</small>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search), u = q.get('u') || '';
  if (!/^https:\/\/(wa\.me|api\.whatsapp\.com)\//.test(u)) u = 'https://wa.me/972545522053';
  // ההודעה עצמה (ובה שם, ולפעמים טלפון) יוצאת מכתובת הדף לפני שהתגים של גוגל ו-Meta נטענים, כדי שלא תישלח אליהם.
  // נשארים רק מזהה הקליק ופרמטרי הקמפיין. js/meta.js קורא את קוד המודעה מ-window.hgGo
  window.hgGo = { u: u };
  q.delete('u');
  var keep = q.toString();
  history.replaceState(null, '', location.pathname + (keep ? '?' + keep : ''));
  var go = document.getElementById('go');
  go.href = u;
  // הודעה מעמוד באנגלית (בלי אותיות עבריות): הדף מדבר אנגלית
  var text = '';
  try { text = new URL(u).searchParams.get('text') || ''; } catch (e) { /* כתובת לא תקינה */ }
  if (text && !/[֐-׿]/.test(text)) {
    var d = document.documentElement; d.lang = 'en'; d.dir = 'ltr';
    document.title = 'Opening WhatsApp · HG Studio';
    document.getElementById('msg').textContent = 'Opening WhatsApp…';
    go.textContent = 'Not opening? Tap here';
    document.getElementById('sig').textContent = 'HG Studio · Hanoch Gotovski';
  }
  var done = false;
  function open() { if (done) return; done = true; location.replace(u); }
  // ממתינים שהתג של גוגל (ואם אושרו עוגיות, גם הפיקסל של Meta) ייטען וישלח את הצפייה בדף, ולכל היותר שנייה וחצי.
  // תג שנחסם (חוסם פרסומות, בלי רשת) לא מעכב: עוברים מיד
  var t0 = Date.now();
  (function wait() {
    var meta = !window.fbq || window.fbq.callMethod || window.hgMetaFailed;
    var tag = window.hgTagFailed || (window.google_tag_manager && window.google_tag_manager['G-2D3GJNTP97']);
    if (meta && tag) return setTimeout(open, window.hgTagFailed ? 0 : 300);
    if (Date.now() - t0 > 1500) return open();
    setTimeout(wait, 80);
  })();
})();
</script>
</body>
</html>
