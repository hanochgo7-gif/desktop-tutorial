<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>רנטגן: רילס</title>
<link rel="stylesheet" href="xr-page.css">
<style>
.frame { height: 1920px; }
.series { top: 170px; right: 80px; }
.title { position: absolute; top: 250px; right: 80px; left: 80px; }
.title .num { margin-inline-end: 22px; width: 92px; height: 92px; font-size: 64px; vertical-align: 6px; }
#pa, #pb { top: 560px; left: 290px; }
.cap { position: absolute; top: 640px; font: 750 64px/1 var(--f-display); opacity: 0; width: 400px; text-align: center; }
.cap.b { left: 555px; color: var(--fg-dim); }
.cap.a { left: 125px; color: var(--signal); }
.stage { position: absolute; inset: 0; transform-origin: 0 0; }
.series, .title { z-index: 3; }
.endbox { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 46px; text-align: center; padding: 0 110px 260px; opacity: 0; }
.endbox .title { position: static; font-size: 136px; }
.endbox .sub { font-size: 44px; max-width: 820px; }
</style>
</head>
<body>
<div class="frame" id="f"></div>
<script src="xr-kit.js"></script>
<script>
(function () {
  var ep = new URLSearchParams(location.search).get('ep') || 'ep-ac';
  var s = document.createElement('script'); s.src = ep + '.js'; s.onload = function () { XR.fonts().then(build); }; document.head.appendChild(s);

  function el(html) { var d = document.createElement('div'); d.innerHTML = html; return d.firstChild; }

  function build() {
    var E = window.EP, F = document.getElementById('f'), K = XR.key;
    F.appendChild(el('<div class="series"><b>רנטגן</b><span>' + E.biz + '</span><span class="fict">' + E.fict + '</span></div>'));
    var titles = [el('<h1 class="title">' + E.hook + '</h1>')].concat(E.steps.map(function (st, i) {
      return el('<h1 class="title"><span class="num">' + (i + 1) + '</span>' + st.title + '</h1>');
    }));
    titles.push(el('<h1 class="title">' + E.compare.title + '</h1>'));
    titles.forEach(function (t) { F.appendChild(t); });

    // טלפון "לפני" להשוואה, ואחריו הטלפון הראשי שעליו קורה הכול
    var G = el('<div class="stage"></div>'); F.appendChild(G);
    var pb = XR.makePhone(E.site, E); pb.id = 'pb'; G.appendChild(pb); XR.setPhone(pb, {});
    var pa = XR.makePhone(E.site, E); pa.id = 'pa'; G.appendChild(pa); XR.setPhone(pa, {});
    var capB = el('<div class="cap b">' + E.compare.before + '</div>'), capA = el('<div class="cap a">' + E.compare.after + '</div>');
    F.appendChild(capB); F.appendChild(capA);
    var end = el('<div class="endbox"><div class="logo">HG<b>·</b>STUDIO</div><h1 class="title">' + E.end.title + '</h1><p class="sub">' + E.end.sub + '</p><span class="fict">' + E.fict + ', להמחשה</span></div>');
    F.appendChild(end);

    var sc = pa.querySelector('.screen'), PX = 290 + 14, PY = 560 + 14;
    var areaH = pa.querySelector('.layer.normal .area span').offsetHeight + 14;

    // סימון ותווית לכל בעיה ולכל תיקון. המיקום נמדד במצב שבו הם מופיעים
    function markAt(sel, state, fix, text) {
      XR.setPhone(pa, state);
      var m = document.createElement('div'); m.className = 'mark' + (fix ? ' fix' : ''); sc.appendChild(m);
      var b = XR.placeMark(pa, m, sel, 10);
      var tg = el('<div class="tag' + (fix ? ' fix' : '') + '">' + text + '</div>'); G.appendChild(tg);
      var w = tg.offsetWidth, h = tg.offsetHeight;
      var x = Math.max(60, Math.min(1080 - 60 - w, PX + b.left + b.width / 2 - w / 2));
      var y = PY + b.top - h - 22; if (y < PY + 90) y = PY + b.top + b.height + 22;
      tg.style.left = x + 'px'; tg.style.top = y + 'px';
      XR.setPhone(pa, {});
      var r = [m, tg]; r.cy = PY + b.top + b.height / 2; return r;
    }
    var st = E.steps, acc = {};
    var marks = st.map(function (s) {
      var before = Object.assign({}, acc, { scroll: s.scroll });
      var p = markAt(s.target, before, false, s.tag);
      acc[s.fix] = true;
      var after = Object.assign({}, acc, { scroll: s.scroll });
      return { p: p, f: markAt(s.fixTarget, after, true, s.fixTag) };
    });

    // ציר הזמן (שניות). פתיחה, שלוש בעיות של 6 שניות, השוואה וסיום
    var scrollY = function (to) { return XR.scrollOf(pa, to); };
    var T0 = 3, D = 6;
    // כותרות
    titles.forEach(function (t, i) {
      var a = i === 0 ? 0 : (i <= st.length ? T0 + (i - 1) * D + .2 : T0 + st.length * D + .2);
      var z = i === 0 ? T0 : (i <= st.length ? T0 + i * D : 26.4);
      var ks = i === 0 ? [[0, { o: 1, y: 0 }], [z - .1, { o: 1, y: 0 }], [z + .3, { o: 0, y: -40 }]]
        : [[a - .01, { o: 0, y: 40 }], [a + .4, { o: 1, y: 0 }], [z - .4, { o: 1, y: 0 }], [z - .05, { o: 0, y: -40 }]];
      K(t, ks);
    });
    // סריקת הפתיחה: כבר באמצע בפריים הראשון, יורדת עד הסוף ונעלמת
    K(pa.querySelector('.layer.xr'), [[0, { v: 44, o: 1 }], [2.3, { v: 100, o: 1 }], [2.4, { o: 1 }], [2.9, { o: 0 }]], function (e, v) {
      e.style.clipPath = 'inset(0 0 ' + (100 - v.v) + '% 0)'; e.style.opacity = v.o;
      var line = pa.querySelector('.scanline'); line.style.top = v.v + '%'; line.style.opacity = v.v < 100 ? 1 : 0;
    });
    // גלילה
    var sk = [[0, { v: 0 }]];
    st.forEach(function (s, i) { var a = T0 + i * D; sk.push([a + .4, { v: sk[sk.length - 1][1].v }], [a + 1.8, { v: scrollY(s.scroll) }]); });
    K(pa.querySelectorAll('.scroller'), sk, function (e, v) { e.style.transform = 'translateY(' + (-v.v) + 'px)'; });
    // סימונים ותיקונים לכל שלב
    st.forEach(function (s, i) {
      var a = T0 + i * D, m = marks[i];
      K(m.p, [[a + 1.9, { o: 0, s: 1.08 }], [a + 2.3, { o: 1, s: 1 }], [a + 3.5, { o: 1, s: 1 }], [a + 3.8, { o: 0, s: 1 }]]);
      var fx = a + 3.8, fixK = [[fx, { v: 0 }], [fx + .6, { v: 1 }]];
      if (s.fix === 'bar') K(pa.querySelector('.callbar'), fixK, function (e, v) { e.style.transform = 'translateY(' + (1 - v.v) * 130 + '%)'; });
      if (s.fix === 'area') K(pa.querySelectorAll('.area'), fixK, function (e, v) { e.style.height = v.v * areaH + 'px'; e.style.opacity = v.v; });
      if (s.fix === 'head') {
        K(pa.querySelectorAll('.strike'), [[fx - .5, { v: 0 }], [fx, { v: 1 }]], function (e, v) { e.style.width = v.v * 100 + '%'; });
        K(pa.querySelectorAll('.old'), [[fx + .2, { o: 1 }], [fx + .6, { o: 0 }]]);
        K(pa.querySelectorAll('h1.new'), [[fx + .3, { o: 0 }], [fx + .8, { o: 1 }]]);
      }
      K(m.f, [[fx + .7, { o: 0, s: 1.08 }], [fx + 1.1, { o: 1, s: 1 }], [a + D - .5, { o: 1, s: 1 }], [a + D - .2, { o: 0, s: 1 }]]);
    });
    // קירוב: בכל שלב הבמה מתקרבת לבעיה, כך שהיא נשארת במקום והכול גדל סביבה
    var Z = 1.18, zk = [[0, { s: 1, x: 0, y: 0 }], [2.8, { s: 1.04, x: 540 * -.04, y: 1060 * -.04 }], [3.3, { s: 1, x: 0, y: 0 }]];
    st.forEach(function (s, i) {
      var a = T0 + i * D, cy = marks[i].p.cy, zz = { s: Z, x: 540 * (1 - Z), y: cy * (1 - Z) };
      zk.push([a + 1.85, { s: 1, x: 0, y: 0 }], [a + 2.5, zz], [a + D - .6, zz], [a + D - .1, { s: 1, x: 0, y: 0 }]);
    });
    K(G, zk);
    // השוואה: הטלפון הראשי עובר שמאלה, ה"לפני" נכנס מימין
    var C = T0 + st.length * D;
    K(pa, [[C, { x: 0, y: 0, s: 1 }], [C + .8, { x: -215, y: 70, s: .76 }], [26.2, { x: -215, y: 70, s: .76, o: 1 }], [26.6, { o: 0 }]]);
    K(pb, [[C + .2, { x: 215, y: 70, s: .76, o: 0 }], [C + .9, { x: 215, y: 70, s: .76, o: 1 }], [26.2, { o: 1 }], [26.6, { o: 0 }]]);
    K([capB, capA], [[C + .6, { o: 0, y: 20 }], [C + 1.1, { o: 1, y: 0 }], [26.2, { o: 1, y: 0 }], [26.5, { o: 0, y: 0 }]]);
    // הגלילה של הראשי חוזרת למעלה בהשוואה כדי שיראו את המסך הראשון
    sk.push([C, { v: sk[sk.length - 1][1].v }], [C + .8, { v: 0 }]);
    // סיום
    K(end, [[26.5, { o: 0, y: 30 }], [27, { o: 1, y: 0 }]]);
    K(F.querySelector('.series'), [[0, { o: 1 }], [26.3, { o: 1 }], [26.6, { o: 0 }]]);

    XR.seek(0);
    window.READY = true;
  }
})();
</script>
</body>
</html>
