<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: one question per screen, a trail of 5 stations on top, big tap cards, a ring of 18 dots at the end */
:root{
  --bg:#E7EADF; --surface:#F6F7F1; --ink:#1B2216; --muted:#5B6551; --line:#C9CFBD;
  --olive:#4C6A2C; --olive-ink:#F4F7EE; --ember:#C9702A; --sel:#DCE7C9;
  --display:"Karantina","Rubik",system-ui,sans-serif; --body:"Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11150E; --surface:#1A2016; --ink:#E7EBDF; --muted:#9BA58F; --line:#323B2B;
  --olive:#9CBB67; --olive-ink:#11150E; --ember:#E8964B; --sel:#2A3622; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11150E; --surface:#1A2016; --ink:#E7EBDF; --muted:#9BA58F; --line:#323B2B;
  --olive:#9CBB67; --olive-ink:#11150E; --ember:#E8964B; --sel:#2A3622; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);direction:rtl}
.app{padding-top:max(12px,env(safe-area-inset-top,0px));max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px}
.demo{font-size:12px;color:var(--muted);text-align:center;letter-spacing:.02em}
/* trail */
.top{display:flex;align-items:center;gap:10px;padding-block:8px 4px}
.back{border:0;background:none;color:var(--ink);font:500 15px var(--body);padding:8px 4px;cursor:pointer;min-width:52px;text-align:right}
.back[disabled]{visibility:hidden}
.trail{flex:1;display:flex;align-items:flex-start;position:relative;min-width:0}
.trail::before{content:"";position:absolute;top:9px;right:9px;left:9px;border-top:2px dashed var(--line)}
.trail .fill{position:absolute;top:8px;right:9px;height:4px;background:var(--olive);border-radius:2px;transition:width .5s ease}
.st{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;z-index:1;min-width:0}
.st i{width:18px;height:18px;border-radius:50%;background:var(--bg);border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:11px;color:var(--olive-ink);transition:.3s}
.st span{font-size:11px;color:var(--muted);white-space:nowrap}
.st.on i{border-color:var(--olive);box-shadow:0 0 0 4px color-mix(in srgb,var(--olive) 22%,transparent)}
.st.on span{color:var(--ink);font-weight:500}
.st.done i{background:var(--olive);border-color:var(--olive)}
.eta{font-size:12px;color:var(--muted);min-width:52px;text-align:left}
/* screen */
.screen{flex:1;display:flex;flex-direction:column;gap:18px;padding-top:22px;animation:in .35s ease both}
@keyframes in{from{opacity:.001;transform:translateX(-14px)}to{opacity:1;transform:none}}
.kicker{font-size:14px;color:var(--ember);font-weight:500}
h1{font:700 clamp(40px,11vw,58px)/.95 var(--display);margin:0;letter-spacing:.01em;text-wrap:balance}
h2{font:700 clamp(34px,9vw,46px)/1 var(--display);margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0;max-width:44ch}
.fields{display:grid;gap:12px}
label.f{display:grid;gap:6px;font-size:14px;color:var(--muted)}
input[type=text],input[type=tel],input[type=email],select,textarea{
  font:500 18px var(--body);color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 16px;width:100%;box-sizing:border-box}
textarea{min-height:96px;resize:vertical;font-weight:400;font-size:16px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--olive)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid.one{grid-template-columns:1fr}
.card{display:flex;align-items:center;gap:10px;text-align:right;background:var(--surface);border:2px solid var(--line);border-radius:16px;
  padding:14px;font:500 16px/1.3 var(--body);color:var(--ink);cursor:pointer;min-height:56px;transition:transform .12s,border-color .2s,background .2s}
.card:active{transform:scale(.97)}
.card .ic{font-size:22px;line-height:1;flex:none}
.card small{display:block;font-weight:400;font-size:13px;color:var(--muted);margin-top:2px}
.card[aria-pressed="true"]{border-color:var(--olive);background:var(--sel)}
.card[aria-pressed="true"]::after{content:"✓";margin-inline-start:auto;color:var(--olive);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 14px;font:500 15px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--olive);background:var(--sel)}
.year{display:grid;gap:10px;justify-items:center;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:18px}
.year output{font:700 76px/1 var(--display);color:var(--olive);font-variant-numeric:tabular-nums}
.year .row{display:flex;gap:14px;align-items:center;width:100%}
.year button{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:700 22px var(--body);cursor:pointer;flex:none}
.year input[type=range]{flex:1;accent-color:var(--olive);min-width:0}
.note{font-size:13px;color:var(--muted);background:var(--surface);border-radius:12px;padding:10px 12px;border:1px dashed var(--line)}
.lock{display:flex;gap:8px;align-items:flex-start}
.cta{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:12px}
.go{border:0;border-radius:16px;background:var(--olive);color:var(--olive-ink);font:700 18px var(--body);padding:16px;cursor:pointer}
.go[disabled]{opacity:.4;cursor:not-allowed}
.skip{border:0;background:none;color:var(--muted);font:500 15px var(--body);padding:8px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.err{color:var(--ember);font-size:14px;min-height:1.2em;margin:0}
button:focus-visible,.card:focus-visible,.chip:focus-visible,a:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
.hint{font-size:13px;color:var(--muted)}
/* cover + finish */
.cover{justify-content:center;gap:20px}
.cover h1{font-size:clamp(52px,15vw,84px)}
.facts{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.facts b{display:block;font:700 34px/1 var(--display);color:var(--ink)}
.ring{width:200px;height:200px;align-self:center;position:relative}
.ring i{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--olive);top:50%;left:50%;margin:-7px;transition:transform 1s cubic-bezier(.2,.8,.2,1),background .4s}
.ring i.me{background:var(--ember);width:18px;height:18px;margin:-9px}
.sum{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.sum span{font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
a.go{text-align:center;text-decoration:none;display:block}
a.ghost{display:block;text-align:center;text-decoration:none;border:2px solid var(--olive);color:var(--ink);border-radius:16px;padding:14px;font:700 17px var(--body)}
.center{text-align:center;align-items:center}
.preview{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid var(--olive)}
@media (prefers-reduced-motion:reduce){.screen{animation:none}.ring i,.trail .fill{transition:none}}
</style>

<div class="app">
  <div class="demo">עמותת בוגרי סיירת נח״ל (מגיני הינשוף, ע״ר 580218642)</div>
  <div class="top" id="top" hidden>
    <button class="back" id="back" type="button">→ חזרה</button>
    <div class="trail" id="trail" aria-label="התקדמות"><div class="fill" id="fill"></div></div>
    <div class="eta" id="eta" aria-live="polite"></div>
  </div>
  <main id="screen" class="screen" aria-live="polite"></main>
</div>

<script>
/* CONFIG: the address that receives each submission (POST, JSON as text/plain). Empty = not connected yet. */
const ENDPOINT="";
const FORM_ID="sayeret-join-2026";
if(top!==self){try{top.location=self.location}catch(_){document.documentElement.hidden=true}}
const REF=(new URLSearchParams(location.search).get("ref")||"").replace(/[^\w\u0590-\u05FF-]/g,"").slice(0,40);
const STATIONS=["יציאה","הסיירת","מה טוב לי","בינינו","בונוס"];
const S={status:[],help:[],personal:[],knows:[],give:[],fund:[],areas:[],platforms:[],year:2015};
const has=(k,v)=>S[k]&&S[k].includes(v);
const PLUGOT=["פלס״ר / פלגה א׳","פלחה״ן / פלגה ב׳","פלנ״ט-עורב / פלגה ג׳","מסייעת","מפג״ד / פלס״ם"];
const FIELDS=["הייטק - פיתוח/תוכנה","הייטק - ניהול מוצר/פרויקטים","הייטק - IT/DevOps/QA/תמיכה","עריכת דין / משפטים","כלכלה / חשבונאות / פיננסים","שיווק / פרסום / דיגיטל","רפואה / פרא-רפואי","פסיכולוגיה / טיפול רגשי","עבודה סוציאלית","חינוך","הנדסה","תעשייה / תפעול","לוגיסטיקה / אחזקה","צה״ל / שירותי ביטחון","ציבורי / ממשלה / רשויות","עיצוב / אדריכלות","עצמאי","נדל״ן / תיווך / יזמות","אחר"];
const INST=["אוניברסיטת תל אביב","האוניברסיטה העברית","הטכניון","אוניברסיטת בן גוריון","אוניברסיטת חיפה","אוניברסיטת בר אילן","האוניברסיטה הפתוחה","אוניברסיטת רייכמן","אוניברסיטת אריאל","המכללה האקדמית תל אביב-יפו","מכללת ספיר","מכללת תל חי","המכללה למינהל","שנקר","בצלאל","מכללה אחרת"];
const DEGREES=["מדעי המחשב","הנדסת תוכנה","הנדסת חשמל","הנדסת מכונות","הנדסה אזרחית","כלכלה","מנהל עסקים","חשבונאות","משפטים","רפואה","סיעוד","עבודה סוציאלית","פסיכולוגיה","תקשורת","חינוך והוראה","עיצוב / אדריכלות","מדעי החיים","מדעים מדויקים","מדעי המדינה","אחר"];
const MONTHS=["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];

/* each screen: id, station, show(), render() returns html, bind(el), ok() validation, optional */
const SCREENS=[
 {id:"cover",st:-1,render:()=>`
   <div class="kicker">קהילת בוגרי סיירת נח״ל</div>
   <h1>השתחררת מהסיירת. לא מהמשפחה.</h1>
   <p class="sub">3 דקות, 5 תחנות. בסוף נדע איך להיות שם בשבילך, ואתה תדע איפה אפשר לתת.</p>
   <div class="facts"><div><b>30+</b>שנות קהילה</div><div><b>58</b>צוותים יצאו למסע</div><div><b>3</b>דקות מילוי</div></div>
   <div class="cta"><button class="go" data-next>יוצאים לדרך</button></div>`,cls:"cover"},

 {id:"name",st:0,render:()=>`
   <div class="kicker">תחנה 1 · יציאה</div><h2>איך קוראים לך?</h2>
   <div class="fields">
    <label class="f">שם פרטי<input type="text" id="first" autocomplete="given-name" value="${esc(S.first)}"></label>
    <label class="f">שם משפחה<input type="text" id="last" autocomplete="family-name" value="${esc(S.last)}"></label>
   </div>`,ok:()=>!!(val("first")&&val("last"))||"צריך שם פרטי ושם משפחה",
   save:()=>{S.first=val("first");S.last=val("last")}},

 {id:"contact",st:0,render:()=>`
   <div class="kicker">נעים מאוד, ${esc(S.first)}</div><h2>איפה תופסים אותך?</h2>
   <p class="sub">רק כדי לעדכן אותך ולהזמין לדברים ששווים את זה. בלי ספאם.</p>
   <div class="fields">
    <label class="f">נייד<input type="tel" id="phone" inputmode="tel" autocomplete="tel" placeholder="050-0000000" value="${esc(S.phone)}" dir="ltr"></label>
    <label class="f">מייל<input type="email" id="email" autocomplete="email" placeholder="name@mail.com" value="${esc(S.email)}" dir="ltr"></label>
   </div>`,ok:()=>{const p=val("phone").replace(/\D/g,""),e=val("email");
     if(p.length<9)return"מספר הנייד קצר מדי";if(!/^\S+@\S+\.\S+$/.test(e))return"כתובת המייל לא נראית תקינה";return true},
   save:()=>{S.phone=val("phone");S.email=val("email")}},

 {id:"region",st:0,auto:true,render:()=>`
   <div class="kicker">תחנה 1 · יציאה</div><h2>איפה הבית שלך היום?</h2>
   <p class="sub">כדי להזמין אותך למפגשים ולטקסים קרוב אליך.</p>
   ${cards("region",["גליל עליון + רמת הגולן","צפון","גליל תחתון + עמקים","מנשה + שרון","גוש דן + השפלה","ירושלים","שומרון","לכיש + נגב","מחוץ לישראל"],false)}`,
   ok:()=>!!S.region||"בחרו אזור"},

 {id:"conn",st:1,auto:true,render:()=>`
   <div class="kicker">תחנה 2 · הסיירת שלי</div><h2>מה החיבור שלך לסיירת?</h2>
   ${cards("conn",[...PLUGOT.map(p=>["🦉",p]),["🤍","הורה ללוחם"],["🕯️","משפחה שכולה"],["🤝","מתנדב/ת"]],false,true)}`,
   ok:()=>!!S.conn||"בחרו אחת מהאפשרויות"},

 {id:"bereaved",st:1,show:()=>S.conn==="משפחה שכולה",render:()=>`
   <div class="kicker">אנחנו איתכם</div><h2>של מי?</h2>
   <p class="sub">כדי שנזמין אתכם לכל אירוע זיכרון, ונישאר בקשר.</p>
   <label class="f">שם החלל<input type="text" id="fallen" placeholder="מתחילים להקליד שם…" value="${esc(S.fallen)}"></label>
   <div class="hint">קרבה</div>${chips("relation",["בן/בת זוג","הורה","אח/אחות","בן/בת","אחר"],false)}`,
   ok:()=>!!(val("fallen")&&S.relation)||"צריך שם וקרבה",save:()=>{S.fallen=val("fallen")}},

 {id:"enlist",st:1,show:()=>PLUGOT.includes(S.conn),render:()=>`
   <div class="kicker">תחנה 2 · הסיירת שלי</div><h2>מתי התגייסת?</h2>
   <div class="year">
     <output id="yv">${S.year}</output>
     <div class="row"><button type="button" id="ym" aria-label="שנה אחורה">−</button>
     <input type="range" id="yr" min="1975" max="2026" value="${S.year}" aria-label="שנת גיוס">
     <button type="button" id="yp" aria-label="שנה קדימה">+</button></div>
   </div>
   <div class="hint">מחזור</div>${chips("month",["מרץ","אוגוסט","נובמבר","חודש אחר"],false)}
   <select id="mo" ${S.month==="חודש אחר"?"":"hidden"} aria-label="חודש גיוס">${MONTHS.map(m=>`<option ${S.monthX===m?"selected":""}>${m}</option>`).join("")}</select>`,
   bind:()=>{const r=$("#yr"),o=$("#yv"),set=v=>{S.year=Math.max(1975,Math.min(2026,v));r.value=S.year;o.textContent=S.year};
     r.oninput=()=>set(+r.value);$("#ym").onclick=()=>set(S.year-1);$("#yp").onclick=()=>set(S.year+1)},
   onChip:()=>{$("#mo").hidden=S.month!=="חודש אחר"},
   ok:()=>!!S.month||"בחרו מחזור",save:()=>{if(S.month==="חודש אחר")S.monthX=$("#mo").value}},

 {id:"role",st:1,optional:true,show:()=>PLUGOT.includes(S.conn),render:()=>`
   <div class="kicker">${cohort()}. ברוך הבא הביתה.</div><h2>ומה עשית שם?</h2>
   <p class="sub">לא חובה. עוזר לנו לחבר אותך לאנשים הנכונים.</p>
   <div class="fields">
    <label class="f">תפקיד אחרון בסיירת<input type="text" id="role" placeholder="לוחם, מ״כ, קשר, חובש…" value="${esc(S.role)}"></label>
    <label class="f">שם המפק״צ (לא חובה)<input type="text" id="mpkz" value="${esc(S.mpkz)}"></label>
   </div>`,save:()=>{S.role=val("role");S.mpkz=val("mpkz")}},

 {id:"status",st:2,render:()=>`
   <div class="kicker">תחנה 3 · מה טוב לי</div><h2>מה אתה עושה בימים אלה?</h2>
   <p class="sub">אפשר לסמן כמה.</p>
   ${cards("status",[["🎒","משוחרר/ת טרי/ה","בשנה וחצי האחרונות"],["💼","שכיר/ה"],["🛠️","עצמאי/ת"],["📚","סטודנט/ית"],["🔎","מחפש/ת עבודה ראשונה"]],true,true)}`,
   ok:()=>S.status.length>0||"סמנו לפחות אחד"},

 {id:"study",st:2,show:()=>has("status","סטודנט/ית"),render:()=>`
   <div class="kicker">סטודנט/ית, יפה</div><h2>איפה ומה לומדים?</h2>
   <div class="fields">
    <label class="f">מוסד<select id="inst">${opts(INST,S.inst)}</select></label>
    <label class="f">תחום<select id="deg">${opts(DEGREES,S.deg)}</select></label>
   </div>
   <div class="hint">שנה</div>${chips("syear",["א׳","ב׳","ג׳","ד׳","ה׳+"],false)}
   <button class="card" type="button" data-toggle="scholars" aria-pressed="${!!S.scholars}"><span class="ic">🎓</span><span>מעניין אותי לבדוק זכאות ל״מילגאים של הסיירת״<small>מלגה, תמורת כמה שעות התנדבות בחודש בעמותה</small></span></button>`,
   ok:()=>!!S.syear||"בחרו שנת לימודים",save:()=>{S.inst=$("#inst").value;S.deg=$("#deg").value}},

 {id:"career",st:2,show:()=>["שכיר/ה","עצמאי/ת","מחפש/ת עבודה ראשונה"].some(x=>has("status",x)),render:()=>`
   <div class="kicker">תחנה 3 · מה טוב לי</div><h2>במה אתה עובד?</h2>
   <div class="fields">
    <label class="f">תחום<select id="field">${opts(FIELDS,S.field)}</select></label>
    <label class="f">התפקיד בפועל<input type="text" id="job" placeholder="למשל: מפתח בקאנד, עו״ד מסחרי" value="${esc(S.job)}"></label>
   </div>
   <div class="hint">ניסיון בתחום</div>${chips("exp",["עוד לא התחלתי","פחות משנה","1-3 שנים","3-6 שנים","מעל 6 שנים"],false)}`,
   ok:()=>!!S.exp||"בחרו ניסיון",save:()=>{S.field=$("#field").value;S.job=val("job")}},

 {id:"help",st:2,render:()=>`
   <div class="kicker">החלק הכי חשוב</div><h2>במה נוכל להיות שם בשבילך?</h2>
   <p class="sub">סמנו כמה שבא לכם. נחזור עם התאמה.</p>
   ${cards("help",[["🧭","הכוונה אחרי שחרור"],["📄","קו״ח, לינקדאין וראיונות"],["🤝","מנטורינג אישי"],["🔗","נטוורקינג ומפגשים מקצועיים"],["🎓","מלגות וזכאויות"],["🏔️","מסעות ומפגשי חוסן"],["🔥","מפגשי בוגרים וקהילה"],["🕯️","הנצחה ואירועי זיכרון"],["📣","רק עדכונים כלליים"]],true,true)}`,
   ok:()=>S.help.length>0||"סמנו לפחות אחד"},

 {id:"memorial",st:2,optional:true,show:()=>has("help","הנצחה ואירועי זיכרון"),render:()=>`
   <div class="kicker">זוכרים ביחד</div><h2>יש חלל שתרצו להישאר מחוברים אליו?</h2>
   <label class="f">שם החלל<input type="text" id="fallen2" placeholder="מתחילים להקליד שם…" value="${esc(S.fallen2)}"></label>

 {id:"personal",st:3,optional:true,render:()=>`

   <div class="note lock">🔒 <span>נשמר בדיסקרטיות מלאה ורואים אותו רק אנשי התחום. אם לא רלוונטי, פשוט מדלגים.</span></div>
   ${chips("personal",["פצוע/ה, מוכר/ת במשרד הביטחון","פצוע/ה, לא מוכר/ת","בן/בת למשפחה שכולה","הייתי חייל/ת בודד/ה","מתמודד/ת נפשית","יש לי עניין אישי, שיחזרו אליי"],true)}
   <div class="hint">ומכירים מישהו שנשמח להיות איתו בקשר?</div>
   ${chips("knows",["פצוע/ים","משפחה שכולה","חייל/ים בודד/ים","משפחות ל״משפחות מלוות״"],true)}
   <label class="f" id="pnwrap" ${(S.personal.length||S.knows.length)?"":"hidden"}>איך ליצור קשר / פרטים<input type="text" id="pnote" value="${esc(S.pnote)}"></label>`,
   onChip:()=>{$("#pnwrap").hidden=!(S.personal.length||S.knows.length)},save:()=>{S.pnote=val("pnote")}},

 {id:"give",st:4,optional:true,render:()=>`
   <div class="kicker">תחנה 5 · סיבוב בונוס</div><h2>ומה אתה מביא לקהילה?</h2>
   <p class="sub">לכל אחד יש משהו לתת. גם דבר קטן מחזיק את כולם.</p>
   ${cards("give",[["⚖️","שירות מקצועי בהתנדבות","עו״ד, רו״ח, רופא, פסיכולוג…"],["🏷️","הטבה מהעסק שלי"],["🏠","מקום לאירועים"],["💼","משרות לבוגרים"],["💛","עזרה בגיוס תרומות"],["📞","רכז/ת צוות","איש הקשר של הצוות שלי"],["🧩","לרכז תחום"],["⏳","כרגע לא, אולי בהמשך"]],true,true)}`},

 {id:"fund",st:4,optional:true,show:()=>has("give","עזרה בגיוס תרומות"),render:()=>`
   <div class="kicker">אלוף. זה בדיוק מה שחסר</div><h2>את מי אתה מכיר?</h2>
   ${chips("fund",["תורמים פרטיים או חברות","מי שייתן שירות פרו-בונו","חברות שייתנו הנחות לבוגרים","חברות שייתנו חסות לפרויקט","תורמים למלגות","משהו אחר"],true)}`},

 {id:"areas",st:4,optional:true,show:()=>has("give","לרכז תחום"),render:()=>`
   <div class="kicker">תחנה 5 · סיבוב בונוס</div><h2>איזה תחום מדבר אליך?</h2>
   ${chips("areas",["תעסוקה","ליווי משפחות שכולות","ליווי פצועים","סטודנטים","עצמאיים","מילגאים","אחר"],true)}
   <label class="f">במשפט אחד: מה תוכל להציע?<input type="text" id="offer" value="${esc(S.offer)}"></label>`,save:()=>{S.offer=val("offer")}},

 {id:"last",st:4,optional:true,render:()=>`
   <div class="kicker">כמעט שם</div><h2>מילה אחרונה?</h2>
   <label class="f">רעיון לפעילות, או מה לשפר בקבוצות שלנו<textarea id="idea" placeholder="כל רעיון מתקבל">${esc(S.idea)}</textarea></label>
   <div class="hint">איפה אתה פעיל היום?</div>${chips("platforms",["קבוצות וואטסאפ","פייסבוק","עוד לא, אבל בא לי"],true)}
   <div class="hint">תמונה לקיר הקהילה (לא חובה)</div>
   <div class="chips" style="align-items:center"><label class="chip" for="selfie">📸 העלאת סלפי</label><input type="file" id="selfie" accept="image/*" hidden>${S.photo?`<img class="preview" src="${S.photo}" alt="התמונה שלך">`:""}</div>`,
   bind:()=>{$("#selfie").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,512/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);S.photo=c.toDataURL("image/jpeg",.82);S.idea=val("idea");draw()};im.src=r.result};r.readAsDataURL(f)}},
   save:()=>{S.idea=val("idea")}},

 {id:"send",st:4,render:()=>`
   <div class="kicker">צעד אחרון</div><h2>שולחים, ${esc(S.first||"")}?</h2>
   <div class="note lock">🔒 <span>הפרטים נשמרים אצל העמותה בלבד ומשמשים ליצירת קשר, לשיבוץ לפעילות ולעדכונים. מידע אישי רגיש (פציעה, התמודדות נפשית) נשמר בדיסקרטיות, ורואים אותו רק אנשי התחום. אפשר לבקש לעיין בפרטים, לתקן או למחוק בכל זמן: sayeret.nahal@gmail.com</span></div>
   <button class="card" type="button" data-toggle="consent" aria-pressed="${!!S.consent}"><span class="ic">✍️</span><span>אני מסכים/ה שהעמותה תשמור את הפרטים ותיצור איתי קשר</span></button>`,
   ok:()=>!!S.consent||"צריך לסמן הסכמה כדי לשלוח"},

 {id:"done",st:5,render:()=>`
   <div class="ring" id="ring" aria-hidden="true">${Array.from({length:18},(_,i)=>`<i class="${i===17?"me":""}"></i>`).join("")}</div>
   <div class="kicker">נכנסת למעגל</div>
   <h1>ברוך הבא הביתה, ${esc(S.first||"אח")}</h1>
   <div class="sum">${summary().map(s=>`<span>${esc(s)}</span>`).join("")}</div>
   <p class="sub">צעד אחרון להשלמת החברות: דמי חבר ב-Jgive. אחר כך מצטרפים לקבוצות הוואטסאפ שמעניינות אותך.</p>
   <div class="cta" style="margin-top:8px">
     <a class="go" href="https://swiy.co/MemberJgive" target="_blank" rel="noopener">להשלמת החברות ב-Jgive</a>
     <a class="ghost" href="https://chat.whatsapp.com/LcccAR6KSbq7RpVl2hQJ2o" target="_blank" rel="noopener">לקהילת הוואטסאפ של הבוגרים</a>
   </div>`,cls:"center",
   bind:()=>{const is=[...document.querySelectorAll("#ring i")];
     is.forEach((d,i)=>{d.style.transform=`translate(${(i%6-2.5)*26}px,${(Math.floor(i/6)-1)*26}px)`});
     requestAnimationFrame(()=>requestAnimationFrame(()=>is.forEach((d,i)=>{const a=i/18*Math.PI*2-Math.PI/2;d.style.transform=`translate(${Math.cos(a)*86}px,${Math.sin(a)*86}px)`})));}}
];

function $(q){return document.querySelector(q)}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function val(id){const e=document.getElementById(id);return e?e.value.trim():""}
function opts(list,sel){return list.map(o=>`<option ${o===sel?"selected":""}>${o}</option>`).join("")}
function cohort(){const m=S.month==="חודש אחר"?(S.monthX||""):S.month;return `מחזור ${m} ${S.year}`}
function cards(key,items,multi,rich){
  return `<div class="grid ${items.length<4?"one":""}" role="group">`+items.map(it=>{
    const [ic,label,small]=Array.isArray(it)?it:["",it,""];
    const on=multi?(S[key]||[]).includes(label):S[key]===label;
    return `<button class="card" type="button" data-key="${key}" data-val="${esc(label)}" data-multi="${multi?1:0}" aria-pressed="${on}">${ic?`<span class="ic">${ic}</span>`:""}<span>${esc(label)}${small?`<small>${esc(small)}</small>`:""}</span></button>`}).join("")+`</div>`}
function chips(key,items,multi){
  return `<div class="chips" role="group">`+items.map(l=>{const on=multi?(S[key]||[]).includes(l):S[key]===l;
    return `<button class="chip" type="button" data-key="${key}" data-val="${esc(l)}" data-multi="${multi?1:0}" data-chip="1" aria-pressed="${on}">${esc(l)}</button>`}).join("")+`</div>`}
function summary(){const o=[];if(S.conn)o.push(S.conn);if(PLUGOT.includes(S.conn)&&S.month)o.push(cohort());if(S.region)o.push(S.region);
  (S.help||[]).slice(0,3).forEach(h=>o.push(h));if((S.give||[]).length&&!has("give","כרגע לא, אולי בהמשך"))o.push("מביא/ה: "+S.give[0]);return o}

let cur=0,hist=[];
const visible=()=>SCREENS.filter(s=>!s.show||s.show());
function draw(){
  const s=SCREENS[cur],el=$("#screen");
  el.className="screen "+(s.cls||"");el.innerHTML=s.render()+((s.st>=0&&s.st<5)?`<p class="err" id="err"></p><div class="cta">
    <button class="go" type="button" data-next>${s.id==="send"?"שליחה":"המשך"}</button>${s.optional?`<button class="skip" type="button" data-skip>דלג</button>`:""}</div>`:"");
  // trail
  const top=$("#top");top.hidden=s.st<0||s.st>4;
  const tr=$("#trail");tr.querySelectorAll(".st").forEach(n=>n.remove());
  STATIONS.forEach((n,i)=>{const d=document.createElement("div");d.className="st"+(i<s.st?" done":"")+(i===s.st?" on":"");d.innerHTML=`<i>${i<s.st?"✓":""}</i><span>${n}</span>`;tr.appendChild(d)});
  $("#fill").style.width=`calc(${Math.max(0,s.st)/4*100}% - ${Math.max(0,s.st)/4*18}px)`;
  const vis=visible(),left=vis.length-1-vis.indexOf(s);
  $("#eta").textContent=left>1?`עוד ~${Math.max(1,Math.round(left*12/60))} דק׳`:"כמעט";
  $("#back").disabled=!hist.length;
  if(s.bind)s.bind();
  const f=el.querySelector("input:not([type=range]):not([type=file]),select,textarea");if(f&&!matchMedia("(hover:none)").matches)f.focus({preventScroll:true});
  window.scrollTo(0,0)}
function next(skip){
  const s=SCREENS[cur];
  if(!skip&&s.ok){const r=s.ok();if(r!==true){const e=$("#err");if(e)e.textContent=r||"חסר משהו";return}}
  if(s.save)s.save();
  if(s.id==="send")return submit();
  hist.push(cur);
  do{cur++}while(cur<SCREENS.length-1&&SCREENS[cur].show&&!SCREENS[cur].show());
  draw()}
function payload(){const m=S.month==="חודש אחר"?(S.monthX||""):(S.month||"");const pl=PLUGOT.includes(S.conn);
  return {form:FORM_ID,version:1,submitted_at:new Date().toISOString(),ref:REF,
   first_name:S.first||"",last_name:S.last||"",phone:S.phone||"",email:S.email||"",region:S.region||"",
   connection:S.conn||"",fallen_name:S.conn==="משפחה שכולה"?(S.fallen||""):"",fallen_relation:S.conn==="משפחה שכולה"?(S.relation||""):"",
   enlist_year:pl?S.year:null,enlist_month:pl?m:"",last_role:pl?(S.role||""):"",commander:pl?(S.mpkz||""):"",
   status:S.status,study_institution:has("status","סטודנט/ית")?(S.inst||""):"",study_field:has("status","סטודנט/ית")?(S.deg||""):"",study_year:has("status","סטודנט/ית")?(S.syear||""):"",scholars_interest:!!S.scholars,
   work_field:S.field||"",work_role:S.job||"",work_experience:S.exp||"",
   interests:S.help,memorial_fallen:has("help","הנצחה ואירועי זיכרון")?(S.fallen2||""):"",memorial_assign:!!S.assign,
   personal:S.personal,knows:S.knows,personal_contact:S.pnote||"",
   give:S.give,fundraising:S.fund,volunteer_areas:S.areas,offer:S.offer||"",idea:S.idea||"",platforms:S.platforms,
   selfie_jpeg:S.photo||"",consent:!!S.consent}}
let sending=false;
async function submit(){
  const er=$("#err"),go=document.querySelector("[data-next]");
  if(!ENDPOINT){er.textContent="הטופס עוד לא מחובר למערכת. נסו שוב בקרוב, או כתבו לנו: sayeret.nahal@gmail.com";return}
  if(sending)return;sending=true;go.disabled=true;go.textContent="שולח…";er.textContent="";
  try{const r=await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload())});
    if(!r.ok)throw new Error(r.status);hist.push(cur);cur=SCREENS.findIndex(x=>x.id==="done");draw()}
  catch(_){er.textContent="השליחה לא הצליחה. בדקו את החיבור לאינטרנט ונסו שוב.";go.disabled=false;go.textContent="שליחה"}
  finally{sending=false}}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.hasAttribute("data-next"))return next(false);
  if(b.hasAttribute("data-skip"))return next(true);
  if(b.id==="back"){if(SCREENS[cur].save)try{SCREENS[cur].save()}catch(_){}cur=hist.pop();return draw()}
  if(b.dataset.toggle){S[b.dataset.toggle]=!S[b.dataset.toggle];b.setAttribute("aria-pressed",S[b.dataset.toggle]);return}
  const k=b.dataset.key;if(!k)return;const v=b.dataset.val;
  if(b.dataset.multi==="1"){S[k]=S[k]||[];const i=S[k].indexOf(v);i<0?S[k].push(v):S[k].splice(i,1);
    const NOW="כרגע לא, אולי בהמשך";
    if(k==="give"&&i<0)S.give=v===NOW?[NOW]:S.give.filter(x=>x!==NOW);
    document.querySelectorAll(`[data-key="${k}"]`).forEach(x=>x.setAttribute("aria-pressed",S[k].includes(x.dataset.val)))}
  else{S[k]=v;document.querySelectorAll(`[data-key="${k}"]`).forEach(x=>x.setAttribute("aria-pressed",x.dataset.val===v));
    const s=SCREENS[cur];if(s.auto&&!b.dataset.chip){setTimeout(()=>next(false),220)}}
  const s=SCREENS[cur];if(s.onChip)s.onChip();const er=$("#err");if(er)er.textContent=""});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.tagName!=="TEXTAREA"&&e.target.tagName!=="BUTTON"){e.preventDefault();next(false)}});
draw();
</script>
