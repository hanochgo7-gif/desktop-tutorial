<title>מנוע הלקוחות של צחיל'ה</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Suez+One&family=Assistant:wght@400;600;700;800&family=IBM+Plex+Sans+Hebrew:wght@500;600&display=swap">
<style>
/* Layout: an operator's console. Sticky top bar, one working column per view, a side drawer for the lead card; bottom tab bar on phones. Same market-crate identity as the plan page. */
:root{
  --bg:#f3f6ee;
  --surface:#ffffff;
  --surface-2:#f8faf5;
  --fg:#16211a;
  --muted:#5a6a5e;
  --line:#dbe3d5;
  --leaf:#2f6b3c;
  --leaf-soft:#e2eddd;
  --accent:#d9572a;
  --accent-soft:#fbe6da;
  --hot:#d9572a;
  --warm:#b7791f;
  --cold:#5c7a8a;
  --ok:#2f7d4a;
  --danger:#b4232c;
  --danger-soft:#fbe3e4;
  --shadow:0 1px 2px rgba(22,33,26,.06),0 6px 20px rgba(22,33,26,.06);
  --display:"Suez One","Assistant",serif;
  --body:"Assistant","Segoe UI",Arial,sans-serif;
  --data:"IBM Plex Sans Hebrew","Assistant",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1511;--surface:#161e18;--surface-2:#1b241d;--fg:#e6ede2;--muted:#9fb0a2;--line:#2a372d;
    --leaf:#84c690;--leaf-soft:#1e2d21;--accent:#f08a54;--accent-soft:#3a2418;--hot:#f08a54;--warm:#e0b04f;--cold:#8fb0c2;
    --ok:#7fcf98;--danger:#f2777e;--danger-soft:#3a1a1c;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1511;--surface:#161e18;--surface-2:#1b241d;--fg:#e6ede2;--muted:#9fb0a2;--line:#2a372d;
  --leaf:#84c690;--leaf-soft:#1e2d21;--accent:#f08a54;--accent-soft:#3a2418;--hot:#f08a54;--warm:#e0b04f;--cold:#8fb0c2;
  --ok:#7fcf98;--danger:#f2777e;--danger-soft:#3a1a1c;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
#app{direction:rtl;min-height:100%}
h1,h2,h3{margin:0;font-weight:400;line-height:1.25;text-wrap:balance}
h2{font-family:var(--display);font-size:24px}
h3{font-size:17px;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--data);font-variant-numeric:tabular-nums}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand b{font-family:var(--display);font-weight:400;font-size:22px;color:var(--leaf)}
.brand span{font-size:14px;color:var(--muted);white-space:nowrap}
.tabs{display:flex;gap:4px;margin-inline-start:12px}
.tab{border:0;background:none;padding:7px 12px;border-radius:8px;color:var(--muted);font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.tab:hover{background:var(--surface-2);color:var(--fg)}
.tab[aria-current="page"]{background:var(--leaf-soft);color:var(--leaf)}
.tab .badge{font-family:var(--data);font-size:12px;background:var(--accent);color:var(--surface);border-radius:999px;padding:0 6px;line-height:18px}
.spacer{flex:1}
.mode{font-family:var(--data);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap}
.mode.cloud{color:var(--ok);border-color:currentColor}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  border-radius:8px;padding:7px 12px;font-weight:700;font-size:14.5px;cursor:pointer;text-decoration:none;color:var(--fg);
  transition:background .15s,border-color .15s,transform .08s;white-space:nowrap;min-height:38px}
.btn:hover{border-color:var(--leaf)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--leaf);border-color:var(--leaf);color:var(--surface)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:4px 9px;min-height:32px;font-size:13.5px}
.btn.danger{color:var(--danger);border-color:var(--danger-soft)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn svg{width:17px;height:17px;flex:none}
.iconbtn{border:0;background:none;padding:8px;border-radius:8px;cursor:pointer;color:var(--muted);display:inline-flex}
.iconbtn:hover{background:var(--surface-2);color:var(--fg)}
.iconbtn svg{width:20px;height:20px}

/* layout */
main#view{max-width:1180px;margin:0 auto;padding-block:20px 120px;display:grid;gap:20px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.vh p{color:var(--muted);font-size:14.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.pad{padding:16px}
.card.pad{align-content:start}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.sec-t{font-family:var(--data);font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--muted);display:flex;align-items:center;gap:8px}
.sec-t .c{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:0 8px}

/* banners */
.banner{max-width:1180px;margin:12px auto 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-radius:10px;padding:10px 14px;font-size:14.5px;
  margin-left:max(16px,env(safe-area-inset-left,0px));margin-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:1212px){.banner{margin-left:auto;margin-right:auto}}
.banner.info{background:var(--leaf-soft)}
.banner.warn{background:var(--accent-soft)}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:2px}
.kpi span{font-size:13px;color:var(--muted)}
.kpi b{font-family:var(--data);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi b.alert{color:var(--accent)}
.kpi small{font-size:12.5px;color:var(--muted)}

/* focus card */
.focus{background:var(--fg);color:var(--bg);border-radius:14px;padding:18px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.focus .k{font-family:var(--data);font-size:12.5px;opacity:.75;letter-spacing:.04em}
.focus h3{font-family:var(--display);font-weight:400;font-size:21px}
.focus p{opacity:.85;font-size:15px;max-width:62ch}
.focus .grow{flex:1;min-width:240px;display:grid;gap:4px}
.focus .btn{background:var(--accent);border-color:var(--accent);color:#fff}

/* action cards */
.acts{display:grid;gap:10px}
.act{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:grid;grid-template-columns:1fr auto;gap:10px 16px;padding:12px 14px;align-items:center;
  transition:box-shadow .15s,border-color .15s}
.act:hover{box-shadow:var(--shadow)}
.act.over{border-inline-start:4px solid var(--accent)}
.act-main{min-width:0;cursor:pointer;display:grid;gap:3px}
.act-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.act-top b{font-size:16.5px}
.act-type{font-weight:600}
.act-meta{font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.act-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.outcomes{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:10px}
.due.over{color:var(--accent);font-weight:700}
.due.today{color:var(--leaf);font-weight:700}
@media (max-width:640px){.act{grid-template-columns:1fr}.act-actions{justify-content:flex-start}}

/* pills */
.pill{font-family:var(--data);font-size:12px;border-radius:999px;padding:1px 9px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.s-touched{color:var(--cold);border-color:currentColor}
.pill.s-talk{color:var(--warm);border-color:currentColor}
.pill.s-trial{color:var(--accent);border-color:currentColor}
.pill.s-client{color:var(--ok);border-color:currentColor;background:var(--leaf-soft)}
.pill.s-lost{opacity:.7}
.pill.ex{border-style:dashed}
.temp{display:inline-flex;align-items:center;gap:5px;font-family:var(--data);font-size:12.5px;font-weight:600}
.temp i{width:8px;height:8px;border-radius:50%;display:inline-block}
.temp.hot{color:var(--hot)}.temp.hot i{background:var(--hot)}
.temp.warm{color:var(--warm)}.temp.warm i{background:var(--warm)}
.temp.cold{color:var(--cold)}.temp.cold i{background:var(--cold)}

/* pipeline */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px;align-content:start;scroll-snap-align:start;min-height:200px}
.col-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:2px 4px 6px;border-bottom:1px solid var(--line)}
.col-h b{font-size:15px}
.col-h span{font-family:var(--data);font-size:12.5px;color:var(--muted)}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;display:grid;gap:3px;cursor:pointer;text-align:start;width:100%}
.mini:hover{border-color:var(--leaf)}
.mini b{font-size:15px}
.mini .row{display:flex;justify-content:space-between;gap:6px;font-size:12.5px;color:var(--muted)}
.empty-col{font-size:13px;color:var(--muted);padding:8px 4px}

/* leads list */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search]{flex:1;min-width:180px}
.field{display:grid;gap:4px;min-width:0}
.field label,.lbl{font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=search],input[type=tel],input[type=email],input[type=number],input[type=date],input[type=url],select,textarea{
  width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-height:38px;font-size:15px}
textarea{min-height:90px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid var(--leaf);outline-offset:0;border-color:transparent}
.toolbar select{width:auto}
.rows{display:grid;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.rowh,.rowl{display:grid;grid-template-columns:minmax(150px,2fr) 70px minmax(110px,1.2fr) minmax(110px,1.2fr) 110px 80px minmax(130px,1.3fr);gap:10px;align-items:center;padding:10px 14px}
.rowh{font-family:var(--data);font-size:12.5px;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--line)}
.rowl{border-bottom:1px solid var(--line);cursor:pointer;font-size:14.5px}
.rowl:last-child{border-bottom:0}
.rowl:hover{background:var(--surface-2)}
.rowl .co{display:grid;min-width:0}
.rowl .co b,.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowl .co small{color:var(--muted);font-size:12.5px}
@media (max-width:860px){
  .rowh{display:none}
  .rowl{grid-template-columns:1fr auto;gap:2px 10px}
  .rowl>:nth-child(n+2){font-size:13px;color:var(--muted)}
  .rowl>.c-emp,.rowl>.c-zone,.rowl>.c-src{display:none}
  .rowl>.c-stage{grid-row:1;grid-column:2}
  .rowl>.c-score{grid-column:2}
  .rowl>.c-next{grid-column:1;grid-row:2}
}

/* empty states */
.empty{text-align:center;padding:36px 20px;display:grid;gap:10px;justify-items:center}
.empty h3{font-family:var(--display);font-weight:400;font-size:22px}
.empty p{color:var(--muted);max-width:52ch}
.skel{height:64px;border-radius:12px;background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sk 1.2s infinite linear;border:1px solid var(--line)}
@keyframes sk{to{background-position:-200% 0}}

/* field view */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:var(--surface)}
.chip .c{font-family:var(--data);font-size:12px;opacity:.8}
.visit{display:flex;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.visit:last-child{border-bottom:0}
.visit input{width:20px;height:20px;accent-color:var(--leaf);flex:none}
.visit label{flex:1;min-width:0;display:grid;cursor:pointer}
.visit small{color:var(--muted)}
.bld{font-family:var(--data);font-size:12.5px;color:var(--muted);background:var(--surface-2);padding:6px 14px;border-bottom:1px solid var(--line)}
.stickybar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow)}
@media (min-width:761px){.stickybar{bottom:16px}}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.opp{display:grid;gap:8px}
.opp-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14.5px}

/* data view */
.funnel{display:grid;gap:8px}
.fstep{display:grid;grid-template-columns:110px 1fr 70px;gap:10px;align-items:center;font-size:14.5px}
.fbar{height:26px;background:var(--surface-2);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.fbar i{display:block;height:100%;background:var(--leaf);border-radius:5px;min-width:2px}
.fconv{font-family:var(--data);font-size:12.5px;color:var(--muted);padding-inline-start:120px}
.fconv.bad{color:var(--accent);font-weight:600}
.callout{border-radius:10px;padding:12px 14px;background:var(--accent-soft);font-size:15px}
.callout b{color:var(--accent)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px;min-width:620px}
th,td{text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--data);font-size:12.5px;color:var(--muted);font-weight:600}
td.n,th.n{font-family:var(--data);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}

/* drawer */
#scrim{position:fixed;inset:0;background:rgba(10,16,12,.38);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(560px,100%);z-index:50;background:var(--bg);box-shadow:var(--shadow);
  transform:translateX(-104%);transition:transform .24s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;direction:rtl}
#drawer.on{transform:none}
.dh{display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.dh h2{flex:1;min-width:0;font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.db{overflow-y:auto;padding:16px;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));display:grid;gap:16px;align-content:start;flex:1}
.stepper{display:flex;flex-wrap:wrap;gap:4px}
.stepper button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.stepper button[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:var(--surface)}
.stepper button.lost[aria-pressed="true"]{background:var(--muted);border-color:var(--muted)}
.why{display:flex;flex-wrap:wrap;gap:6px}
.why span{font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.why span b{font-family:var(--data);font-weight:600;margin-inline-end:4px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid .full{grid-column:1/-1}
@media (max-width:440px){.fgrid{grid-template-columns:1fr}}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.checks label{display:flex;gap:6px;align-items:center;font-size:14.5px;cursor:pointer}
.checks input{width:17px;height:17px;accent-color:var(--leaf)}
.next{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}
.timeline{display:grid;gap:8px}
.tl{font-size:14px;display:grid;gap:2px;border-inline-start:2px solid var(--line);padding-inline-start:10px}
.tl small{color:var(--muted);font-family:var(--data);font-size:12px}
.tl.system{color:var(--muted)}
.tl.ai{border-color:var(--accent)}
.aibox{border:1px solid var(--accent);border-radius:12px;padding:12px;display:grid;gap:8px;background:var(--surface)}
.aibox .k{font-family:var(--data);font-size:12.5px;color:var(--accent);font-weight:600;display:flex;align-items:center;gap:6px}
.aibox .k svg{width:16px;height:16px}
.prop{display:flex;gap:8px;align-items:flex-start;font-size:14.5px}
.prop input{margin-top:4px;width:17px;height:17px;accent-color:var(--leaf);flex:none}
.copyrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.copyrow code{font-family:var(--data);font-size:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:4px 8px;word-break:break-all;flex:1;min-width:0}

/* bottom nav */
.bottomnav{display:none}
@media (max-width:760px){
  .tabs{display:none}
  .brand span{display:none}
  .bottomnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .bottomnav button{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:8px 2px 9px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
  .bottomnav button svg{width:22px;height:22px}
  .bottomnav button[aria-current="page"]{color:var(--leaf)}
  .bottomnav .badge{position:absolute;top:4px;left:calc(50% - 20px);font-family:var(--data);font-size:11px;background:var(--accent);color:var(--surface);border-radius:999px;padding:0 5px;line-height:16px}
  .hide-sm{display:none}
}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:60;background:var(--fg);color:var(--bg);
  border-radius:10px;padding:10px 14px;display:flex;gap:12px;align-items:center;font-size:14.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;direction:rtl;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:none;border:0;color:var(--accent);font-weight:800;cursor:pointer;padding:2px 4px}
@media (min-width:761px){#toast{bottom:24px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>

<div id="app" dir="rtl" lang="he">
  <header class="topbar">
    <div class="topbar-in">
      <div class="brand"><b>צחיל'ה</b><span>מנוע לקוחות לעסקים</span></div>
      <nav class="tabs" id="tabs" aria-label="תצוגות"></nav>
      <div class="spacer"></div>
      <span class="mode hide-sm" id="mode"></span>

async function init(){
  render();
  const c=window.claude;
  if(!c||typeof c.use!=='function'){startLocal();return}
  const timer=setTimeout(()=>{if(!S.loaded){S.stale=true;render()}},10000);
  try{db=await c.use('db')}catch(e){db=null}
  if(!db){clearTimeout(timer);startLocal();return}
  S.mode='cloud';render();
  c.use('user').then(async u=>{if(u&&typeof u.canEdit==='function'){try{if(await u.canEdit()===false){S.canWrite=false;render()}}catch(e){}}}).catch(()=>{});
  db.collection('leads').onSnapshot(snap=>{
    if(!snap.metadata.fromCache){clearTimeout(timer);S.stale=false}
    S.leads=new Map(snap.docs.filter(d=>d.exists).map(d=>[d.id,norm(d.data(),d.id)]));
    S.loaded=true;render({sync:true});refreshDrawer();
  },err=>{clearTimeout(timer);S.loaded=true;S.loadError=err&&err.code||'unavailable';render()});
  db.doc('settings/main').onSnapshot(d=>{S.settings=normSettings(d.exists?d.data():{});render({sync:true})},()=>{});
}
async function getSample(){
  if(sampleFn!==undefined) return sampleFn;
  try{sampleFn=window.claude&&window.claude.use?await window.claude.use('sample'):null}catch(e){sampleFn=null}
  return sampleFn;
}

/* ---------- toast with undo ---------- */
function toast(msg,undo){
  const t=$('#toast');undoFn=undo||null;
  t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button type="button" data-act="undo">ביטול</button>':''}`;
  t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.classList.remove('on');undoFn=null},undo?6000:3200);
}

/* ---------- derived ---------- */
const all=()=>[...S.leads.values()];
const byScore=(a,b)=>score(b).s-score(a).s;
function reachedIndex(l){let i=ORDER.indexOf(l.stage);for(const h of l.history)i=Math.max(i,ORDER.indexOf(h.stage));return i}
function metrics(){
  const L=all(),t=today();
  const clients=L.filter(l=>l.stage==='client');
  const mrr=clients.reduce((s,l)=>s+monthlyValue(l),0);
  const b2cMrr=clients.reduce((s,l)=>s+(l.b2c||0)*S.settings.empSpend,0);
  const open=L.filter(l=>PROB[l.stage]);
  const weighted=open.reduce((s,l)=>s+PROB[l.stage]*expectedMonthly(l),0);
  const overdue=L.filter(l=>l.nextAt&&l.nextAt<t);
  const dueToday=L.filter(l=>l.nextAt===t);
  const trialsEnding=L.filter(l=>l.stage==='trial'&&l.nextAt&&diffDays(l.nextAt,t)<=7);
  const cycle=clients.map(l=>{const c=l.history.find(h=>h.stage==='client');return c?diffDays(c.at.slice(0,10),l.createdAt.slice(0,10)):null}).filter(v=>v!==null&&v>=0);
  return {L,clients,mrr,b2cMrr,weighted,overdue,dueToday,trialsEnding,avgCycle:cycle.length?Math.round(cycle.reduce((a,b)=>a+b,0)/cycle.length):null};
}
function funnelData(){
  const reached=ORDER.map(()=>0);
  for(const l of all()){const i=reachedIndex(l);for(let k=0;k<=i;k++)reached[k]++}
  const steps=ORDER.map((id,i)=>({id,n:reached[i],conv:i&&reached[i-1]?reached[i]/reached[i-1]:null,bench:BENCH[i]}));
  let worst=null;
  for(let i=1;i<steps.length;i++){const st=steps[i];if(reached[i-1]>=5&&st.conv!==null&&st.conv<st.bench){const gap=st.conv/st.bench;if(!worst||gap<worst.gap)worst={i,gap}}}
  return {steps,worst};
}

function channelRows(){
  const rows={};
  for(const k of Object.keys(SOURCES)) rows[k]={k,n:0,talk:0,trial:0,clients:0,mrr:0,spend:num(S.settings.spend&&S.settings.spend[k])};
  for(const l of all()){const r=rows[l.source];r.n++;const i=reachedIndex(l);if(i>=2)r.talk++;if(i>=3)r.trial++;if(l.stage==='client'){r.clients++;r.mrr+=monthlyValue(l)}}
  return Object.values(rows).filter(r=>r.n||r.spend).sort((a,b)=>b.mrr-a.mrr||b.n-a.n);
}
function focusAction(m){
  const t=today();
  if(m.trialsEnding.length){const v=m.trialsEnding.reduce((s,l)=>s+expectedMonthly(l),0);
    const one=m.trialsEnding.length===1;
    return {k:'הכי חשוב עכשיו',h:one?'שבוע ניסיון אחד מסתיים השבוע':`${m.trialsEnding.length} שבועות ניסיון מסתיימים השבוע`,p:`השיחה ביום החמישי היא הרגע שבו נסגרת עסקה. ${one?'הוא שווה':'ביחד הם שווים'} בערך ${money(v)} בחודש.`,btn:'לשיחות',act:'goto-trials'}}
  if(m.overdue.length) return {k:'הכי חשוב עכשיו',h:`${m.overdue.length} פעולות באיחור`,p:'כל יום של איחור מוריד את הסיכוי לסגור. התחילו מהלידים החמים ביותר.',btn:'לפעולות',act:'scroll-acts'};
  const zones={};for(const l of all())if(l.stage==='target'&&l.zone)zones[l.zone]=(zones[l.zone]||0)+1;
  const top=Object.entries(zones).sort((a,b)=>b[1]-a[1])[0];
  if(top&&top[1]>=5) return {k:'הצעד הבא',h:`${top[1]} יעדים ב${top[0]} עוד לא קיבלו סלסלה`,p:'בוקר אחד של ביקורים באזור אחד = 15–20 משרדים. המערכת תקבע לכל אחד שיחת מעקב אחרי 48 שעות.',btn:'לתכנון הסיור',act:'goto-field',zone:top[0]};
  const days=diffDays(TU_BISHVAT,t);
  if(days>7&&days<=90) return {k:'חלון מכירה',h:`עוד ${days} ימים לט״ו בשבט במשרדים`,p:'כל משרד קונה משהו לט״ו בשבט. זו ההזמנה הכי קלה לקבל, והדלת למנוי. כדאי לסגור הזמנות עד שבוע לפני.',btn:'להוסיף יעדים',act:'import'};
  if(!all().length) return null;
  return {k:'הצעד הבא',h:'להגדיל את רשימת היעדים',p:'צנרת בריאה מתחילה מ־300 משרדים ברשימה. אפשר להדביק רשימה שלמה בבת אחת.',btn:'לייבוא רשימה',act:'import'};
}

function filtered(){
  const f=S.filters,q=f.q.trim().toLowerCase();
  let L=all().filter(l=>{
    if(f.stage==='open'&&(l.stage==='client'||l.stage==='lost'))return false;
    if(f.stage!=='open'&&f.stage!=='all'&&l.stage!==f.stage)return false;
    if(f.source!=='all'&&l.source!==f.source)return false;
    if(f.zone!=='all'&&l.zone!==f.zone)return false;
    if(q&&!(l.company+' '+l.contact+' '+l.phone+' '+l.building+' '+l.zone).toLowerCase().includes(q))return false;
    return true;});
  const s={score:byScore,next:(a,b)=>(a.nextAt||'9').localeCompare(b.nextAt||'9'),new:(a,b)=>b.createdAt.localeCompare(a.createdAt),size:(a,b)=>b.employees-a.employees}[f.sort]||byScore;
  return L.sort(s);
}

function viewField(){
  if(!S.loaded) return skeleton();
  const L=all();
  const zones=[...new Set([...S.settings.zones,...L.map(l=>l.zone).filter(Boolean)])];
  const cnt=z=>L.filter(l=>l.zone===z&&l.stage==='target').length;
  if(!S.fieldZone){S.fieldZone=zones.slice().sort((a,b)=>cnt(b)-cnt(a))[0]||null}
  const z=S.fieldZone;
  const targets=L.filter(l=>l.zone===z&&l.stage==='target').sort((a,b)=>(a.building||'ת').localeCompare(b.building||'ת','he')||byScore(a,b));
  const groups={};for(const l of targets){(groups[l.building||'ללא בניין']=groups[l.building||'ללא בניין']||[]).push(l)}

  const bmap={};for(const l of L){if(!l.building)continue;const k=(l.zone||'')+'|'+l.building.trim();(bmap[k]=bmap[k]||[]).push(l)}

function openDrawer(d){if(!S.drawer)S.opener=document.activeElement;S.drawer=d;$('#drawer').inert=false;S.confirmDel=false;if(!S.ai||!d||S.ai.id!==d.id){if(S.ai&&S.ai.ctl)S.ai.ctl.abort();S.ai=null}renderDrawer();$('#drawer').classList.add('on');$('#drawer').setAttribute('aria-hidden','false');$('#scrim').classList.add('on');
  setTimeout(()=>{const f=$('#drawer [autofocus]')||$('#drawer .iconbtn');f&&f.focus()},60)}
function closeDrawer(){if(S.ai&&S.ai.ctl&&S.ai.busy)S.ai.ctl.abort();S.drawer=null;S.ai=null;$('#drawer').classList.remove('on');$('#drawer').setAttribute('aria-hidden','true');$('#drawer').inert=true;$('#scrim').classList.remove('on');
  const o=S.opener;S.opener=null;if(o&&document.contains(o))o.focus()}
function refreshDrawer(){if(!S.drawer)return;if(S.drawer.kind==='lead'&&!S.leads.has(S.drawer.id)){closeDrawer();return}if(!$('#drawer').contains(document.activeElement)||document.activeElement.tagName==='BUTTON')renderDrawer()}
function renderDrawer(){
  const d=S.drawer,el=$('#drawer');if(!d){el.innerHTML='';return}
  let title='',body='';
  if(d.kind==='new'){title='ליד חדש';body=drawerNew()}
  else if(d.kind==='import'){title='ייבוא לידים';body=drawerImport()}
  else{const l=S.leads.get(d.id);if(!l)return;title=l.company||'ללא שם';body=drawerLead(l)}
  el.innerHTML=`<div class="dh"><h2 id="d-title">${esc(title)}</h2><button class="iconbtn" data-act="close" aria-label="סגירה">${IC.x}</button></div><div class="db">${body}</div>`;
}

function buildProps(l,o){

  const e=Number(o.employees);if(Number.isFinite(e)&&e>0&&e<100000&&e!==l.employees) p.push({label:`מספר עובדים: ${e}`,apply:x=>{x.employees=Math.round(e)}});

  const pains=arr(o.pains).map(str).filter(v=>v&&!l.pains.includes(v)).slice(0,6);if(pains.length) p.push({label:`כאבים: ${pains.join(', ')}`,apply:x=>{x.pains=[...x.pains,...pains].slice(-12)}});
  const obj=arr(o.objections).map(str).filter(v=>v&&!l.objections.includes(v)).slice(0,6);if(obj.length) p.push({label:`התנגדויות: ${obj.join(', ')}`,apply:x=>{x.objections=[...x.objections,...obj].slice(-12)}});
  const ints=arr(o.interest).filter(k=>INTERESTS[k]&&!l.interest.includes(k));if(ints.length) p.push({label:`מתעניינים ב: ${ints.map(k=>INTERESTS[k]).join(', ')}`,apply:x=>{x.interest=[...x.interest,...ints]}});
  const st=STAGES.some(s=>s.id===o.suggestedStage)?o.suggestedStage:null;
  const ts=typeof o.trialStart==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(o.trialStart)?o.trialStart:null;
  if(st&&st!==l.stage) p.push({label:`להעביר לשלב: ${stageLabel(st)}${st==='trial'&&ts?` (מתחיל ב־${dm(ts)})`:''}`,apply:x=>{setStage(x,st,{trialStart:ts||undefined})},order:1});
  const nd=Number(o.nextInDays);
  if(str(o.nextAction)) p.push({label:`פעולה הבאה: ${o.nextAction}${Number.isFinite(nd)?` · ${relDay(due(Math.max(0,Math.min(90,nd)))).t}`:''}`,apply:x=>{x.nextType=str(o.nextAction);if(Number.isFinite(nd))x.nextAt=due(Math.max(0,Math.min(90,Math.round(nd))))},order:2});
  return p.sort((a,b)=>(a.order||0)-(b.order||0));
}

/* ---------- import / export ---------- */
function parseCSV(text){
  text=String(text).replace(/^\ufeff/,'');
  const rows=[];let row=[],cell='',q=false;
  const sep=text.split('\n')[0].includes('\t')&&!text.split('\n')[0].includes(',')?'\t':',';
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"')q=true;else if(c===sep){row.push(cell);cell=''}else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell=''}else if(c!=='\r')cell+=c}
  if(cell||row.length){row.push(cell);rows.push(row)}
  return rows.map(r=>r.map(c=>c.trim())).filter(r=>r.some(Boolean));
}
const HMAP={company:['company','חברה','שם החברה'],contact:['contact','name','שם','איש קשר'],phone:['phone','טלפון'],email:['email','אימייל','מייל'],
  employees:['employees','עובדים','מספר עובדים'],zone:['zone','city','אזור','עיר'],building:['building','בניין','כתובת'],source:['source','מקור'],
  referrer:['ref','referrer','מפנה'],interest:['interest','התעניינות'],consent:['consent','הסכמה'],role:['role','תפקיד'],createdAt:['createdat','תאריך'],
  stage:['stage'],nextType:['nexttype'],nextAt:['nextat'],tier:['tier'],weekly:['weekly'],b2c:['b2c'],campaign:['utm_campaign'],variant:['variant'],supplier:['supplier']};
function importText(text,defSource,defZone){
  const rows=parseCSV(text);if(!rows.length)return {leads:[],skipped:0};
  const head=rows[0].map(h=>h.toLowerCase());
  const idx={};for(const [k,names] of Object.entries(HMAP)){const i=head.findIndex(h=>names.includes(h));if(i>=0)idx[k]=i}
  const hasHead=idx.company!==undefined;
  const body=hasHead?rows.slice(1):rows;
  const existing=new Set(all().flatMap(l=>[l.company.trim().toLowerCase(),waPhone(l.phone)].filter(Boolean)));
  const out=[];let skipped=0;
  for(const r of body){
    const get=k=>hasHead?(idx[k]!==undefined?r[idx[k]]||'':''):'';
    let d;
    if(hasHead){
      const src=get('source');
      const fromLanding=idx.variant!==undefined;
      const st=STAGES.some(x=>x.id===get('stage'))?get('stage'):'target';
      d={company:get('company'),contact:get('contact'),role:get('role'),phone:get('phone'),email:isEmail(get('email'))?get('email'):'',employees:num(get('employees')),zone:get('zone')||defZone,
        building:get('building'),source:SOURCES[src]?src:(get('referrer')?'b2c':(fromLanding?'landing':defSource)),referrer:get('referrer'),supplier:get('supplier'),
        interest:get('interest').split(/[,|;\s]+/).filter(k=>INTERESTS[k]),consent:/^(true|yes|כן|1)$/i.test(get('consent')),
        stage:st,tier:get('tier'),weekly:num(get('weekly')),b2c:num(get('b2c')),nextType:get('nextType'),nextAt:/^\d{4}-\d{2}-\d{2}$/.test(get('nextAt'))?get('nextAt'):'',
        createdAt:!isNaN(Date.parse(get('createdAt')))?new Date(get('createdAt')).toISOString():'',_landing:fromLanding,_campaign:get('campaign')};
    }else{
      const [company,emp,phone,...rest]=r;
      const tail=rest.join(', ').trim();
      const known=[...new Set([...S.settings.zones,...all().map(l=>l.zone).filter(Boolean)])].sort((a,b)=>b.length-a.length);
      const kz=known.find(z=>tail===z||tail.startsWith(z+','));
      const zone=kz||(rest[0]||'').trim();
      const building=kz?tail.slice(kz.length).replace(/^,\s*/,''):rest.slice(1).join(', ').trim();
      d={company,employees:num(emp),phone:phone||'',zone:zone||defZone,building,source:defSource};
    }
    if(!d.company){skipped++;continue}
    const k1=d.company.trim().toLowerCase(),k2=waPhone(d.phone);
    if(existing.has(k1)||(k2&&existing.has(k2))){skipped++;continue}
    existing.add(k1);if(k2)existing.add(k2);
    const stage=d.stage||'target',created=d.createdAt||nowISO();
    const l=norm({...d,stage,history:[{stage,at:created}],nextAt:d.nextAt||(stage==='lost'?due(60):today()),createdAt:created},newId());
    if(!d.nextType)l.nextType=NEXT[stage].type;
    addNote(l,d._landing?'נכנס מדף הנחיתה':'יובא מרשימה','system');
    if(d._campaign)addNote(l,'קמפיין: '+d._campaign,'system');
    if(d._landing){l.nextType='לחזור מהר: השאירו פרטים בדף הנחיתה';l.lastTouchAt=created}
    out.push(l);
  }
  return {leads:out,skipped};
}
async function runImport(){
  const text=$('#imp-text').value,src=$('#imp-source').value,zone=$('#imp-zone').value.trim();
  const msg=$('#imp-msg');

  if(!leads.length){msg.textContent=skipped?`לא נוספו לידים: ${skipped} שורות כבר קיימות או בלי שם חברה.`:'לא נמצאו שורות לייבוא.';return}
  msg.textContent=`מייבא ${leads.length} לידים...`;
  for(const l of leads) S.leads.set(l.id,l);
  render();
  if(S.mode==='cloud'){
    let i=0;const worker=async()=>{while(i<leads.length){const l=leads[i++];await enqueue(l.id,()=>writeDoc(db.collection('leads').doc(l.id),serialize(l))).catch(writeErr)}};
    await Promise.all([worker(),worker(),worker()]);

  closeDrawer();toast(`${leads.length===1?'נוסף ליד אחד':`נוספו ${leads.length} לידים`}${skipped?(skipped===1?' · כפול אחד דולג':` · ${skipped} כפולים דולגו`):''}`);
}

async function exportCSV(){
  const cols=['company','contact','role','phone','email','employees','zone','building','source','referrer','supplier','interest','stage','nextType','nextAt','tier','weekly','b2c','consent','createdAt'];
  const head=[...cols,'שלב','מקור'];
  const lines=[head.join(',')].concat(all().map(l=>[...cols.map(c=>c==='interest'?l.interest.join(' '):l[c]),stageLabel(l.stage),SOURCES[l.source]].map(csvCell).join(',')));
  const data='﻿'+lines.join('\n');
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}
  if(dl){try{await dl.save({filename:`tzahile-leads-${today()}.csv`,data});toast('הקובץ נשמר.')}catch(e){if(e&&e.code!=='declined')toast('לא ניתן לשמור קובץ בתצוגה הזאת.')};return}
  try{await navigator.clipboard.writeText(data.slice(1));toast('אין הורדה בתצוגה הזאת. ה־CSV הועתק ללוח, אפשר להדביק בגיליון.')}catch(e){toast('לא ניתן לייצא בתצוגה הזאת.')}
}

/* ---------- actions ---------- */
function touch(l){l.lastTouchAt=nowISO()}
function outcome(id,kind){
  const l=S.leads.get(id);if(!l)return;const before=clone(l);let msg='';
  if(kind==='advance'){const nx=nextStage(l.stage);setStage(l,nx);touch(l);msg=`${l.company}: ${stageLabel(nx)}. הפעולה הבאה ${relDay(l.nextAt).t}.`}
  else if(kind==='again'){l.nextAt=due(2);addNote(l,'אין מענה, ננסה שוב','system');touch(l);msg='נקבע ניסיון נוסף בעוד יומיים.'}
  else if(kind==='done'){
    if(l.stage==='client'){l.nextAt=due(30);l.nextType='בדיקת שביעות רצון והצעת הרחבה';addNote(l,'בוצע מעקב לקוח','system');touch(l);msg='המעקב הבא בעוד חודש.'}
    else{l.nextAt=due(60);addNote(l,'עדיין לא רלוונטי','system');msg='נחזור אליו בעוד חודשיים.'}}
  else if(kind==='lost'){setStage(l,'lost',{lostReason:'אחר'});msg=`${l.company} הועבר ל"לא כרגע". אפשר לעדכן סיבה בכרטיס.`}
  S.openOutcome=null;persistLead(l);
  toast(msg,()=>{const r=norm(before,id);persistLead(r)});
}
function snooze(id,days){const l=S.leads.get(id);if(!l)return;l.nextAt=workday(addDays(l.nextAt&&l.nextAt>today()?l.nextAt:today(),days));persistLead(l);toast(`נדחה: ${relDay(l.nextAt).t}`)}
function createLead(){
  const v=id=>($('#'+id)||{}).value||'';
  const company=v('n-company').trim();
  if(!company){const e=$('#n-err');e.textContent='צריך לפחות שם חברה.';e.hidden=false;$('#n-company').focus();return}
  const dup=all().find(l=>l.company.trim().toLowerCase()===company.toLowerCase());
  if(dup&&!S.dupOk){const e=$('#n-err');e.innerHTML=`כבר יש ליד בשם הזה. <button class="btn sm" data-open="${dup.id}">לפתוח אותו</button> <button class="btn sm ghost" data-act="dup-ok">להוסיף בכל זאת</button>`;e.hidden=false;return}
  S.dupOk=false;
  const l=norm({company,contact:v('n-contact'),role:v('n-role'),phone:v('n-phone'),employees:num(v('n-employees')),zone:v('n-zone').trim(),building:v('n-building').trim(),
    source:v('n-source'),referrer:v('n-referrer').trim(),interest:$$('[data-ni]').filter(c=>c.checked).map(c=>c.dataset.ni),
    stage:'target',history:[{stage:'target',at:nowISO()}],nextAt:today(),createdAt:nowISO()},newId());
  addNote(l,'ליד נוצר','system');
  persistLead(l);openDrawer({kind:'lead',id:l.id});toast('הליד נשמר. הפעולה הראשונה מתוזמנת להיום.');
}
function saveSettings(){
  const s=S.settings,v=id=>($('#'+id)||{}).value||'';
  s.ownerName=v('s-ownerName').trim().slice(0,60);s.landingUrl=v('s-landingUrl').trim();
  if(s.landingUrl&&!/^https?:\/\//.test(s.landingUrl)){toast('כתובת דף הנחיתה צריכה להתחיל ב־https://');return}
  s.ppe=num(v('s-ppe'))||DEF.ppe;s.margin=Math.min(90,num(v('s-margin'))||DEF.margin);s.empSpend=num(v('s-empSpend'));s.referralCredit=num(v('s-referralCredit'));
  s.zones=v('s-zones').split('\n').map(z=>z.trim()).filter(Boolean).slice(0,30);
  s.spend={};for(const k of Object.keys(SOURCES)){const n=num(v('s-spend-'+k));if(n)s.spend[k]=n}
  S.settingsDirty=false;persistSettings();render();toast('ההגדרות נשמרו.');
}
async function copyText(t,okMsg){try{await navigator.clipboard.writeText(t);toast(okMsg||'הועתק.')}catch(e){toast('לא ניתן להעתיק אוטומטית. סמנו והעתיקו ידנית.')}}
function finishRound(){
  if(!S.canWrite)return;
  const ids=[...S.picked].filter(id=>{const l=S.leads.get(id);return l&&l.stage==='target'&&l.zone===S.fieldZone});
  S.picked.clear();if(!ids.length){render();return}
  const befores=ids.map(id=>clone(S.leads.get(id)));
  for(const id of ids){const l=S.leads.get(id);setStage(l,'touched');addNote(l,'סלסלה וכרטיס נמסרו בסבב ביקורים','note');touch(l);persistLead(l,true)}
  S.picked.clear();render();
  toast(`${ids.length} משרדים עודכנו. שיחות המעקב: ${relDay(due(2)).t}.`,()=>{for(const b of befores)persistLead(norm(b,b.id),true);render()});
}
function updateField(l,f,el){
  if(f==='consent') l.consent=el.checked;
  else if(['employees','weekly','b2c'].includes(f)) l[f]=num(el.value);
  else if(f==='email'){if(el.value&&!isEmail(el.value)){toast('כתובת האימייל לא תקינה.');return}l.email=el.value.trim()}
  else if(f==='trialStart'){l.trialStart=el.value;if(el.value){l.nextAt=addWorkdays(el.value,4)}}
  else if(f==='company'){if(!el.value.trim()){el.value=l.company;return}l.company=el.value.trim()}
  else l[f]=el.value;
  persistLead(l,true);render();
  if(f==='company'||f==='trialStart'||f==='weekly'||f==='b2c')renderDrawerKeepFocus();
}
function renderDrawerKeepFocus(){const a=document.activeElement,id=a&&a.id;renderDrawer();if(id){const e=document.getElementById(id);if(e)e.focus()}}

/* ---------- render ---------- */
function render(opt){
  const keepView=opt&&opt.sync&&S.view==='settings'&&S.settingsDirty;
  const a=document.activeElement,vid=a&&a.id&&$('#view').contains(a)?a.id:null;
  let ss=null,se=null;try{ss=a.selectionStart;se=a.selectionEnd}catch(e){}
  const m=S.loaded?metrics():null,badge=m?m.overdue.length+m.dueToday.length:0;
  const nav=VIEWS.map(v=>`<button class="tab" type="button" data-view="${v.id}" ${S.view===v.id?'aria-current="page"':''}>${v.label}${v.id==='today'&&badge?`<span class="badge">${badge}</span>`:''}</button>`).join('');
  $('#tabs').innerHTML=nav;
  $('#bottomnav').innerHTML=VIEWS.map(v=>`<button type="button" data-view="${v.id}" ${S.view===v.id?'aria-current="page"':''}>${IC[v.ic]}<span>${v.label}</span>${v.id==='today'&&badge?`<span class="badge">${badge}</span>`:''}</button>`).join('');
  const md=$('#mode');md.textContent=S.mode==='cloud'?'מסונכרן':S.mode==='local'?'מקומי בלבד':'טוען';md.className='mode hide-sm'+(S.mode==='cloud'?' cloud':'');
  let ban='';
  if(S.mode==='local') ban=`<div class="banner warn">מצב מקומי: הנתונים נשמרים רק בדפדפן הזה. כדי לסנכרן בין מכשירים ולעבוד עם השותף, פתחו את הדף ב־claude.ai.</div>`;
  else if(!S.canWrite) ban=`<div class="banner warn">אפשר לצפות, אבל אין לכם הרשאת עריכה. בעל הדף יכול לתת הרשאת עורך דרך תפריט השיתוף.</div>`;
  else if(S.loadError) ban=`<div class="banner warn">לא הצלחנו לטעון את הנתונים כרגע. רעננו את הדף בעוד רגע.</div>`;
  else if(S.loaded&&!S.settings.ownerName&&S.view!=='settings') ban=`<div class="banner info">כדי שההודעות המוכנות ייחתמו בשם שלכם, מלאו שם בהגדרות. <button class="btn sm" data-view="settings">להגדרות</button></div>`;
  $('#banner').innerHTML=ban;
  const fn={today:viewToday,pipeline:viewPipeline,leads:viewLeads,field:viewField,data:viewData,settings:viewSettings}[S.view]||viewToday;
  if(!keepView)$('#view').innerHTML=fn();
  if(vid){const e=document.getElementById(vid);if(e){e.focus();try{if(ss!==null)e.setSelectionRange(ss,se)}catch(x){}}}
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-view],[data-open],[data-done],[data-outcome],[data-snooze],[data-act],[data-stage],[data-zone],[data-paid],[data-touch]');
  if(!t)return;
  if(t.dataset.touch){const l=S.leads.get(t.dataset.touch);if(l&&S.canWrite){touch(l);addNote(l,'נשלחה הודעת וואטסאפ','system');persistLead(l,true)}return}
  if(t.dataset.view){S.view=t.dataset.view;S.openOutcome=null;S.settingsDirty=false;render();window.scrollTo({top:0});return}
  if(t.dataset.open){openDrawer({kind:'lead',id:t.dataset.open});return}
  if(t.dataset.done){if(!S.canWrite)return;S.openOutcome=S.openOutcome===t.dataset.done?null:t.dataset.done;render();return}
  if(t.dataset.outcome){outcome(t.dataset.id,t.dataset.outcome);return}
  if(t.dataset.snooze){if(!S.canWrite)return;snooze(t.dataset.snooze,+t.dataset.days||1);return}
  if(t.dataset.stage){const l=S.leads.get(S.drawer&&S.drawer.id);if(!l||!S.canWrite)return;const before=clone(l);setStage(l,t.dataset.stage);touch(l);persistLead(l);toast(`${stageLabel(t.dataset.stage)}. הפעולה הבאה ${relDay(l.nextAt).t}.`,()=>persistLead(norm(before,l.id)));return}
  if(t.dataset.zone&&t.classList.contains('chip')){S.fieldZone=t.dataset.zone;S.picked.clear();render();return}
  if(t.dataset.paid){if(!S.canWrite)return;for(const id of t.dataset.paid.split(',')){const l=S.leads.get(id);if(l){l.referralStatus='paid';addNote(l,'זיכוי הפניה שולם','system');persistLead(l,true)}}render();toast('סומן כשולם.');return}
  const a=t.dataset.act;
  switch(a){
    case 'new-lead':S.dupOk=false;openDrawer({kind:'new'});break;
    case 'import':openDrawer({kind:'import'});break;
    case 'close':closeDrawer();break;
    case 'create-lead':createLead();break;
    case 'dup-ok':S.dupOk=true;createLead();break;
    case 'do-import':runImport();break;
    case 'export':exportCSV();break;
    case 'save-settings':saveSettings();break;
    case 'undo':if(undoFn){const f=undoFn;undoFn=null;f();$('#toast').classList.remove('on')}break;
    case 'goto-trials':S.view='pipeline';render();break;
    case 'scroll-acts':{const el=$('#acts-over');el&&el.scrollIntoView({behavior:'smooth',block:'start'});break}
    case 'goto-field':S.view='field';if(t.dataset.zone)S.fieldZone=t.dataset.zone;render();window.scrollTo({top:0});break;
    case 'finish-round':finishRound();break;
    case 'del-examples':{const ex=all().filter(l=>l.example);for(const l of ex)removeLead(l.id);toast(`${ex.length} לידי דוגמה נמחקו.`);break}
    case 'copy-phone':{const l=S.leads.get(S.drawer.id);copyText(l.phone,'הטלפון הועתק.');break}
    case 'copy-ref':{const name=($('#r-name')||{}).value||'';if(!name.trim()){toast('כתבו קודם את שם המפנה.');return}copyText($('#r-link').textContent+encodeURIComponent(name.trim()),'הקישור הועתק.');break}
    case 'add-note':{const l=S.leads.get(S.drawer.id),tx=$('#d-note').value.trim();if(!tx)return;delete S.noteDraft[l.id];addNote(l,tx);touch(l);persistLead(l,true);renderDrawer();render();toast('ההערה נשמרה.');break}
    case 'ai-msg':aiMessage(S.drawer.id);break;
    case 'ai-update':aiUpdate(S.drawer.id);break;
    case 'ai-stop':if(S.ai&&S.ai.ctl)S.ai.ctl.abort();break;
    case 'ai-close':S.ai=null;renderDrawer();break;
    case 'ai-copy':copyText(($('#ai-text')||{}).value||'','ההודעה הועתקה.');break;
    case 'ai-apply':{const l=S.leads.get(S.drawer.id);if(!l||!S.ai)break;const before=clone(l);let n=0;
      S.ai.props.forEach((p,i)=>{const c=$('#ai-p-'+i);if(c&&c.checked){p.apply(l);n++}});
      addNote(l,S.ai.raw,'note');if(S.ai.summary)addNote(l,'סיכום: '+S.ai.summary,'ai');touch(l);
      delete S.noteDraft[l.id];S.ai=null;persistLead(l);toast(`עודכנו ${n} פרטים.`,()=>persistLead(norm(before,l.id)));break}
    case 'delete':S.confirmDel=true;renderDrawer();break;
    case 'delete-no':S.confirmDel=false;renderDrawer();break;
    case 'delete-yes':{const id=S.drawer.id,before=clone(S.leads.get(id));closeDrawer();removeLead(id);toast('הליד נמחק.',()=>persistLead(norm(before,id)));break}
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.drawer){closeDrawer();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-open][tabindex]')){e.preventDefault();openDrawer({kind:'lead',id:e.target.dataset.open})}
  if(e.key==='Enter'&&e.target.id==='n-company'){e.preventDefault();createLead()}
});
$('#scrim').addEventListener('click',closeDrawer);
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='f-q'){S.filters.q=e.target.value;render()}
  if(id==='d-note'&&S.drawer)S.noteDraft[S.drawer.id]=e.target.value;
  if(S.view==='settings'&&(id.startsWith('s-')||id==='r-name'))S.settingsDirty=true;
  if(id==='ai-text'&&S.ai){S.ai.text=e.target.value;const w=$('#ai-wa');const l=S.leads.get(S.drawer&&S.drawer.id);if(w&&l)w.href=waLink(l,S.ai.text)}
});
document.addEventListener('change',e=>{
  const el=e.target,id=el.id;
  if(id==='f-stage'||id==='f-source'||id==='f-zone'||id==='f-sort'){S.filters[id.slice(2)]=el.value;render();return}
  if(el.dataset.pick){el.checked?S.picked.add(el.dataset.pick):S.picked.delete(el.dataset.pick);render();return}
  if(!S.drawer||S.drawer.kind!=='lead'||!S.canWrite)return;
  const l=S.leads.get(S.drawer.id);if(!l)return;
  if(el.dataset.f){updateField(l,el.dataset.f,el);return}
  if(el.dataset.int){l.interest=$$('[data-int]').filter(c=>c.checked).map(c=>c.dataset.int);persistLead(l,true);render()}
});

$('#drawer').inert=true;
getSample().then(s=>{S.aiOk=!!s;if(S.drawer)renderDrawer()});
init();
})();
</script>
